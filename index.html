<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عالم أجيال · تجربة الزووم</title>
<style>
/* layout: one full-screen camera over a 1440×1024 world; HUD pinned to the screen edges and never zooms */
:root {
  --sky: #8EDCF0; --sea: #4FC7D4; --ink: #3A2318; --ink-soft: #7A5A48;
  --paper: #FFFFFF; --cream: #FFF7EC; --go: #2E8B2A; --go-deep: #1F6A1C; --gold: #F2A900; --rose: #F0436B; --dock-line: #6B3A1E;
  /* breathing room between the HUD and the screen edges */
  --edge-x: 32px; --edge-y: 12px;
  --font: 'Thmanyah Sans', 'Segoe UI', Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Bold.woff2) format('woff2'); font-weight: 600 900; font-display: swap; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sea); color: var(--ink); font-family: var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.stage { position: relative; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: linear-gradient(var(--sky) 0 45%, var(--sea) 70% 100%); cursor: grab; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: 1440px; height: 1024px; transform-origin: 0 0; will-change: transform;
}
/* the sea and sky run on past both sides of the island so wide screens never show empty bands */
.sea { position: absolute; left: -760px; top: -120px; width: 3001px; height: 1273px; background: url(img/map-wide.jpg) 0 0 / 100% 100% no-repeat; pointer-events: none; }
.world.flying { transition: transform .38s cubic-bezier(.3,.7,.2,1); }

/* islands live in world coordinates; their name ribbons counter-scale so they stay readable at every zoom */
.isl { position: absolute; width: 0; height: 0; }
.isl-hit { position: absolute; left: -84px; top: -86px; width: 168px; height: 176px; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 40%; }
.isl-art { position: absolute; left: -118px; top: -113px; width: 236px; height: 236px; pointer-events: none; animation: float 4.5s ease-in-out infinite; }
.isl:nth-child(2n) .isl-art { animation-delay: -2.2s; }
.isl-art img { width: 100%; height: 100%; }
.isl-shadow { position: absolute; left: -57px; top: 70px; width: 114px; height: 22px; border-radius: 50%; background: var(--ink); opacity: .16; filter: blur(3px); pointer-events: none; }
.isl-hit:hover ~ .isl-art, .isl-hit:focus-visible ~ .isl-art { animation-play-state: paused; transform: translateY(-8px); }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

.ribbon { position: absolute; left: 0; top: 92px; transform: translateX(-50%) scale(var(--inv, 1)); transform-origin: 50% 0;
  display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 18px 2px; white-space: nowrap; pointer-events: none;
  background: var(--c); color: var(--ink); border-radius: 8px; box-shadow: 0 4px 0 var(--d); font-weight: 800; font-size: 18px; line-height: 1; }
.ribbon::before, .ribbon::after { content: ""; position: absolute; top: 9px; width: 24px; height: 31px; background: var(--d); z-index: -1; }
.ribbon::before { right: -15px; clip-path: polygon(0 0, 100% 0, 72% 50%, 100% 100%, 0 100%); }
.ribbon::after { left: -15px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 28% 50%); }
.pill img, .dock a img, .lvl img, .zbtn img { max-width: none; flex-shrink: 0; }

.mark { position: absolute; pointer-events: none; border-radius: 999px; border: 4px solid var(--paper); box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; box-shadow: 0 4px 0 rgba(58,35,24,.18); }
.mark.done { left: -78px; top: -63px; width: 42px; height: 42px; background: #4CB944; color: var(--paper); }
.mark.next { left: -78px; top: -63px; width: 42px; height: 42px; background: var(--paper); color: var(--ink); }
.mark.tip { left: 40px; top: -71px; width: 38px; height: 38px; background: #FFF3C4; box-shadow: 0 3px 0 #F1C96B; animation: twinkle 1.8s ease-in-out infinite; }
.mark.tip img { width: 26px; height: 26px; }
.mark.count { width: 44px; height: 44px; background: #EEE8FF; box-shadow: 0 3px 0 #7B64DA; animation: bob 2.6s ease-in-out infinite; }
.mark.count img { width: 30px; height: 30px; max-width: none; }
.mark.count b { position: absolute; bottom: -7px; left: -7px; min-width: 22px; height: 22px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; border: 2px solid var(--paper); background: #7B64DA; color: var(--paper); font-size: 13px; line-height: 18px; text-align: center; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.15) rotate(12deg); } }
.tree { position: absolute; pointer-events: none; filter: drop-shadow(0 4px 3px rgba(58,35,24,.2)); }

.here { position: absolute; left: 1084px; top: 637px; width: 62px; height: 62px; padding: 6px; box-sizing: border-box; border: 0; border-radius: 999px; cursor: pointer;
  background: conic-gradient(#5BC236 0 60%, var(--paper) 60% 100%); animation: pulse 1.8s ease-out infinite; }
.here img { display: block; width: 100%; height: 100%; border-radius: 999px; border: 3px solid var(--paper); box-sizing: border-box; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,159,28,.55); } 50% { box-shadow: 0 0 0 14px rgba(255,159,28,0); } }

/* HUD */
.hud { position: absolute; z-index: 5; }
.top { top: calc(var(--edge-y) + env(safe-area-inset-top, 0px)); left: calc(var(--edge-x) + env(safe-area-inset-left, 0px)); right: calc(var(--edge-x) + env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.pill { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 14px; background: var(--paper); border-radius: 999px; box-shadow: 0 4px 0 #C6E6F7; font-weight: 800; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill img { width: 30px; height: 30px; margin: -4px 0; }
.me { padding: 4px 16px 4px 6px; gap: 10px; }
.me img { width: 38px; height: 38px; margin: 0; border-radius: 999px; }
.lvl { display: flex; align-items: center; gap: 2px; background: #FFF3C4; color: #8A5A00; border-radius: 999px; padding: 0 10px 0 6px; height: 28px; font-size: 15px; }
.lvl img { width: 22px; height: 22px; }
.stats { display: flex; gap: 8px; }
.bell { width: 46px; padding: 0; justify-content: center; position: relative; border: 0; cursor: pointer; }
.bell b { position: absolute; top: -4px; left: -4px; min-width: 22px; height: 22px; border-radius: 999px; background: var(--rose); color: var(--paper); font-size: 13px; line-height: 22px; text-align: center; border: 2px solid var(--paper); }

.zoom { left: calc(var(--edge-x) + env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
.zbtn { width: 58px; height: 58px; border-radius: 20px; border: 0; background: var(--paper); box-shadow: 0 5px 0 #C6E6F7; cursor: pointer;
  display: flex; align-items: center; justify-content: center; }
.zbtn svg { width: 28px; height: 28px; }
.zbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #C6E6F7; }
.zbtn[disabled] { opacity: .45; cursor: default; }
.zbtn.whole { width: auto; height: 48px; padding: 0 14px; gap: 6px; font-weight: 800; font-size: 15px; border-radius: 999px; }
.zbtn.whole img { width: 30px; height: 30px; margin: -4px 0; }

.me, .search { border: 0; cursor: pointer; }
.search { width: 46px; padding: 0; justify-content: center; }
/* shortcut to the unfinished story, shown only when its avatar is off-screen */
.resume { left: calc(var(--edge-x) + env(safe-area-inset-left, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px; height: 54px; padding: 4px 16px 4px 4px; border: 0; border-radius: 999px; background: var(--paper); box-shadow: 0 4px 0 #E0A35C; cursor: pointer; font-weight: 800; font-size: 16px; }
.resume i { width: 46px; height: 46px; padding: 4px; box-sizing: border-box; border-radius: 999px; background: conic-gradient(#5BC236 0 60%, #EFE7DB 60% 100%); }
.resume img { display: block; width: 100%; height: 100%; border-radius: 999px; border: 2px solid var(--paper); box-sizing: border-box; }
.time { top: calc(var(--edge-y) + 60px + env(safe-area-inset-top, 0px)); left: calc(var(--edge-x) + env(safe-area-inset-left, 0px)); color: #2D6A12; height: 36px; font-size: 16px; box-shadow: 0 3px 0 #8CCDE0; }
.time img { width: 26px; height: 26px; }

/* game-style dock: a glossy amber bar with a thick chocolate outline */
.dock { left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border: 4px solid var(--dock-line); border-radius: 999px;
  background: linear-gradient(#FFD98C, #F7B347 55%, #EE9C2E); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(166,84,20,.35), 0 5px 0 var(--dock-line), 0 12px 20px rgba(58,35,24,.25); }
.dock a { display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 18px; border: 3px solid transparent; border-radius: 999px; color: #4A2612; text-decoration: none; font-weight: 800; font-size: 17px; white-space: nowrap; }
.dock a:hover { background: rgba(255,255,255,.25); }
.dock a img { width: 36px; height: 36px; margin: -6px 0; }
.dock a[aria-current="page"] { background: linear-gradient(#F4823F, #D6531E); color: #FFFFFF; border-color: var(--dock-line); box-shadow: inset 0 3px 0 rgba(255,255,255,.35); text-shadow: 0 1px 0 rgba(107,58,30,.5); }
.rank { background: #FFF6E6; color: #C9372C; border: 2px solid var(--dock-line); border-radius: 999px; padding: 0 9px; height: 26px; display: flex; align-items: center; font-size: 15px; }

.mission { right: calc(var(--edge-x) + env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: row-reverse; align-items: center; gap: 4px; }
.mission .bubble { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 999px; padding: 6px 6px 6px 8px; box-shadow: 0 5px 0 #F1C96B; border: 0; cursor: pointer; text-align: right; }
.mission .bubble b { display: block; font-size: 19px; }
.dashes { display: flex; gap: 5px; margin-top: 4px; }
.dashes i { width: 22px; height: 7px; border-radius: 999px; background: #EFE7DB; }
.dashes i:nth-child(1) { background: #4CB944; } .dashes i:nth-child(2) { background: #FF9F1C; }
.play { width: 46px; height: 46px; border-radius: 999px; background: var(--go); box-shadow: 0 4px 0 var(--go-deep); display: flex; align-items: center; justify-content: center; }
.nour { width: 110px; height: 110px; transform: scaleX(-1); -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 70%); mask-image: radial-gradient(circle, #000 52%, transparent 70%); }

.hint { left: 50%; top: calc(var(--edge-y) + 64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: rgba(58,35,24,.82); color: var(--paper); border-radius: 999px; padding: 8px 18px; font-size: 15px; font-weight: 700; white-space: nowrap; transition: opacity .4s; pointer-events: none; }
.hint.gone { opacity: 0; }

/* region page stand-in */
.region { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); background: rgba(31,58,72,.45); }
.card { isolation: isolate; width: min(440px, 100%); background: var(--cream); border: 6px solid var(--paper); border-radius: 36px; padding: 18px 24px 26px; box-shadow: 0 10px 0 rgba(31,111,209,.25); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.card .art { width: 220px; height: 220px; margin: -10px 0 -8px; }
.card .ribbon { position: relative; left: auto; top: auto; transform: none; }
.card p { margin: 6px 0 0; color: var(--ink-soft); font-size: 17px; font-weight: 600; max-width: 32ch; text-wrap: balance; }
.card .note { font-size: 13px; color: var(--ink-soft); opacity: .8; }
.back { margin-top: 10px; height: 56px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--go); color: var(--paper); font-weight: 800; font-size: 19px; box-shadow: 0 5px 0 var(--go-deep); cursor: pointer; }

@media (max-width: 760px) {
  .me .name, .stats .pill:nth-child(3), .time span, .dock a span, .mission .nour, .zbtn.whole span { display: none; }
  .pill { height: 40px; padding: 0 10px; font-size: 16px; }
  .dock a { padding: 0 14px; }
  .zbtn { width: 50px; height: 50px; }
  :root { --edge-x: 14px; }
  .mission { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .hint { white-space: normal; width: max-content; max-width: calc(100% - 32px); text-align: center; border-radius: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .isl-art, .mark.tip, .mark.count, .here { animation: none; }
  .world.flying { transition: none; }
}
</style>
<style>body { margin: 0; } img { max-width: 100%; }</style>
</head>
<body>
<div class="stage" id="stage" dir="rtl">
  <div class="world" id="world">
    <div class="sea" aria-hidden="true"></div>
    <div id="islands"></div>
    <button type="button" class="here" id="here" aria-label="أنت هنا: أكمل قصة الأرنب الصادق، أنجزت 60%"><img src="img/avatar.png" alt=""></button>
  </div>

  <div class="hud top">
    <button type="button" class="pill me" aria-label="غرفتي: يوسف، المستوى 7"><img src="img/avatar.png" alt=""><span class="name">يوسف</span><span class="lvl"><img src="img/I-08.png" alt="">مستوى 7</span></button>
    <div class="stats">
      <button type="button" class="pill search" aria-label="ابحث"><img src="img/I-05.png" alt=""></button>
      <span class="pill" title="النقاط"><img src="img/I-06.png" alt="">3,240</span>
      <span class="pill" title="أيام متتالية"><img src="img/I-07.png" alt="">5</span>
      <span class="pill" title="الشارات"><img src="img/badge.png" alt="">12</span>
      <button type="button" class="pill bell" aria-label="الإشعارات، 3 غير مقروءة"><img src="img/I-09.png" alt=""><b>3</b></button>
    </div>
  </div>
  <span class="hud pill time" title="باقي 35 دقيقة من وقت اليوم"><img src="img/I-10.png" alt=""><bdi>35 د</bdi></span>

  <div class="hud zoom" role="group" aria-label="التحكم في الخريطة">
    <button type="button" class="zbtn" id="zin" aria-label="قرّب"><svg viewBox="0 0 24 24" fill="none" stroke="#3A2318" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" class="zbtn whole" id="zall" hidden><img src="img/I-01.png" alt=""><span>الخريطة كلها</span></button>
  </div>

  <button type="button" class="hud resume" id="resume" hidden aria-label="أكمل قصة الأرنب الصادق، أنجزت 60%"><i><img src="img/avatar.png" alt=""></i>أكمل</button>

  <div class="hud mission">
    <button type="button" class="bubble" id="mission" aria-label="مهمة اليوم مع نور: رحلة الصدق، المحطة 2 من 3">
      <span><b>رحلة الصدق</b><span class="dashes" aria-hidden="true"><i></i><i></i><i></i></span></span>
      <span class="play" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M17 5v14L6 12z" fill="#fff"/></svg></span>
    </button>
    <img class="nour" src="img/nour.webp" alt="">
  </div>

  <nav class="hud dock" aria-label="التنقل السريع">
    <a href="#" aria-current="page"><img src="img/I-01.png" alt=""><span>الخريطة</span></a>
    <a href="#"><img src="img/I-02.png" alt=""><span>كل الأقسام</span></a>
    <a href="#"><img src="img/I-03.png" alt=""><span>غرفتي</span></a>
    <a href="#" aria-label="المتصدرون، ترتيبك 12"><img src="img/I-04.png" alt=""><span>المتصدرون</span><span class="rank">12</span></a>
  </nav>

  <div class="hud hint" id="hint">اسحب الخريطة، وقرّب بالعجلة أو بإصبعين أو بزرار +، واضغط على أي جزيرة</div>

  <div class="region" id="region" hidden role="dialog" aria-modal="true" aria-labelledby="rg-title">
    <div class="card">
      <img class="art" id="rg-art" src="" alt="">
      <span class="ribbon" id="rg-title"></span>
      <p id="rg-sub"></p>
      <span class="note">هنا تفتح صفحة المنطقة في المنصة</span>
      <button type="button" class="back" id="rg-back">العودة إلى الخريطة</button>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 1440, H = 1024, MAX_ZOOM = 2.5;
  // painted sea beyond the island, in world units
  const SEA_L = -760, SEA_R = 2241, SEA_T = -120, SEA_B = 1153;
  const ISLANDS = [
    { id: 'ai', title: 'ورشة السحر', sub: 'اصنع قصة أو فيديو أنت بطله', x: 1285, y: 196, c: '#B9A8F7', d: '#7B64DA', counts: [['I-11', 3, 44, -92], ['I-14', 1, 84, -44]], aria: 'باقي 3 قصص وفيديو واحد' },
    { id: 'peak', title: 'قمة الأبطال', sub: 'شارك في المسابقات', x: 260, y: 330, c: '#FF7A6B', d: '#E0584A' },
    { id: 'letters', title: 'واحة الحروف', sub: 'تعلّم الحروف والأرقام', x: 790, y: 300, c: '#FFD43B', d: '#E0B000' },
    { id: 'forest', title: 'غابة المعرفة', sub: 'فيديوهات وكتب تعليمية', x: 1130, y: 430, c: '#5CB8F5', d: '#3D96D6', mark: 'done' },
    { id: 'colors', title: 'وادي الألوان', sub: 'ارسم ولوّن · مقترح لك: ألوان قوس قزح', x: 450, y: 500, c: '#FFA94D', d: '#E58A2B', tip: true },
    { id: 'garden', title: 'حديقة القيم', sub: 'زرعتَ 3 قيم، وقيمة الصدق تكبر الآن', x: 760, y: 520, c: '#67CFA9', d: '#3FB396', mark: 'next',
      trees: [[5, 51, 39, 'tree'], [0, 78, 34, 'tree'], [108, 88, 35, 'tree'], [81, 94, 30, 'tree-young']] },
    { id: 'beach', title: 'شاطئ الحكايات', sub: 'اقرأ واستمع لقصص ممتعة', x: 1170, y: 720, c: '#FF8FA8', d: '#E0607F' },
    { id: 'quran', title: 'واحة القرآن', sub: 'جزء عمّ', x: 760, y: 760, c: '#7CCB4C', d: '#5DAA33' },
    { id: 'games', title: 'كثبان الألعاب', sub: 'ألعاب تعليمية · مقترح لك: أطعم الحيوانات', x: 310, y: 760, c: '#9C86F2', d: '#7B64DA', tip: true }
  ];

  const stage = document.getElementById('stage'), world = document.getElementById('world');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let cam = { s: 1, x: 0, y: 0 };

  // build the islands
  const box = document.getElementById('islands');
  for (const i of ISLANDS) {
    const el = document.createElement('div');
    el.className = 'isl';
    el.style.left = i.x + 'px'; el.style.top = i.y + 'px';
    // what is left in the AI workshop floats over its island, like the suggestion stars
    const counts = (i.counts || []).map(([icon, n, x, y], k) => `<span class="mark count" aria-hidden="true" style="left:${x}px;top:${y}px;animation-delay:-${k * .9}s"><img src="img/${icon}.png" alt=""><b>${n}</b></span>`).join('');
    const trees = (i.trees || []).map(([x, y, s, img]) => `<img class="tree" src="img/${img}.png" alt="" style="left:${x - 76}px;top:${y - 79}px;width:${s}px;height:${s}px">`).join('');
    el.innerHTML = `
      <button type="button" class="isl-hit" aria-label="${i.title}، ${i.sub}${i.aria ? '. ' + i.aria : ''}"></button>
      <span class="isl-shadow"></span>
      <span class="isl-art"><img src="img/${i.id}.png" alt="" draggable="false"></span>
      ${trees}
      ${i.mark === 'done' ? '<span class="mark done" aria-hidden="true">✓</span>' : ''}
      ${i.mark === 'next' ? '<span class="mark next" aria-hidden="true">3</span>' : ''}
      ${i.tip ? '<span class="mark tip" aria-hidden="true"><img src="img/I-15.png" alt=""></span>' : ''}
      ${counts}
      <span class="ribbon" style="--c:${i.c};--d:${i.d}">${i.title}</span>`;
    el.querySelector('.isl-hit').addEventListener('click', (e) => { if (!stage.dataset.moved) flyTo(i); });
    box.appendChild(el);
  }

  // camera
  const view = () => ({ w: stage.clientWidth, h: stage.clientHeight });
  const fit = () => { const v = view(); return Math.min(v.w / W, v.h / H); };
  function clamp(c) {
    const v = view(), min = fit(), s = Math.min(Math.max(c.s, min), min * MAX_ZOOM);
    const ww = W * s, wh = H * s;
    const sw = (SEA_R - SEA_L) * s;
    const x = sw <= v.w ? (v.w - ww) / 2 : Math.min(-SEA_L * s, Math.max(v.w - SEA_R * s, c.x));
    const sh = (SEA_B - SEA_T) * s;
    const y = sh <= v.h ? (v.h - wh) / 2 : Math.min(-SEA_T * s, Math.max(v.h - SEA_B * s, c.y));
    return { s, x, y };
  }
  function apply(c, animate) {
    cam = clamp(c);
    world.classList.toggle('flying', !!animate && !reduce.matches);
    world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
    // labels keep a readable size on screen, within limits
    world.style.setProperty('--inv', Math.min(2.2, Math.max(0.55, 1 / cam.s)).toFixed(3));
    const min = fit(), v = view();
    document.getElementById('zin').disabled = cam.s >= min * MAX_ZOOM - 1e-3;
    document.getElementById('zall').hidden = cam.s <= min * 1.02;
    // the resume shortcut appears only while the child's avatar on the beach is out of sight
    const hx = cam.x + 1115 * cam.s, hy = cam.y + 668 * cam.s;
    document.getElementById('resume').hidden = hx > 0 && hx < v.w && hy > 70 && hy < v.h - 90;
  }
  function zoomAt(factor, px, py, animate) {
    const s = cam.s * factor;
    apply({ s, x: px - (px - cam.x) * (s / cam.s), y: py - (py - cam.y) * (s / cam.s) }, animate);
  }
  const whole = (animate) => { const s = fit(), v = view(); apply({ s, x: (v.w - W * s) / 2, y: (v.h - H * s) / 2 }, animate); };

  // tap an island: the camera flies in, then the region opens
  function flyTo(i) {
    hideHint();
    const v = view(), s = fit() * 2.2;
    apply({ s, x: v.w / 2 - i.x * s, y: v.h / 2 - (i.y + 20) * s }, true);
    setTimeout(() => openRegion(i), reduce.matches ? 0 : 380);
  }
  const region = document.getElementById('region');
  // regions that already have their own screen
  const PAGES = { forest: 'forest.html', beach: 'beach.html' };
  function openRegion(i) {
    const to = i.href || PAGES[i.id];
    if (to) { location.href = to; return; }
    document.getElementById('rg-art').src = `img/${i.id}.png`;
    const t = document.getElementById('rg-title');
    t.textContent = i.title; t.style.setProperty('--c', i.c); t.style.setProperty('--d', i.d);
    document.getElementById('rg-sub').textContent = i.sub;
    region.hidden = false;
    document.getElementById('rg-back').focus();
  }
  const closeRegion = () => { region.hidden = true; };
  document.getElementById('rg-back').addEventListener('click', closeRegion);
  region.addEventListener('click', (e) => { if (e.target === region) closeRegion(); });
  const story = () => flyTo({ ...ISLANDS.find((x) => x.id === 'beach'), title: 'الأرنب الصادق', sub: 'أكمل القصة من الصفحة 6', href: 'story.html?resume=1' });
  document.getElementById('here').addEventListener('click', () => { if (!stage.dataset.moved) story(); });
  document.getElementById('resume').addEventListener('click', story);
  document.getElementById('mission').addEventListener('click', () => flyTo({ ...ISLANDS.find((x) => x.id === 'garden'), title: 'رحلة الصدق', sub: 'المحطة 2 من 3 مع نور' }));

  // buttons and keys
  const centre = () => { const v = view(); return [v.w / 2, v.h / 2]; };
  document.getElementById('zin').addEventListener('click', () => { hideHint(); zoomAt(1.45, ...centre(), true); });
  document.getElementById('zall').addEventListener('click', () => whole(true));
  addEventListener('keydown', (e) => {
    if (!region.hidden) { if (e.key === 'Escape') closeRegion(); return; }
    const step = 80, m = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] }[e.key];
    if (m) { e.preventDefault(); apply({ ...cam, x: cam.x + m[0], y: cam.y + m[1] }, true); }
    if (e.key === '+' || e.key === '=') zoomAt(1.45, ...centre(), true);
    if (e.key === '-') zoomAt(1 / 1.45, ...centre(), true);
  });

  // wheel zoom around the pointer
  stage.addEventListener('wheel', (e) => {
    if (!region.hidden) return;
    e.preventDefault(); hideHint();
    const r = stage.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top, false);
  }, { passive: false });

  // drag to pan, two fingers to pinch
  const pts = new Map(); let last = null, start = null;
  const mid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; };
  stage.addEventListener('pointerdown', (e) => {
    if (!region.hidden || e.target.closest('.hud')) return;
    const r = stage.getBoundingClientRect();
    pts.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top });
    if (pts.size === 1) { start = { ...pts.get(e.pointerId) }; delete stage.dataset.moved; }
    last = pts.size === 2 ? mid() : { ...pts.get(e.pointerId) };
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const r = stage.getBoundingClientRect();
    pts.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top });
    if (pts.size === 2) {
      const m = mid();
      if (last && last.d) { zoomAt(m.d / last.d, m.x, m.y, false); apply({ ...cam, x: cam.x + m.x - last.x, y: cam.y + m.y - last.y }, false); }
      last = m; stage.dataset.moved = '1'; hideHint();
    } else {
      const p = pts.get(e.pointerId);
      if (start && Math.hypot(p.x - start.x, p.y - start.y) > 8) {
        if (!stage.dataset.moved) { stage.dataset.moved = '1'; stage.classList.add('dragging'); try { stage.setPointerCapture(e.pointerId); } catch (_) {} hideHint(); }
        apply({ ...cam, x: cam.x + p.x - last.x, y: cam.y + p.y - last.y }, false);
      }
      last = { ...p };
    }
  });
  const end = (e) => {
    pts.delete(e.pointerId);
    if (pts.size === 1) last = { ...[...pts.values()][0] };
    if (!pts.size) { stage.classList.remove('dragging'); setTimeout(() => delete stage.dataset.moved, 0); }
  };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => stage.addEventListener(t, end));

  const hint = document.getElementById('hint');
  function hideHint() { hint.classList.add('gone'); }
  setTimeout(hideHint, 7000);

  addEventListener('resize', () => apply(cam, false));
  whole(false);
})();
</script>
</body>
</html>
