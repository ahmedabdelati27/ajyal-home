<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="guest.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFF7EC">
<link rel="apple-touch-icon" href="/img/app-icon/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أجيال">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ارسم بحرية · وادي الألوان</title>
<link rel="stylesheet" href="viewer.css">
<script src="sfx.js"></script>
<script>Sfx.taps('.btn, .pill, .tool, .size');</script>
<style>
.bg { background: url(img/colors/valley-hero.jpg) center 70% / cover; }
.bg::after { content: ''; position: absolute; inset: 0; background: rgba(240,236,255,.55); }
.app { grid-template-rows: auto 1fr; }
.ttl h1 { text-shadow: 0 3px 0 #4B3F93, 2px 0 0 #4B3F93, -2px 0 0 #4B3F93, 0 -2px 0 #4B3F93; }

/* the studio: tools, a white sheet, the colors */
.studio { min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; justify-items: center; gap: 22px; }
.board { position: relative; height: min(100%, calc((100vw - 460px) * .75)); max-height: 100%; aspect-ratio: 4 / 3; border: 10px solid #FFFFFF; border-radius: 30px; background: #FFFFFF; overflow: hidden; box-shadow: 0 10px 0 rgba(75,63,147,.18), 0 24px 40px rgba(0,0,0,.18); touch-action: none; cursor: crosshair; }
.board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.colors { display: grid; grid-template-columns: repeat(2, 60px); gap: 12px; padding: 16px; border-radius: 30px; background: rgba(255,255,255,.88); box-shadow: 0 6px 0 rgba(75,63,147,.15); }
.sw { width: 60px; height: 60px; border-radius: 50%; border: 4px solid #FFFFFF; background: var(--c); box-shadow: 0 0 0 2px rgba(0,0,0,.08), 0 4px 0 rgba(0,0,0,.15); transition: transform .15s; }
.sw[aria-pressed="true"] { transform: scale(1.15); box-shadow: 0 0 0 4px #3A2318, 0 4px 0 rgba(0,0,0,.15); }
.picked { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 999px; background: #FFFFFF; font-size: 18px; font-weight: 800; }
.picked i { width: 22px; height: 22px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px rgba(0,0,0,.12); }

.tools { display: flex; flex-direction: column; gap: 10px; width: 200px; }
.row { display: flex; gap: 8px; }
.tool { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 12px; border: 0; border-radius: 999px; background: #FFFFFF; font-size: 17px; font-weight: 800; box-shadow: 0 5px 0 rgba(75,63,147,.18); }
.tool svg { width: 24px; height: 24px; flex-shrink: 0; }
.tool:disabled { opacity: .45; cursor: default; }
/* a tool on its own line keeps its height (flex: 1 is for sharing a row) */
.tools > .tool { flex: none; }
.tool[aria-pressed="true"] { background: #EDE9FF; color: #4B3F93; box-shadow: 0 0 0 3px #7B6CF0, 0 5px 0 rgba(75,63,147,.18); }
.sizes { display: flex; justify-content: space-around; align-items: center; height: 64px; padding: 0 8px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 5px 0 rgba(75,63,147,.18); }
.size { width: 48px; height: 48px; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; }
.size i { display: block; width: var(--d); height: var(--d); border-radius: 50%; background: #3A2318; }
.size[aria-pressed="true"] { background: #EDE9FF; box-shadow: 0 0 0 3px #7B6CF0; }
.tool.save { height: 64px; background: var(--go); color: #FFFFFF; font-size: 22px; box-shadow: 0 6px 0 var(--go-deep); }
/* «سحر نور»: Nour the witch says what the drawing looks like and draws it again in a style the child picks */
.tool.magic { height: 64px; padding-inline-start: 4px; background: linear-gradient(#9B7BF5, #6A4FD8); color: #FFFFFF; font-size: 19px; box-shadow: 0 6px 0 #4B3F93; }
.tool.magic img { width: 58px; height: 58px; margin-block: -10px -4px; filter: drop-shadow(0 2px 2px rgba(40,20,90,.35)); }

.spell { align-items: safe center; overflow-y: auto; padding-top: 100px; background: rgba(40,28,90,.62); }
.spell .card { width: min(720px, 100%); padding: 104px 30px 26px; background: linear-gradient(#FBF8FF, #F1ECFF); }
.spell .owl { width: 200px; height: 200px; top: -96px; }
.spell.busy .owl { animation: cast 1s ease-in-out infinite; }
@keyframes cast { 25% { rotate: -8deg; } 75% { rotate: 8deg; } }
.spell h2 { color: #5A3FC0; }
.spell .x { position: absolute; top: 14px; left: 14px; width: 48px; height: 48px; border: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 0 rgba(75,63,147,.2); display: grid; place-items: center; }
.spell .x svg { width: 22px; height: 22px; }
.spell [data-step][hidden] { display: none; }
.spell .left { display: inline-block; margin-top: 14px; padding: 4px 14px; border-radius: 999px; background: #EDE9FF; color: #4B3F93; font-size: 16px; }
.styles { display: flex; justify-content: center; gap: 18px; margin-top: 18px; }
.styles button { width: 180px; padding: 10px 10px 12px; border: 0; border-radius: 26px; background: #FFFFFF; box-shadow: 0 6px 0 rgba(75,63,147,.18); font-size: 22px; font-weight: 800; transition: transform .15s; }
.styles button:hover { transform: translateY(-3px); }
.styles img { width: 100%; aspect-ratio: 1; border-radius: 18px; margin-bottom: 8px; }
/* the drawing and what Nour made of it, side by side */
.pair { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
.pair figure { margin: 0; width: 220px; }
.pair figure img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 5px #FFFFFF, 0 8px 18px rgba(75,63,147,.2); }
.pair figure.made img { object-fit: cover; animation: appear .6s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes appear { from { opacity: 0; transform: scale(.6) rotate(-6deg); filter: blur(6px); } }
.pair figcaption { margin-top: 10px; font-size: 17px; font-weight: 800; color: #6B5A48; }
.pair .wand { font-size: 34px; color: #F7B347; }
.think .pair figure { width: 200px; position: relative; }
.think .pair figure::after { content: '✦ ✧ ✦'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 46px; color: #F7B347; text-shadow: 0 0 12px #FFFFFF; animation: twinkle 1s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .25; transform: scale(1.15) rotate(10deg); } }
.others { margin-top: 14px; }
.others p { margin: 0 0 8px !important; font-size: 18px !important; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chips button { height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: #FFFFFF; font-size: 18px; font-weight: 800; box-shadow: 0 0 0 2px #DCD3FF, 0 4px 0 #DCD3FF; }
.chips button[aria-pressed="true"] { background: #6A4FD8; color: #FFFFFF; box-shadow: 0 4px 0 #4B3F93; }
.chips.all { margin-top: 10px; }
.chips.all[hidden] { display: none; }
.spell .btn.magic { background: #6A4FD8; color: #FFFFFF; box-shadow: 0 5px 0 #4B3F93; }

/* saved: private first, and the child may send it for publishing */
.saved .card img.work { width: 260px; aspect-ratio: 4 / 3; height: auto; border-radius: 20px; object-fit: cover; box-shadow: 0 0 0 6px #FFFFFF, 0 8px 20px rgba(0,0,0,.15); margin: 0 auto 6px; }
.saved .note { margin: 0; font-size: 16px; color: var(--ink-soft); }
.saved [hidden] { display: none; }

@media (max-width: 900px) {
  .studio { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; gap: 10px; }
  .board { height: auto; width: min(100%, 70dvh); border-width: 6px; border-radius: 22px; }
  .colors { grid-auto-flow: column; grid-template-columns: none; grid-template-rows: 44px; max-width: 100%; overflow-x: auto; padding: 8px; gap: 8px; order: 2; }
  .sw { width: 44px; height: 44px; border-width: 3px; }
  .picked { display: none; }
  .tools { order: 3; width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .row { display: contents; }
  /* in rows: the pens and clearing, the sizes with undo and redo, then Nour's magic beside saving */
  #clear { order: 1; } .sizes { order: 2; } #undo, #redo { order: 3; } .tool.magic, .tool.save { order: 4; }
  .tool { height: 48px; font-size: 15px; padding: 0 8px; }
  .tool span { display: none; }
  .sizes { grid-column: span 2; height: 48px; }
  .size { width: 40px; height: 40px; }
  .tool.save { grid-column: span 2; height: 48px; font-size: 17px; }
  .tool.magic { grid-column: span 2; height: 48px; font-size: 17px; }
  .tool.magic span { display: inline; }
  .tool.magic img { width: 46px; height: 46px; margin-block: -8px -2px; }
  .spell { align-items: safe center; overflow-y: auto; padding: 76px 14px 14px; }
  .spell .card { padding: 84px 18px 18px; border-radius: 28px; }
  .spell .owl { width: 150px; height: 150px; top: -74px; }
  .spell h2 { font-size: 28px; } .spell p { font-size: 16px; }
  .spell .btns { margin-top: 14px; gap: 8px; } .spell .btn { height: 48px; padding: 0 20px; font-size: 17px; }
  .styles { gap: 12px; } .styles button { width: 140px; font-size: 18px; }
  .pair { gap: 8px; } .pair figure, .think .pair figure { width: 150px; } .pair .wand { font-size: 24px; }
  .pair figcaption { font-size: 15px; margin-top: 8px; }
  .chips button { height: 40px; padding: 0 14px; font-size: 16px; }
}
/* a phone upright: every color in two rows, nothing hidden off to the side */
@media (max-width: 600px) and (min-height: 501px) {
  .colors { grid-auto-flow: row; grid-template-columns: repeat(6, 46px); grid-template-rows: none; overflow: visible; padding: 10px; gap: 10px 8px; }
  .sw { width: 46px; height: 46px; }
  .tool, .sizes, .tool.save, .tool.magic { height: 52px; }
  .saved .card h2 { font-size: 28px; }
}
/* a phone on its side: tools on the right, the sheet as big as the height allows, the colors in a block on the left */
@media (max-height: 500px) {
  .studio { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); gap: 12px; }
  .board { width: auto; height: 100%; max-width: 100%; border-width: 5px; border-radius: 20px; box-shadow: 0 5px 0 rgba(75,63,147,.18), 0 12px 20px rgba(0,0,0,.18); }
  .tools { order: 0; width: 132px; grid-template-columns: repeat(2, 1fr); grid-auto-flow: row dense; gap: 8px; }
  .tool { height: 44px; box-shadow: 0 4px 0 rgba(75,63,147,.18); }
  .sizes { height: 46px; padding: 0 4px; box-shadow: 0 4px 0 rgba(75,63,147,.18); }
  .size { width: 38px; height: 38px; }
  .tool.save { height: 48px; font-size: 16px; }
  .colors { order: 2; grid-auto-flow: row; grid-template-columns: repeat(3, 44px); grid-template-rows: none; overflow: visible; padding: 10px; gap: 8px; border-radius: 22px; }
  .saved .card img.work { width: 150px; border-radius: 14px; }
  .saved .card { padding-top: 16px; }
  .saved .note { font-size: 13px; }
  .tool.magic { grid-column: span 2; height: 48px; font-size: 15px; }
  .tool.magic img { width: 40px; height: 40px; }
  /* sideways the sheet is low: Nour sits beside the card's title instead of above it */
  .spell { padding: 12px; }
  .spell .card { padding: 14px 18px 14px; }
  .spell .owl { width: 84px; height: 84px; top: 6px; left: auto; right: 10px; transform: none; }
  .spell h2 { padding-inline: 70px; }
  .styles button { width: 118px; padding: 6px 6px 8px; font-size: 16px; } .styles img { margin-bottom: 4px; border-radius: 12px; }
  .pair { margin-top: 8px; } .pair figure, .think .pair figure { width: 118px; } .pair figure img { border-radius: 14px; }
  .others { margin-top: 8px; } .chips button { height: 36px; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <a class="pill back" href="colors.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>وادي الألوان</span></a>
    <div class="ttl"><h1>ارسم بحرية</h1></div>
    <span class="pill time" title="الوقت المتبقي اليوم"><img src="img/hud/clock.png" alt=""><span>35 د</span></span>
  </header>

  <main class="studio">
    <div class="tools">
      <div class="row" role="group" aria-label="الأداة">
        <button class="tool" type="button" data-tool="pen" aria-pressed="true" aria-label="القلم"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.5-5L16 4.5l3.5 3.5L9 18.5z" fill="#FFC93C"/><path d="M14 6.5l3.5 3.5"/></svg><span>القلم</span></button>
        <button class="tool" type="button" data-tool="brush" aria-pressed="false" aria-label="الفرشاة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-6 4-4-4z" fill="#B88A5A"/><path d="M10 10c-4 0-6 3-6 6 0 2-1 3-1 4 4 0 9-1 9-6"/></svg><span>الفرشاة</span></button>
      </div>
      <div class="row">
        <button class="tool" type="button" data-tool="eraser" aria-pressed="false" aria-label="الممحاة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M8 20l-4-4 10-10 6 6-8 8z" fill="#F7A8C4"/><path d="M8 20h12"/></svg><span>الممحاة</span></button>
      </div>
      <div class="sizes" role="group" aria-label="حجم القلم">
        <button class="size" type="button" data-size="8" aria-label="رفيع" aria-pressed="false"><i style="--d:8px"></i></button>
        <button class="size" type="button" data-size="18" aria-label="متوسط" aria-pressed="true"><i style="--d:15px"></i></button>
        <button class="size" type="button" data-size="36" aria-label="عريض" aria-pressed="false"><i style="--d:24px"></i></button>
      </div>
      <div class="row">
        <button class="tool" type="button" id="undo" disabled aria-label="تراجع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 7H8.5a4.5 4.5 0 0 0 0 9H17"/><path d="M12 3l3.5 4L12 11"/></svg></button>
        <button class="tool" type="button" id="redo" disabled aria-label="إعادة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7h6.5a4.5 4.5 0 0 1 0 9H7"/><path d="M12 3L8.5 7 12 11"/></svg></button>
      </div>
      <button class="tool" type="button" id="clear" aria-label="امسح اللوحة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="13" height="15" rx="2" fill="#FFFFFF"/><path d="M19 3l.8 1.7 1.7.8-1.7.8L19 8l-.8-1.7-1.7-.8 1.7-.8z" fill="#F7B347" stroke="none"/></svg><span>امسح اللوحة</span></button>
      <button class="tool magic" type="button" id="magic"><img src="img/magic/nour-witch.png" alt=""><span>سحر نور</span></button>
      <button class="tool save" type="button" id="save">احفظ رسمتي</button>
    </div>
    <div class="board" id="board" role="img" aria-label="لوحة الرسم">
      <canvas id="art" width="1200" height="900"></canvas>
      <canvas id="live" width="1200" height="900"></canvas>
    </div>
    <div class="colors" id="colors" role="group" aria-label="الألوان"></div>
  </main>
</div>

<div class="done saved" id="saved" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="saved-t">
    <img class="work" id="saved-img" alt="">
    <h2 id="saved-t">رسمة رائعة يا عمر!</h2>
    <p id="saved-p">حفظناها في «إبداعاتي»، وهي خاصة بك</p>
    <p class="note" id="saved-note">يمكنك إرسالها لينشرها فريق أجيال داخل المنصة بعد مراجعتها</p>
    <div class="btns" id="saved-btns">
      <button class="btn go" type="button" id="publish">أرسلها للنشر</button>
      <button class="btn soft" type="button" id="again">ارسم رسمة جديدة</button>
      <a class="btn soft" href="colors.html">العودة إلى الوادي</a>
    </div>
  </div>
</div>

<div class="done spell" id="spell" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="spell-t">
    <img class="owl" src="img/magic/nour-witch.png" alt="">
    <button class="x" type="button" id="spell-x" aria-label="أغلق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="spell-t"></h2>
    <p id="spell-p"></p>
    <!-- the child picks how Nour draws it; there is nothing to write -->
    <div data-step="pick">
      <div class="styles" id="styles"></div>
      <span class="left" id="spell-left"></span>
    </div>
    <div data-step="think" class="think">
      <div class="pair"><figure><img class="mine" alt="رسمتك"></figure></div>
    </div>
    <div data-step="show">
      <div class="pair">
        <figure><img class="mine" alt=""><figcaption>رسمتك</figcaption></figure>
        <span class="wand" aria-hidden="true">✦</span>
        <figure class="made"><img id="made" alt=""><figcaption>بسحر نور</figcaption></figure>
      </div>
      <div class="others">
        <p>أم هي…؟</p>
        <div class="chips" id="others"></div>
        <div class="chips all" id="all" hidden></div>
      </div>
      <div class="btns">
        <button class="btn magic" type="button" id="keep">احفظها في إبداعاتي</button>
        <button class="btn soft" type="button" id="back">ارجع إلى رسمتي</button>
      </div>
    </div>
    <div data-step="none">
      <div class="btns"><button class="btn soft" type="button" id="none-back">ارجع إلى رسمتي</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="valley.js"></script>
<script src="magic.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { PALETTE, works, say } = Valley;
  const W = 1200, H = 900, DRAFT = 'ajyal.draw.draft';
  const art = $('art').getContext('2d'), live = $('live').getContext('2d');
  // every stroke is kept, so undo and redo simply draw the sheet again
  let strokes = [], redo = [], base = null, now = null;
  let tool = 'pen', size = 18, color = 7, work = null;
  // the work the drawing on the sheet was saved as, so saving it again after coming back updates it instead of adding a copy
  const MINE = 'ajyal.draw.work';
  try { const id = localStorage.getItem(MINE); work = id && works.read().find((w) => w.id === id && w.state === 'private') || null; } catch {}
  const own = (w) => { try { w ? localStorage.setItem(MINE, w.id) : localStorage.removeItem(MINE); } catch {} };

  $('colors').innerHTML = PALETTE.filter((p) => p.c !== '#FFFFFF').map((p) => `<button class="sw" type="button" data-c="${p.c}" style="--c:${p.c}" aria-label="${p.n}" aria-pressed="${PALETTE.indexOf(p) === color}"></button>`).join('')
    + '<span class="picked" id="picked"></span>';
  const showPicked = () => { $('picked').innerHTML = `<i style="--c:${PALETTE[color].c}"></i>${PALETTE[color].n}`; };
  showPicked();
  $('colors').addEventListener('click', (e) => {
    const b = e.target.closest('.sw'); if (!b) return;
    color = PALETTE.findIndex((p) => p.c === b.dataset.c);
    $('colors').querySelectorAll('.sw').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    if (tool === 'eraser') pick('pen');
    showPicked(); say(PALETTE[color].n);
  });
  const pick = (t) => { tool = t; document.querySelectorAll('[data-tool]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.tool === t))); };
  document.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => pick(b.dataset.tool)));
  document.querySelectorAll('.size').forEach((b) => b.addEventListener('click', () => {
    size = +b.dataset.size; document.querySelectorAll('.size').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));

  // a stroke: the pen is solid, the brush is soft and wider, the eraser paints the white sheet back
  function stroke(ctx, s) {
    if (s.clear) { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); return; }
    ctx.save();
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.strokeStyle = ctx.fillStyle = s.tool === 'eraser' ? '#FFFFFF' : s.c;
    ctx.lineWidth = s.tool === 'brush' ? s.size * 1.8 : s.size;
    if (s.tool === 'brush') ctx.globalAlpha = 0.55;
    const p = s.pts;
    if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length - 1; i++) ctx.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
      ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]); ctx.stroke();
    }
    ctx.restore();
  }
  function redraw() {
    art.fillStyle = '#FFFFFF'; art.fillRect(0, 0, W, H);
    if (base) art.drawImage(base, 0, 0, W, H);
    strokes.forEach((s) => stroke(art, s));
    $('undo').disabled = !strokes.length; $('redo').disabled = !redo.length;
  }
  // the drawing so far is kept on the device, so leaving and coming back keeps it
  let timer = null;
  const keep = () => { clearTimeout(timer); timer = setTimeout(() => { try { localStorage.setItem(DRAFT, $('art').toDataURL('image/png')); } catch {} }, 500); };
  try { const d = localStorage.getItem(DRAFT); if (d) { const i = new Image(); i.onload = () => { base = i; redraw(); }; i.src = d; } } catch {}
  redraw();

  const point = (e) => { const r = $('live').getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  $('board').addEventListener('pointerdown', (e) => {
    e.preventDefault(); $('board').setPointerCapture(e.pointerId);
    now = { tool, size, c: PALETTE[color].c, pts: [point(e)] };
    live.clearRect(0, 0, W, H); stroke(live, now);
  });
  $('board').addEventListener('pointermove', (e) => {
    if (!now) return;
    const p = point(e), last = now.pts[now.pts.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 2) return;
    now.pts.push(p);
    live.clearRect(0, 0, W, H); stroke(live, now);
  });
  const end = () => {
    if (!now) return;
    strokes.push(now); redo = []; now = null;
    live.clearRect(0, 0, W, H); redraw(); keep();
    // a drawing sent for review stays as it was sent; drawing more makes a new work
    if (work?.state === 'review') work = null;
  };
  $('board').addEventListener('pointerup', end);
  $('board').addEventListener('pointercancel', end);

  $('undo').addEventListener('click', () => { if (strokes.length) { redo.push(strokes.pop()); redraw(); keep(); } });
  $('redo').addEventListener('click', () => { if (redo.length) { strokes.push(redo.pop()); redraw(); keep(); } });
  // clearing is one more step, so undo brings the drawing back
  $('clear').addEventListener('click', () => { strokes.push({ clear: true }); redo = []; redraw(); keep(); toast('مسحنا اللوحة، ويمكنك التراجع إن أردت'); });

  // save: private in «إبداعاتي» first; publishing is the child's choice and goes to review
  $('save').addEventListener('click', () => {
    if (!strokes.length && !base) return toast('ارسم شيئاً أولاً ثم احفظه');
    const img = $('art').toDataURL('image/jpeg', 0.85);
    work = { id: work?.id || `draw-${Date.now()}`, kind: 'draw', name: 'رسمتي', img, state: 'private', at: Date.now() }; own(work);
    if (!works.save(work)) return toast('لم نستطع الحفظ على هذا الجهاز');
    $('saved-img').src = img;
    $('saved-t').textContent = 'رسمة رائعة يا عمر!';
    $('saved-p').textContent = 'حفظناها في «إبداعاتي»، وهي خاصة بك';
    $('saved-note').hidden = false; $('publish').hidden = false;
    $('saved').hidden = false; $('again').focus();
    window.Sfx?.play('win');
  });
  $('publish').addEventListener('click', () => {
    work.state = 'review'; works.save(work);
    try { localStorage.removeItem(DRAFT); } catch {} own(null);
    $('saved-t').textContent = 'أرسلنا رسمتك للمراجعة';
    $('saved-p').textContent = 'سيراجعها فريق أجيال، ونخبرك بالنتيجة';
    $('saved-note').hidden = true; $('publish').hidden = true;
    $('again').focus();
  });
  $('again').addEventListener('click', () => {
    strokes = []; redo = []; base = null; work = null;
    try { localStorage.removeItem(DRAFT); } catch {} own(null);
    redraw(); $('saved').hidden = true;
  });

  // «سحر نور»: Nour says what the drawing looks like and draws it again in the style the child picks (magic.js)
  const { STYLES } = Magic;
  let style = 'cartoon', guesses = [], shown = null, kept = '', wait = null;
  $('styles').innerHTML = STYLES.map((s) => `<button type="button" data-style="${s.id}"><img src="${Magic.picture(Magic.SHAPES[8], s.id)}" alt="">${s.n}</button>`).join('');
  // one step of the sheet at a time; what Nour says is also spoken, for a child who does not read yet
  const step = (s, t, p = '') => {
    document.querySelectorAll('#spell [data-step]').forEach((x) => { x.hidden = x.dataset.step !== s; });
    $('spell-t').textContent = t; $('spell-p').textContent = p;
    $('spell').classList.toggle('busy', s === 'think');
    say(t);
  };
  const closeSpell = () => { clearTimeout(wait); $('spell').hidden = true; $('spell').classList.remove('busy'); $('magic').focus(); };
  $('magic').addEventListener('click', () => {
    if (!strokes.length && !base) return toast('ارسم شيئاً أولاً، ثم نادِ نور');
    $('spell').hidden = false;
    // the feature is open when the package has it and the parent left it on; the child is never told about prices or packages
    if (!Magic.open()) return step('none', 'سحر نور غير متاح الآن', 'يمكن لولي أمرك أو معلّمك أن يفتحه لك. وتستطيع متابعة الرسم.');
    if (!Magic.left()) return step('none', 'انتهت مرات السحر الآن', 'اطلب من ولي أمرك أو معلّمك مرات جديدة. وتستطيع متابعة الرسم.');
    // Nour works on a saved drawing: it is kept in «إبداعاتي», private, as «احفظ رسمتي» keeps it
    const img = $('art').toDataURL('image/jpeg', 0.85);
    if (work?.img !== img) {
      work = { id: work?.id || `draw-${Date.now()}`, kind: 'draw', name: 'رسمتي', img, state: 'private', at: Date.now() }; own(work);
      works.save(work);
    }
    document.querySelectorAll('#spell .mine').forEach((i) => { i.src = img; });
    step('pick', 'أنا نور الساحرة!', 'اختر كيف أرسم رسمتك من جديد');
    $('spell-left').textContent = Magic.count();
    $('styles').querySelector('button').focus();
  });
  $('styles').addEventListener('click', (e) => {
    const b = e.target.closest('[data-style]'); if (!b) return;
    style = b.dataset.style;
    step('think', 'نور تنظر إلى رسمتك…', 'لحظة، العصا السحرية تعمل!');
    wait = setTimeout(() => {
      guesses = Magic.guess($('art'));
      // too little to see: nothing is spent, and the child draws a little more
      if (!guesses) return step('none', 'لم أرَ رسمتك جيداً', 'ارسم خطوطاً أوضح قليلاً، ثم نادِني من جديد');
      Magic.spend(); kept = '';
      show(guesses[0], true);
      window.Sfx?.play('win');
    }, 1800);
  });
  // Nour's first guess, and the next two she thought of, so the child can say which it is; or any shape she knows
  function show(shape, first) {
    shown = shape;
    const made = $('made'); made.style.animation = 'none'; made.offsetWidth; made.style.animation = '';
    made.src = Magic.picture(shape, style); made.alt = `${shape.n} مرسومة بسحر نور`;
    step('show', first ? `أظنها ${shape.n}!` : `إذن هي ${shape.n}!`, first ? 'هكذا رسمتُها لك' : 'رسمتُها لك من جديد');
    if (first) $('all').hidden = true;
    const chip = (s) => `<button type="button" data-shape="${s.id}" aria-pressed="${s === shape}">${s.n}</button>`;
    $('others').innerHTML = guesses.slice(0, 3).map(chip).join('') + `<button type="button" id="more" aria-expanded="${!$('all').hidden}">شيء آخر</button>`;
    $('all').innerHTML = guesses.slice(3).map(chip).join('');
  }
  $('spell').addEventListener('click', (e) => {
    const b = e.target.closest('[data-shape]');
    if (b && b.getAttribute('aria-pressed') !== 'true') { kept = ''; show(Magic.SHAPES.find((s) => s.id === b.dataset.shape), false); }
    if (e.target.closest('#more')) { $('all').hidden = !$('all').hidden; e.target.closest('#more').setAttribute('aria-expanded', String(!$('all').hidden)); }
    if (e.target === $('spell') && !$('spell').classList.contains('busy')) closeSpell();
  });
  // what Nour made is the child's too: private in «إبداعاتي», next to the drawing it came from
  $('keep').addEventListener('click', () => {
    const key = `${shown.id}-${style}`;
    if (kept === key) return toast('حفظتها من قبل في «إبداعاتي»');
    works.save({ id: `ai-draw-${Date.now()}`, kind: 'ai-draw', name: `${shown.n} بسحر نور`, img: '/' + Magic.picture(shown, style), from: work?.id, style, state: 'private', at: Date.now() });
    kept = key;
    toast('حفظناها في «إبداعاتي»، وهي خاصة بك');
  });
  ['spell-x', 'back', 'none-back'].forEach((id) => $(id).addEventListener('click', closeSpell));
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('spell').hidden) closeSpell(); });

  const toast = (s) => { const el = $('toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2400); };
})();
</script>
</body>
</html>
