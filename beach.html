<style>
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Bold.woff2) format('woff2'); font-weight: 600 900; font-display: swap; }
:root { --ink: #3A2318; --ink-soft: #6B5A48; --paper: #FFFFFF; --sand: #FFF6E6; --go: #2E8B2A; --go-deep: #1F6A1C; --coral: #E0607F; --coral-deep: #B8405F; --sea: #3D96D6; --line: #6B3A1E; --leaf: #5BC236; --edge-x: 32px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Thmanyah Sans', system-ui, sans-serif; color: var(--ink); background: var(--sand); font-weight: 500; }
img { display: block; max-width: none; }
button { font: inherit; color: inherit; cursor: pointer; }

/* hero: the storybook beach, fading into the sand */
.hero { position: relative; height: 500px; background: url(img/stories/beach-hero.jpg) center 70% / cover; }
.hero::after { content: ''; position: absolute; inset: auto 0 0 0; height: 150px; background: linear-gradient(rgba(255,246,230,0), var(--sand) 92%); pointer-events: none; }
.bar { position: absolute; z-index: 3; top: 20px; left: 32px; right: 32px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 46px; padding: 0 14px; border-radius: 999px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #E8CFA6; white-space: nowrap; }
.pill img { width: 30px; height: 30px; margin: -4px 0; }
.stats { display: flex; gap: 10px; }
.pill.find { justify-content: center; width: 46px; padding: 0; border: 0; color: #B4531C; cursor: pointer; }
.isle { position: absolute; z-index: 2; left: 70px; top: 54px; width: 380px; animation: float 4.5s ease-in-out infinite; }
@keyframes float { 50% { translate: 0 -8px; } }
.say { position: absolute; z-index: 3; left: 420px; top: 96px; max-width: 250px; background: var(--paper); border-radius: 26px; padding: 14px 20px 16px; font-weight: 800; font-size: 20px; line-height: 1.35; box-shadow: 0 5px 0 var(--coral); }
.say::before { content: ''; position: absolute; left: -16px; bottom: 18px; border: 12px solid transparent; border-right-color: var(--paper); border-left: 0; }
.head { position: absolute; z-index: 3; right: 80px; top: 110px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.head h1 { margin: 0; font-size: 78px; font-weight: 800; line-height: 1; color: var(--paper); text-shadow: 0 5px 0 var(--coral-deep), 3px 0 0 var(--coral-deep), -3px 0 0 var(--coral-deep), 0 -3px 0 var(--coral-deep), 3px 3px 0 var(--coral-deep), -3px 3px 0 var(--coral-deep), 3px -3px 0 var(--coral-deep), -3px -3px 0 var(--coral-deep); }
.head p { margin: 0; font-size: 22px; font-weight: 800; background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.chip { height: 48px; padding: 0 18px; border-radius: 999px; border: 3px solid transparent; background: var(--paper); font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 #E8CFA6; }
.chip[aria-pressed="true"] { background: linear-gradient(#F4823F, #D6531E); color: var(--paper); border-color: var(--line); box-shadow: inset 0 3px 0 rgba(255,255,255,.35); }

main { position: relative; z-index: 2; margin: -30px 0 0; padding: 0 80px 150px; display: flex; flex-direction: column; gap: 34px; }

/* continue reading */
.cont { display: flex; align-items: center; gap: 22px; background: var(--paper); border-radius: 32px; padding: 16px 16px 16px 24px; box-shadow: 0 6px 0 #EED6B0; }
.cont .art { position: relative; width: 196px; height: 112px; border-radius: 22px; overflow: hidden; flex-shrink: 0; }
.cont .art img { width: 100%; height: 100%; object-fit: cover; }
.cont .art i { position: absolute; inset: auto 0 0 0; height: 6px; background: rgba(255,255,255,.6); }
.cont .art i::after { content: ''; display: block; width: 60%; height: 100%; margin-inline-start: 0; background: var(--leaf); }
.cont .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cont h2 { margin: 0; font-size: 16px; font-weight: 800; color: var(--coral-deep); }
.cont b { font-size: 30px; font-weight: 800; line-height: 1.15; }
.cont small { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; color: var(--ink-soft); }
.meter { width: 220px; height: 12px; border-radius: 999px; background: #F2E6D2; overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--p); border-radius: 999px; background: var(--leaf); }
.go { display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 30px; border-radius: 999px; background: var(--go); color: var(--paper); text-decoration: none; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 var(--go-deep); flex-shrink: 0; }

.legend { display: flex; gap: 18px; font-size: 15px; font-weight: 700; color: var(--ink-soft); margin-bottom: -18px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend img { width: 26px; height: 26px; }

/* dock: the same game bar as the map */
.dock { position: fixed; z-index: 10; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border: 4px solid var(--line); border-radius: 999px;
  background: linear-gradient(#FFD98C, #F7B347 55%, #EE9C2E); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(166,84,20,.35), 0 5px 0 var(--line), 0 12px 20px rgba(58,35,24,.25); }
.dock a { display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 18px; border: 3px solid transparent; border-radius: 999px; color: #4A2612; text-decoration: none; font-weight: 800; font-size: 17px; white-space: nowrap; }
.dock a:hover { background: rgba(255,255,255,.25); }
.dock a img { width: 36px; height: 36px; margin: -6px 0; flex-shrink: 0; }
.rank { background: #FFF6E6; color: #C9372C; border: 2px solid var(--line); border-radius: 999px; padding: 0 9px; height: 26px; display: flex; align-items: center; font-size: 15px; }

/* drawn at 1440 wide like the forest board, then scaled to the window */
#wrap { position: relative; width: 100%; overflow: hidden; }
#page { position: absolute; top: 0; left: 0; width: 1440px; transform-origin: top left; }
@media (max-width: 760px) { .dock a span { display: none; } .dock a { padding: 0 14px; } }
@media (prefers-reduced-motion: reduce) { .isle { animation: none; } }
</style>
<link rel="stylesheet" href="dock.css">

<body>

<div id="wrap"><div id="page">
<header class="hero">
  <div class="bar">
    <a class="pill back" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>العودة إلى الخريطة</span></a>
    <div class="stats">
      <button class="pill find" type="button" id="find" aria-label="ابحث في شاطئ الحكايات"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <span class="pill" title="الوقت المتبقي اليوم" style="color:#2D6A12"><img src="img/hud/clock.png" alt="">35 د</span>
      <span class="pill" title="النقاط"><img src="img/hud/points.png" alt="">3,240</span>
      <span class="pill" title="أيام متتالية"><img src="img/hud/streak.png" alt="">5</span>
      <span class="pill" title="الشارات"><img src="img/hud/badge.png" alt="">6</span>
    </div>
  </div>
  <img class="isle" src="img/beach.png" alt="السلحفاة سلمى على جزيرة شاطئ الحكايات">
  <p class="say">أهلاً يا عمر! أي حكاية نقرأ اليوم؟</p>
  <div class="head">
    <h1>شاطئ الحكايات</h1>
    <p>اقرأ واستمع لقصص ممتعة مع السلحفاة سلمى</p>
    <div class="chips" role="group" aria-label="تصنيف القصص" id="chips"></div>
  </div>
</header>

<main>
  <section class="cont" aria-labelledby="cont-t">
    <div class="art" aria-hidden="true"><img src="img/stories/cover-00.jpg" alt=""><i></i></div>
    <div class="txt">
      <h2 id="cont-t">أكمل من حيث توقفت</h2>
      <b>الأرنب الصادق</b>
      <small>الصفحة 6 من 10 · قصة مسموعة <span class="meter" style="--p:60%"><i></i></span></small>
    </div>
    <a class="go" href="story.html?resume=1">أكمل القراءة <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14L6 12z" fill="#FFFFFF"/></svg></a>
  </section>

  <div class="legend" aria-hidden="true">
    <span><img src="img/forest/I-12.png" alt="">قصة مسموعة</span>
    <span><img src="img/I-15.png" alt="">أنت بطل القصة</span>
  </div>
  <div id="shelves"></div>
</main>
</div></div>

<nav class="dock" aria-label="التنقل السريع">
  <a href="index.html" aria-label="الخريطة"><img src="img/nav/map.png" alt=""><span>الخريطة</span></a>
  <a href="index.html?open=sections" aria-label="كل الأقسام"><img src="img/nav/sections.png" alt=""><span>كل الأقسام</span></a>
  <a href="index.html?open=room" aria-label="غرفتي"><img src="img/nav/room.png" alt=""><span>غرفتي</span></a>
  <a href="index.html?open=leaders" aria-label="المتصدرون، ترتيبك 12"><img src="img/nav/leaders.png" alt=""><span>المتصدرون</span><span class="rank">12</span></a>
</nav>

<script src="shelf.js"></script>
<script src="beach-data.js"></script>
<script src="search.js"></script>
<script>
(() => {
  // the categories and their stories, the same as the phone's beach
  const host = document.getElementById('shelves');
  Shelf.render(host, Beach.shelves(''));
  // search inside the beach, by typing or by voice (search.js)
  IslandSearch.mount({ button: document.getElementById('find'), where: 'شاطئ الحكايات', items: () => Beach.searchItems() });
  host.style.cssText = 'display:flex;flex-direction:column;gap:40px';

  // the board is drawn at 1440 wide; scale it to the window like the forest
  const page = document.getElementById('page'), wrap = document.getElementById('wrap');
  function fit() {
    const k = Math.min(innerWidth / 1440, 1.5);
    const x = Math.max(0, (innerWidth - 1440 * k) / 2);
    page.style.transform = 'translateX(' + x + 'px) scale(' + k + ')';
    page.style.setProperty('--u', Math.max(1, 0.62 / k).toFixed(2) + 'px');
    page.classList.toggle('small', 0.62 / k > 1.4);
    wrap.style.height = page.offsetHeight * k + 'px';
    Shelf.sync(host);
  }
  fit(); addEventListener('resize', fit);

  // category chips filter the shelves
  const chips = document.getElementById('chips');
  chips.innerHTML = [{ id: '', title: 'الكل' }, ...Beach.cats()].map((c) => `<button class="chip" type="button" data-id="${c.id}" aria-pressed="${c.id === ''}">${c.title}</button>`).join('');
  chips.addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    chips.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b));
    host.querySelectorAll('.shelf').forEach((sh) => { sh.hidden = !!b.dataset.id && sh.dataset.id !== b.dataset.id; });
    fit();
  });
})();
</script>
</body>
</html>
