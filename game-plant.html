<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="guest.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFF7EC">
<link rel="apple-touch-icon" href="/img/app-icon/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أجيال">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ازرع نبتة · كثبان الألعاب</title>
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="game.css">
<style>
.scene { --scene: url(img/games/garden-scene.jpg); }

/* the pot on the garden table: each step swaps in the next picture of it */
.pot { position: absolute; z-index: 2; left: 50%; bottom: 19cqh; width: 28cqw; aspect-ratio: 1; translate: -50% 0; padding: 0; border: 0; background: none; cursor: pointer; }
.pot > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 .8cqh .6cqw rgba(60,40,10,.25)); pointer-events: none; }
.pot > img.in { animation: grow .6s ease-out; }
@keyframes grow { from { opacity: 0; transform: scale(.96); } }
.pot.hot > img, .pot.hint > img { filter: drop-shadow(0 0 1.4cqw #FFE38A) brightness(1.06); }

/* the tool acting on the pot: dig, pour or sprinkle, with a few falling bits */
.fx { position: absolute; z-index: 3; left: 46%; top: -14%; width: 46%; aspect-ratio: 1; pointer-events: none; }
.fx img { width: 100%; height: 100%; object-fit: contain; animation: pour 1.1s ease-in-out forwards; transform-origin: 30% 70%; }
@keyframes pour { 0% { opacity: 0; transform: translate(10%, -10%); } 20% { opacity: 1; transform: none; } 45%, 80% { opacity: 1; transform: rotate(-38deg); } 100% { opacity: 0; transform: rotate(-38deg); } }
/* the can is drawn with its spout to the right: mirror it so it pours toward the pot */
.fx.water img { animation-name: pourw; }
@keyframes pourw { 0% { opacity: 0; transform: translate(10%, -10%) scaleX(-1); } 20% { opacity: 1; transform: scaleX(-1); } 45%, 80% { opacity: 1; transform: rotate(-38deg) scaleX(-1); } 100% { opacity: 0; transform: rotate(-38deg) scaleX(-1); } }
.fx.dig img { animation-name: dig; transform-origin: 70% 30%; }
@keyframes dig { 0% { opacity: 0; transform: translate(10%, -20%) rotate(12deg); } 20% { opacity: 1; } 40% { transform: translate(-14%, 18%) rotate(-8deg); } 60% { transform: translate(-4%, 0) rotate(14deg); } 80% { opacity: 1; transform: translate(-14%, 18%) rotate(-8deg); } 100% { opacity: 0; } }
.fx i { position: absolute; left: 4%; top: 62%; width: 1.1cqw; height: 1.1cqw; border-radius: 50% 50% 50% 0; background: var(--bit, #6EC6F0); opacity: 0; animation: fall .5s ease-in var(--d) 2; }
.fx.soil i { --bit: #6B4423; border-radius: 40%; }
.fx.seed i { --bit: #8A5A2B; width: 1.4cqw; height: 1cqw; border-radius: 50%; animation-iteration-count: 1; }
.fx i:nth-child(2) { --d: .45s; margin-left: -1.2cqw; } .fx i:nth-child(3) { --d: .55s; margin-left: .8cqw; } .fx i:nth-child(4) { --d: .62s; margin-left: -.4cqw; }
.fx i:nth-child(5) { --d: .7s; margin-left: 1.6cqw; } .fx i:nth-child(6) { --d: .78s; margin-left: -2cqw; } .fx i:nth-child(7) { --d: .86s; margin-left: .2cqw; }
@keyframes fall { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(11cqh); } }

/* the sun sleeps until it is its turn, then shines on the pot */
.sun { position: absolute; z-index: 2; left: 9%; top: 13cqh; width: 13cqw; aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; opacity: .6; scale: .85; transition: opacity .4s, scale .4s; }
.sun img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.sun.turn { opacity: 1; scale: 1; animation: call 1.4s ease-in-out infinite; }
@keyframes call { 50% { filter: drop-shadow(0 0 1.6cqw #FFE38A); scale: 1.08; } }
.sun.hint { opacity: 1; animation: call .7s ease-in-out 3; }
.sun.back { animation: shake .35s; }
.sun.on { opacity: 1; scale: 1.1; animation: none; filter: drop-shadow(0 0 2.4cqw #FFE38A); }
.sun.on img { animation: spin 6s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.warm { position: absolute; z-index: 1; inset: 0; pointer-events: none; background: radial-gradient(circle at 15% 22%, rgba(255,226,120,.55), rgba(255,226,120,0) 60%); animation: warm 1.2s ease-out; }
@keyframes warm { from { opacity: 0; } }
.tray .thing img { padding: 6%; }

@media (max-width: 760px) {
  .pot { width: 50cqw; bottom: 25cqh; }
  .sun { left: auto; right: 5%; top: 22cqh; width: 18cqw; }
  .fx i { width: 2cqw; height: 2cqw; }
}
@media (prefers-reduced-motion: reduce) { .sun.turn, .sun.on img, .fx img, .fx i { animation-duration: .01s; animation-iteration-count: 1; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <a class="pill back" href="games.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>كثبان الألعاب</span></a>
    <div class="ttl"><img src="img/games/g-03.jpg" alt=""><h1>ازرع نبتة</h1></div>
    <span class="pill time" title="الوقت المتبقي اليوم"><img src="img/hud/clock.png" alt=""><span id="left">35 د</span></span>
  </header>

  <main class="stage">
    <section class="scene fox-top" id="scene" aria-label="الحديقة">
      <div class="hud" aria-live="polite"><span id="stage-label"></span><span id="count"></span></div>
      <div id="play"></div>
      <div class="fox" aria-live="polite"><img src="img/games/fox.png" alt=""><p id="tip"></p></div>
      <div class="over" id="over" hidden></div>
    </section>
  </main>
</div>

<div class="resume" id="resume">
  <div>
    <p>توقفت عند <b id="at">البداية</b></p>
    <div class="btns">
      <button class="btn go" id="go-on" type="button">أكمل من حيث توقفت</button>
      <button class="btn soft" id="restart" type="button">من البداية</button>
    </div>
  </div>
</div>

<div class="done stop" id="stop" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="stop-t">
    <img class="owl" src="img/games/fox.png" alt="">
    <h2 id="stop-t">انتهى وقت اليوم</h2>
    <p>حفظنا مكانك عند <b id="kept">البداية</b>، وتكمل من هنا في المرة القادمة</p>
    <div class="btns">
      <a class="btn go" href="#" id="ask">اطلب وقتاً إضافياً من ولي أمرك أو معلّمك</a>
      <a class="btn soft" href="index.html">العودة إلى الخريطة</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="sfx.js"></script>
<script>Sfx.taps('.btn, .pill');</script>
<script src="viewer.js"></script>
<script src="game.js"></script>
<script>
(() => {
  const { $ } = Viewer;
  const { ar } = Game;
  const { play, over, scene, tip, nudge, pop, cheer, result, miss } = Game.kit();
  // a game of the "ordered steps" type: each step names the tool it needs and the picture it leaves.
  // the tray keeps every tool, so the child picks what comes next
  const TOOLS = { water: { img: 'tool-water', name: 'إبريق الماء' }, seeds: { img: 'tool-seeds', name: 'البذور' }, shovel: { img: 'tool-shovel', name: 'المجرفة' }, soil: { img: 'tool-soil', name: 'التراب' } };
  const STAGES = [
    { name: 'ازرع البذرة', pot: 1, steps: [
      { tool: 'shovel', text: 'احفر حفرة صغيرة', pot: 2, fx: 'dig' },
      { tool: 'seeds', text: 'ضع البذرة في الحفرة', pot: 3, fx: 'seed' },
      { tool: 'soil', text: 'غطِّ البذرة بالتراب', pot: 4, fx: 'soil' }] },
    { name: 'اعتنِ بالنبتة', pot: 4, steps: [
      { tool: 'water', text: 'اسقِ البذرة بالماء', pot: 5, fx: 'water' },
      { tool: 'sun', text: 'اضغط على الشمس لتدفئ النبتة', pot: 7 }] }
  ];
  const STEPS = ['البداية', 'المرحلة ١: ازرع البذرة', 'المرحلة ٢: اعتنِ بالنبتة', 'النتيجة'];
  const XP = 25; // from gamification when completing the game is eligible
  for (let n = 1; n <= 7; n++) new Image().src = `img/games/plant-${n}.png`;
  let stage = null, at = 0, busy = false, pot = null;
  const icon = (t) => (t === 'sun' ? 'img/games/sun.png' : `img/games/${TOOLS[t].img}.png`);

  function show(i) {
    scene.classList.toggle('lift', i === 1 || i === 2);
    over.hidden = !(i === 0 || i === 3);
    $('stage-label').textContent = i === 1 ? 'المرحلة ١ من ٢' : i === 2 ? 'المرحلة ٢ من ٢' : 'ازرع نبتة';
    play.innerHTML = ''; busy = false;
    if (i === 0) start();
    if (i === 1 || i === 2) grow(STAGES[i - 1]);
    if (i === 3) finish();
  }

  function start() {
    $('count').textContent = 'لعبة من عالم البيئة';
    tip('هيا نزرع نبتة جميلة!');
    play.innerHTML = garden(1);
    over.innerHTML = `<div class="box2"><h2>ازرع نبتة</h2>
      <p>اختر الأداة المناسبة لكل خطوة واسحبها إلى الأصيص.<br>المرحلة ١: ازرع البذرة. المرحلة ٢: اسقِها ودع الشمس تدفئها.</p>
      <div class="how"><span><img src="img/games/tool-shovel.png" alt="">احفر</span><span><img src="img/games/tool-seeds.png" alt="">ازرع</span><span><img src="img/games/tool-water.png" alt="">اسقِ</span></div>
      <button class="btn go" id="begin" type="button">ابدأ اللعب</button></div>`;
  }
  const garden = (n) => `<button class="sun" type="button" aria-label="الشمس"><img src="img/games/sun.png" alt=""></button>
    <button class="pot" type="button" aria-label="الأصيص"><img src="img/games/plant-${n}.png" alt=""></button>`;

  // ---- a stage: one step at a time, ticked on the list
  function grow(s) {
    stage = s; at = 0; drop.reset();
    play.innerHTML = garden(s.pot) + `<ol class="todo" aria-label="الخطوات"></ol>
      <div class="tray">${Object.keys(TOOLS).map((k) => `<button class="thing" type="button" data-tool="${k}" aria-label="${TOOLS[k].name}"><img src="${icon(k)}" alt=""></button>`).join('')}</div>`;
    pot = play.querySelector('.pot');
    step();
  }
  function step() {
    const s = stage.steps[at];
    play.querySelector('.todo').innerHTML = stage.steps.map((x, n) => `<li class="${n < at ? 'ok' : n === at ? 'now' : ''}"><b>${n < at ? '✓' : ar(n + 1)}</b><img src="${icon(x.tool)}" alt="">${x.text}</li>`).join('');
    $('count').innerHTML = `<img src="${icon(s.tool)}" alt="">الخطوة ${ar(at + 1)} من ${ar(stage.steps.length)}`;
    play.querySelector('.sun').classList.toggle('turn', s.tool === 'sun');
    tip(s.text);
  }
  function setPot(n) {
    const img = new Image(); img.src = `img/games/plant-${n}.png`; img.alt = ''; img.className = 'in';
    pot.appendChild(img);
    setTimeout(() => pot.querySelectorAll('img:not(:last-of-type)').forEach((o) => o.remove()), 600);
  }
  function done() {
    busy = false; pop(pot, '✓'); at++;
    if (at < stage.steps.length) return step();
    play.querySelector('.todo li:last-child').className = 'ok';
    tip(stage === STAGES[0] ? 'رائع! زرعت البذرة' : 'انظر! النبتة أزهرت');
    cheer(() => game.next());
  }

  const drop = Game.place({ root: play, items: '.tray .thing', targets: '.pot',
    onPick: () => tip('الآن اضغط على الأصيص'),
    onDrop(item, target) {
      if (busy) return;
      const s = stage.steps[at];
      if (item.dataset.tool !== s.tool) {
        const right = s.tool === 'sun' ? play.querySelector('.sun') : play.querySelector(`.tray [data-tool="${s.tool}"]`);
        return miss(item, right, `ليس الآن! الخطوة الآن: ${s.text}`, s.tool === 'sun' ? 'النبتة تحتاج الشمس الآن، اضغط عليها' : 'هذه هي الأداة المناسبة، جرّب مرة أخرى');
      }
      // the tool acts on the pot, then the pot shows what changed
      busy = true; item.classList.remove('picked');
      const fx = document.createElement('div'); fx.className = `fx ${s.fx}`;
      fx.innerHTML = `<img src="${icon(s.tool)}" alt="">` + (s.fx === 'dig' ? '' : '<i></i>'.repeat(s.fx === 'seed' ? 1 : 7));
      pot.appendChild(fx);
      setTimeout(() => setPot(s.pot), 750);
      setTimeout(() => { fx.remove(); done(); }, 1150);
    } });

  play.addEventListener('click', (e) => {
    const sun = e.target.closest('.sun'); if (!sun || !stage || busy) return;
    const s = stage.steps[at];
    // the sun out of turn shakes and counts as a miss; the tool that comes next is what glows
    if (s.tool !== 'sun') return miss(sun, play.querySelector(`.tray [data-tool="${s.tool}"]`), `الشمس تنتظر دورها! الخطوة الآن: ${s.text}`, 'هذه هي الأداة المناسبة الآن');
    // the sun warms the pot: a sprout becomes a young plant, then it blooms
    busy = true; sun.classList.remove('turn'); sun.classList.add('on');
    play.insertAdjacentHTML('afterbegin', '<div class="warm"></div>');
    setTimeout(() => setPot(6), 500);
    setTimeout(() => setPot(7), 1400);
    setTimeout(done, 2000);
  });

  // ---- result: a simple celebration, no score, lives or coins
  function finish() {
    $('count').textContent = 'النبتة أزهرت!';
    tip('النبتة تشكرك على رعايتها');
    play.innerHTML = garden(7);
    play.querySelector('.sun').classList.add('on');
    result({ id: 'plant', title: 'أحسنت يا عمر!', text: 'زرعت البذرة بالترتيب واعتنيت بها حتى أزهرت', xp: XP });
    game.clear();
  }
  over.addEventListener('click', (e) => {
    const id = e.target.closest('button')?.id;
    if (id === 'begin') game.next();
    if (id === 'again') game.go(1);
  });

  // finishing a stage moves on; a wrong tool only gets a hint, nothing is ever "game over"
  const game = Viewer.pages({ steps: 4, key: 'ajyal.game.plant', label: (i) => STEPS[i], onShow: show, canNext: (i) => (i === 1 || i === 2 ? stage === STAGES[i - 1] && at >= stage.steps.length : true) });
})();
</script>
</body>
</html>
