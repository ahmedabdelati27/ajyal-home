<!doctype html>
<html lang="ar" dir="rtl" data-sfx="none">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واحة القرآن · أجيال الصالحية</title>
<link rel="stylesheet" href="clouds.css">
<script src="clouds.js"></script>
<style>
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Bold.woff2) format('woff2'); font-weight: 600 900; font-display: swap; }
:root { --ink: #3A2318; --ink-soft: #6B5A48; --paper: #FFFFFF; --cream: #F6F8EC; --go: #2E8B2A; --go-deep: #1F6A1C; --green: #5DAA33; --green-deep: #2F6B2A; --gold: #E0A93B; --line: #6B3A1E; --leaf: #5BC236; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Thmanyah Sans', system-ui, sans-serif; color: var(--ink); background: var(--cream); font-weight: 500; }
img { display: block; max-width: none; }
button { font: inherit; color: inherit; cursor: pointer; }

/* drawn at 1440 wide like the forest board, then scaled to the window */
#wrap { position: relative; width: 100%; overflow: hidden; }
#page { position: absolute; top: 0; left: 0; width: 1440px; transform-origin: top left; }

/* hero: a calm courtyard at dusk, fading into the page; this section has no character (D-007) */
.hero { position: relative; height: 500px; background: url(img/quran/quran-hero.jpg) center 60% / cover; }
.hero::after { content: ''; position: absolute; inset: auto 0 0 0; height: 150px; background: linear-gradient(rgba(246,248,236,0), var(--cream) 92%); pointer-events: none; }
.bar { position: absolute; z-index: 3; top: 20px; left: 32px; right: 32px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 46px; padding: 0 14px; border-radius: 999px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #CFE0B8; white-space: nowrap; }
.pill img { width: 30px; height: 30px; margin: -4px 0; }
.stats { display: flex; gap: 10px; }
.isle { position: absolute; z-index: 2; left: 70px; top: 54px; width: 380px; animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { translate: 0 -6px; } }
.head { position: absolute; z-index: 3; right: 80px; top: 112px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.head h1 { margin: 0; font-size: 78px; font-weight: 800; line-height: 1; color: var(--paper); text-shadow: 0 5px 0 var(--green-deep), 3px 0 0 var(--green-deep), -3px 0 0 var(--green-deep), 0 -3px 0 var(--green-deep), 3px 3px 0 var(--green-deep), -3px 3px 0 var(--green-deep), 3px -3px 0 var(--green-deep), -3px -3px 0 var(--green-deep); }
.head p { margin: 0; font-size: 22px; font-weight: 800; background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px 18px; }
.sum { display: flex; align-items: center; gap: 12px; margin-top: 4px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.92); font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #CFE0B8; }
.sum .meter { width: 200px; }
.chips { display: flex; gap: 10px; margin-top: 4px; }
.chip { height: 48px; padding: 0 18px; border-radius: 999px; border: 3px solid transparent; background: var(--paper); font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 #CFE0B8; }
.chip[aria-pressed="true"] { background: linear-gradient(#F4823F, #D6531E); color: var(--paper); border-color: var(--line); box-shadow: inset 0 3px 0 rgba(255,255,255,.35); }

main { position: relative; z-index: 2; margin: -30px 0 0; padding: 0 80px 150px; display: flex; flex-direction: column; gap: 30px; }
.meter { width: 220px; height: 12px; border-radius: 999px; background: #E5EDD6; overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--p); border-radius: 999px; background: var(--leaf); }

/* continue memorising */
.cont { display: flex; align-items: center; gap: 22px; background: var(--paper); border-radius: 32px; padding: 16px 16px 16px 24px; box-shadow: 0 6px 0 #D8E6C3; }
.cont .num { width: 112px; height: 112px; flex-shrink: 0; }
.cont .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cont h2 { margin: 0; font-size: 16px; font-weight: 800; color: var(--green-deep); }
.cont b { font-size: 30px; font-weight: 800; line-height: 1.15; }
.cont small { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; color: var(--ink-soft); }
.go { display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 30px; border-radius: 999px; background: var(--go); color: var(--paper); text-decoration: none; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 var(--go-deep); flex-shrink: 0; }

/* the surah number sits in an eight-point star */
.num { position: relative; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: var(--green-deep); }
.num::before, .num::after { content: ''; position: absolute; inset: 12%; border-radius: 18%; background: linear-gradient(#F3F8E8, #DDEBC6); box-shadow: inset 0 0 0 3px #B9D597; }
.num::after { transform: rotate(45deg); }
.num span { position: relative; z-index: 1; }

/* the surahs of Juz' Amma, in the admin's order */
.list h2 { margin: 0 0 14px; font-size: 30px; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.sura { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 26px; background: var(--paper); text-decoration: none; color: var(--ink); box-shadow: 0 6px 0 #D8E6C3; transition: transform .2s; }
.sura:hover { transform: translateY(-4px); }
.sura .num { width: 70px; height: 70px; flex-shrink: 0; font-size: 22px; }
.sura .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sura b { font-size: 22px; font-weight: 800; }
.sura small { font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.sura .meter { width: 100%; height: 8px; }
.sura.done { background: linear-gradient(#F3FCEB, #E1F4D2); }
.sura.done .num::before, .sura.done .num::after { background: linear-gradient(#7FCB5C, #4CB944); box-shadow: none; }
.sura.done .num { color: var(--paper); }
.sura.now { box-shadow: 0 0 0 4px #F7B347, 0 6px 0 #C98A1E; }
.state { position: absolute; top: -12px; left: 14px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 800; display: flex; align-items: center; }
.state.ok { background: #4CB944; color: var(--paper); }
.state.on { background: #FFF1C9; color: #8A5A00; }

.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(58,35,24,.9); color: var(--paper); border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 16px; z-index: 40; opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; }

/* dock: the same game bar as the map */
.dock { position: fixed; z-index: 10; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border: 4px solid var(--line); border-radius: 999px;
  background: linear-gradient(#FFD98C, #F7B347 55%, #EE9C2E); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(166,84,20,.35), 0 5px 0 var(--line), 0 12px 20px rgba(58,35,24,.25); }
.dock a { display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 18px; border: 3px solid transparent; border-radius: 999px; color: #4A2612; text-decoration: none; font-weight: 800; font-size: 17px; white-space: nowrap; }
.dock a:hover { background: rgba(255,255,255,.25); }
.dock a img { width: 36px; height: 36px; margin: -6px 0; flex-shrink: 0; }
.rank { background: #FFF6E6; color: #C9372C; border: 2px solid var(--line); border-radius: 999px; padding: 0 9px; height: 26px; display: flex; align-items: center; font-size: 15px; }
@media (max-width: 760px) { .dock a span { display: none; } .dock a { padding: 0 14px; } }
@media (prefers-reduced-motion: reduce) { .isle { animation: none; } .sura { transition: none; } }
</style>
<link rel="stylesheet" href="dock.css">
</head>
<body>
<div id="wrap"><div id="page">
<header class="hero">
  <div class="bar">
    <a class="pill back" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>العودة إلى الخريطة</span></a>
    <div class="stats">
      <span class="pill" title="الوقت المتبقي اليوم" style="color:#2D6A12"><img src="img/hud/clock.png" alt="">35 د</span>
      <span class="pill" title="النقاط"><img src="img/hud/points.png" alt="">3,240</span>
      <span class="pill" title="أيام متتالية"><img src="img/hud/streak.png" alt="">5</span>
      <span class="pill" title="الشارات"><img src="img/hud/badge.png" alt="">6</span>
    </div>
  </div>
  <img class="isle" src="img/quran.png" alt="مصحف على حامل خشبي في واحة القرآن">
  <div class="head">
    <h1>واحة القرآن</h1>
    <p>استمع وردّد واحفظ قصار السور من جزء عمّ</p>
    <div class="sum" id="sum"></div>
    <div class="chips" role="group" aria-label="عرض السور" id="chips">
      <button class="chip" type="button" data-f="" aria-pressed="true">كل السور</button>
      <button class="chip" type="button" data-f="on" aria-pressed="false">جاري الحفظ</button>
      <button class="chip" type="button" data-f="ok" aria-pressed="false">مكتملة</button>
    </div>
  </div>
</header>

<main>
  <section class="cont" aria-labelledby="cont-t">
    <span class="num" aria-hidden="true"><span>١١٢</span></span>
    <div class="txt">
      <h2 id="cont-t">أكمل من حيث توقفت</h2>
      <b>سورة الإخلاص</b>
      <small>الآية ٣ من ٤ · مرحلة التسميع <span class="meter" style="--p:83%"><i></i></span></small>
    </div>
    <a class="go" href="surah.html?s=112&resume=1">أكمل الحفظ <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14L6 12z" fill="#FFFFFF"/></svg></a>
  </section>
  <section class="list" aria-labelledby="list-t">
    <h2 id="list-t">سور جزء عمّ</h2>
    <div class="grid" id="grid"></div>
  </section>
</main>
</div></div>

<nav class="dock" aria-label="التنقل السريع">
  <a href="index.html" aria-label="الخريطة"><img src="img/nav/map.png" alt=""><span>الخريطة</span></a>
  <a href="index.html?open=sections" aria-label="كل الأقسام"><img src="img/nav/sections.png" alt=""><span>كل الأقسام</span></a>
  <a href="index.html?open=room" aria-label="غرفتي"><img src="img/nav/room.png" alt=""><span>غرفتي</span></a>
  <a href="index.html?open=leaders" aria-label="المتصدرون، ترتيبك 12"><img src="img/nav/leaders.png" alt=""><span>المتصدرون</span><span class="rank">12</span></a>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // Juz' Amma, from An-Nas up to An-Naba' (the admin sets the order): number, name, verses
  const SURAS = [[114, 'الناس', 6], [113, 'الفلق', 5], [112, 'الإخلاص', 4], [111, 'المسد', 5], [110, 'النصر', 3], [109, 'الكافرون', 6], [108, 'الكوثر', 3], [107, 'الماعون', 7], [106, 'قريش', 4], [105, 'الفيل', 5], [104, 'الهمزة', 9], [103, 'العصر', 3], [102, 'التكاثر', 8], [101, 'القارعة', 11], [100, 'العاديات', 11], [99, 'الزلزلة', 8], [98, 'البينة', 8], [97, 'القدر', 5], [96, 'العلق', 19], [95, 'التين', 8], [94, 'الشرح', 8], [93, 'الضحى', 11], [92, 'الليل', 21], [91, 'الشمس', 15], [90, 'البلد', 20], [89, 'الفجر', 30], [88, 'الغاشية', 26], [87, 'الأعلى', 19], [86, 'الطارق', 17], [85, 'البروج', 22], [84, 'الانشقاق', 25], [83, 'المطففين', 36], [82, 'الانفطار', 19], [81, 'التكوير', 29], [80, 'عبس', 42], [79, 'النازعات', 46], [78, 'النبأ', 40]];
  // the child's memorisation: 'ok' complete, a percentage while memorising, nothing when not started
  // percentage = (completed stages + share of verses in the current stage) / 3 stages
  const STATE = { 114: 'ok', 113: 'ok', 112: 83 };
  const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
  const verses = (n) => `${ar(n)} ${n >= 3 && n <= 10 ? 'آيات' : 'آية'}`;

  const done = SURAS.filter(([n]) => STATE[n] === 'ok').length;
  const suras = (n) => (n === 1 ? 'سورة واحدة' : n === 2 ? 'سورتين' : n <= 10 ? `${ar(n)} سور` : `${ar(n)} سورة`);
  $('sum').innerHTML = `حفظت ${suras(done)} من ${ar(SURAS.length)} <span class="meter" style="--p:${(done / SURAS.length) * 100}%"><i></i></span>`;

  let filter = '';
  function render() {
    $('grid').innerHTML = SURAS.filter(([n]) => !filter || (filter === 'ok' ? STATE[n] === 'ok' : typeof STATE[n] === 'number')).map(([n, name, v]) => {
      const s = STATE[n], on = typeof s === 'number';
      return `<a class="sura ${s === 'ok' ? 'done' : on ? 'now' : ''}" href="${n === 112 ? 'surah.html?s=112' : '#'}" aria-label="سورة ${name}، ${verses(v)}، ${s === 'ok' ? 'مكتملة' : on ? `جاري الحفظ ${s}%` : 'لم يبدأ'}">
        <span class="num" aria-hidden="true"><span>${ar(n)}</span></span>
        <span class="t"><b>سورة ${name}</b><small>${verses(v)}</small>${on ? `<span class="meter" style="--p:${s}%"><i></i></span>` : ''}</span>
        ${s === 'ok' ? '<span class="state ok">✓ مكتملة</span>' : on ? `<span class="state on">جاري الحفظ ${ar(s)}٪</span>` : ''}</a>`;
    }).join('');
    fit();
  }
  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    $('chips').querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b));
    filter = b.dataset.f; render();
  });

  const toast = (s) => { const el = $('toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2400); };
  $('grid').addEventListener('click', (e) => {
    const t = e.target.closest('.sura'); if (!t || t.getAttribute('href') !== '#') return;
    e.preventDefault(); toast('في النموذج: جرّب سورة الإخلاص');
  });

  // the board is drawn at 1440 wide; scale it to the window like the forest
  const page = $('page'), wrap = $('wrap');
  function fit() {
    const k = Math.min(innerWidth / 1440, 1.5);
    const x = Math.max(0, (innerWidth - 1440 * k) / 2);
    page.style.transform = 'translateX(' + x + 'px) scale(' + k + ')';
    wrap.style.height = page.offsetHeight * k + 'px';
  }
  addEventListener('resize', fit);
  render();
})();
</script>
</body>
</html>
