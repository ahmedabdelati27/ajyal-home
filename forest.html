@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }

html, body { margin: 0; background: #F2F8E6; }
#wrap { position: relative; width: 100%; overflow: hidden; }
img { max-width: none; }
#page { position: absolute; top: 0; left: 0; width: 1440px; transform-origin: top left; animation: enter .35s ease-out both; }
#board { position: relative; }
@keyframes enter { from { opacity: 0; transform: var(--t) scale(1.04); } to { opacity: 1; transform: var(--t); } }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
.float { animation: float 4.5s ease-in-out infinite; }
body { font-family: 'Thmanyah Sans', system-ui, sans-serif; color: #3A2318; }
/* same game-style dock as the map, not scaled with the board */
.dock { position: fixed; z-index: 10; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border: 4px solid #6B3A1E; border-radius: 999px;
  background: linear-gradient(#FFD98C, #F7B347 55%, #EE9C2E); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(166,84,20,.35), 0 5px 0 #6B3A1E, 0 12px 20px rgba(58,35,24,.25); }
.dock a { display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 18px; border: 3px solid transparent; border-radius: 999px; color: #4A2612; text-decoration: none; font-weight: 800; font-size: 17px; white-space: nowrap; }
.dock a:hover { background: rgba(255,255,255,.25); }
.dock a img { width: 36px; height: 36px; margin: -6px 0; flex-shrink: 0; }
.rank { background: #FFF6E6; color: #C9372C; border: 2px solid #6B3A1E; border-radius: 999px; padding: 0 9px; height: 26px; display: flex; align-items: center; font-size: 15px; }
@media (max-width: 760px) { .dock a span { display: none; } .dock a { padding: 0 14px; } }
@media (prefers-reduced-motion: reduce) { #page, .float { animation: none; } }
</style>

<script>
  // the categories and what is in them (forest-data.js, shared with the phone's forest)
  Shelf.render(document.getElementById('shelves'), Forest.shelves());
  // search inside the forest, by typing or by voice (search.js)
  IslandSearch.mount({ button: document.getElementById('find'), where: 'غابة المعرفة', items: () => Forest.searchItems() });

  // the board is drawn at 1440 wide; scale it to the window, and on phones the shelves grow back so a finger can hit a cover
  const page = document.getElementById('page');
  function fit() {
    const k = Math.min(innerWidth / 1440, 1.5);
    const x = Math.max(0, (innerWidth - 1440 * k) / 2);
    const t = 'translateX(' + x + 'px) scale(' + k + ')';
    page.style.setProperty('--u', Math.max(1, 0.62 / k).toFixed(2) + 'px');
    page.classList.toggle('small', 0.62 / k > 1.4);
    page.style.setProperty('--t', t); page.style.transform = t;
    document.getElementById('wrap').style.height = page.offsetHeight * k + 'px';
    Shelf.sync(document.getElementById('shelves'));
  }
  fit(); addEventListener('resize', fit);
</script>
