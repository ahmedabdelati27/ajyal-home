<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // a phone held upright gets the islands in a line; turned sideways, or a tablet, gets the world map of the web
  const UPRIGHT = matchMedia('(max-width: 600px) and (orientation: portrait)');
  // the two pages send a phone to each other by how it is held; a third hop within a few seconds means the browser is unsure, so it stays
  const hop = (to) => { try { const s = sessionStorage, now = Date.now(), n = now - (+s.getItem('ajyal.hopAt') || 0) < 3000 ? (+s.getItem('ajyal.hops') || 0) + 1 : 1; s.setItem('ajyal.hops', n); s.setItem('ajyal.hopAt', now); if (n > 2) return; } catch {} location.replace(to); };
  if (!UPRIGHT.matches) hop('../index.html' + location.search);
  UPRIGHT.addEventListener('change', (e) => { if (!e.matches) hop('../index.html' + location.search); });
</script>
<script src="../guest.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFF7EC">
<link rel="apple-touch-icon" href="/img/app-icon/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<title>الرئيسية · تطبيق أجيال</title>
<link rel="icon" href="../img/garden/nour-cheer.png">
<style>
/* moving between the app's pages fades instead of flashing white (where the browser can) */
@view-transition { navigation: auto; }
@font-face { font-family: 'Thmanyah Sans'; src: url(../fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Thmanyah Sans'; src: url(../fonts/thmanyahsans-Bold.woff2) format('woff2'); font-weight: 600 900; font-display: swap; }
:root {
  --ink: #3A2318; --ink-soft: #6B5A48; --paper: #FFFFFF; --edge: #F1DEC2;
  --go: #3FA83A; --go-deep: #1F6A1C; --nour: #F2C94C; --sky: #2F6FA8;
  /* the phone's own edges: under the status bar and the home bar (the mockup leaves them out, a real phone gives them) */
  --top: max(env(safe-area-inset-top), 14px); --bottom: max(env(safe-area-inset-bottom), 10px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* an app scrolls without a bar showing */
html { overflow-x: clip; scrollbar-width: none; } html::-webkit-scrollbar { display: none; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: 'Thmanyah Sans', system-ui, sans-serif; font-weight: 500; color: var(--ink); background: #9EE3DA; }
/* the painted sea of the web's map, held still while the islands pass over it */
.sea { position: fixed; z-index: -1; inset: 0; background: url(../img/landing/app-sea.jpg) 50% 50% / cover no-repeat #9EE3DA; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid #D6531E; outline-offset: 3px; }

/* the top: who is playing, their level, and what they have gathered */
.top { position: sticky; z-index: 5; top: 0; padding: var(--top) 14px 12px; background: linear-gradient(rgba(214,246,240,.97) 82%, rgba(214,246,240,0)); }
.me-row { display: flex; align-items: center; gap: 8px; }
.me { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: start; }
.me img { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 3px var(--paper), 0 3px 0 4px rgba(58,35,24,.12); }
.me b { display: block; font-size: 19px; font-weight: 800; line-height: 1.15; }
.me small { display: inline-flex; margin-top: 2px; padding: 1px 10px; border-radius: 999px; background: #EDE3FF; color: #6A45B8; font-size: 13px; font-weight: 800; }
.round { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--paper); box-shadow: 0 3px 0 rgba(58,35,24,.12); }
.round img { width: 26px; height: 26px; }
/* search lives inside each island (the client's choice), so the bell takes the far end */
.bell { margin-inline-start: auto; }
.bell i { position: absolute; top: -2px; left: -2px; display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: #E0584A; color: var(--paper); font-style: normal; font-size: 12px; font-weight: 800; }
.stats { display: flex; gap: 6px; margin-top: 10px; }
.stats button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px; border-radius: 999px; background: var(--paper); font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 rgba(58,35,24,.1); font-variant-numeric: tabular-nums; }
.stats img { width: 22px; height: 22px; }
.stats .time { color: #2D6A12; }

main { padding: 2px 14px calc(var(--bottom) + 104px); }

/* today with Nour: her journey card */
.nour-card { display: flex; color: inherit; text-decoration: none; align-items: center; gap: 10px; width: 100%; padding: 12px 14px 12px 12px; border-radius: 24px; background: var(--paper); text-align: start; box-shadow: 0 5px 0 var(--nour); }
.nour-card .face { flex-shrink: 0; width: 62px; animation: bob 3.2s ease-in-out infinite; }
.nour-card small { display: block; font-size: 13px; font-weight: 800; color: #B07A00; }
.nour-card b { display: block; font-size: 18px; font-weight: 800; line-height: 1.3; }
.nour-card span.p { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); }
.play { flex-shrink: 0; display: grid; place-items: center; width: 44px; height: 44px; margin-inline-start: auto; border-radius: 50%; background: linear-gradient(#3FA83A, #2E8B2A); box-shadow: 0 4px 0 var(--go-deep); }
.play svg { width: 18px; height: 18px; translate: -1px 0; }
@keyframes bob { 50% { translate: 0 -5px; } }

/* where they stopped */
.cont { display: flex; color: inherit; text-decoration: none; align-items: center; gap: 12px; width: 100%; margin-top: 12px; padding: 10px; border-radius: 22px; background: rgba(255,255,255,.94); text-align: start; box-shadow: 0 4px 0 rgba(58,35,24,.08); }
.cont .cover { flex-shrink: 0; width: 62px; height: 62px; overflow: hidden; border-radius: 16px; }
.cont .cover img { width: 100%; height: 100%; object-fit: cover; }
.cont small { display: block; font-size: 12px; font-weight: 800; color: #2E7D32; }
.cont b { display: block; font-size: 16px; font-weight: 800; }
.cont .bar { display: block; height: 6px; margin-top: 6px; border-radius: 999px; background: #EFE3D2; overflow: hidden; }
.cont .bar i { display: block; width: 60%; height: 100%; border-radius: inherit; background: var(--go); }
.cont .txt { flex: 1; min-width: 0; }
.cont .go { flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; background: #E8F5E3; color: #2E7D32; font-size: 14px; font-weight: 800; display: grid; place-items: center; }

/* the world: the islands one under another on the sea, a dotted way joining them */
.world-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 4px; }
.world-head h2 { margin: 0; padding: 4px 16px 6px; border-radius: 999px; background: rgba(255,255,255,.9); font-size: 19px; font-weight: 800; }
.world-head small { padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.75); font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.world { position: relative; padding: 4px 0 10px; }
.way { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.way path { fill: none; stroke: rgba(255,255,255,.95); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1 13; }
.isl { position: relative; display: flex; color: inherit; text-decoration: none; flex-direction: column; align-items: center; width: 62%; margin-top: -8px; }
.isl:first-of-type { margin-top: 0; }
.isl:nth-of-type(odd) { margin-inline-start: 0; }
.isl:nth-of-type(even) { margin-inline-start: 38%; }
.isl .art { position: relative; width: 168px; }
.isl .art img { width: 100%; filter: drop-shadow(0 12px 10px rgba(20,90,100,.28)); animation: bob 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
/* the island's name on its ribbon, as on the world map */
.isl .name { position: relative; z-index: 1; margin-top: -14px; display: flex; align-items: center; height: 30px; padding: 0 14px 2px; border-radius: 7px; background: var(--c2, #FFD43B); color: var(--ink); font-size: 15px; font-weight: 800; line-height: 1; white-space: nowrap; box-shadow: 0 3px 0 var(--d2, #E0B000); }
.isl .name::before, .isl .name::after { content: ""; position: absolute; top: 8px; width: 20px; height: 26px; background: var(--d2, #E0B000); z-index: -1; }
.isl .name::before { right: -12px; clip-path: polygon(0 0, 100% 0, 72% 50%, 100% 100%, 0 100%); }
.isl .name::after { left: -12px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 28% 50%); }
.isl .sub { margin-top: 3px; padding: 1px 10px; border-radius: 999px; background: rgba(255,255,255,.85); font-size: 12px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
/* little marks on an island: suggested for the child, what is left in the workshop */
.mark { position: absolute; z-index: 2; top: 16px; display: inline-flex; align-items: center; gap: 3px; height: 26px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 800; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.mark.tip { left: 2px; background: #FFF1C9; color: #8A5A00; }
.mark.left { right: 0; background: #EDE3FF; color: #6A45B8; }
.mark img { width: 16px; height: 16px; }

/* the bar at the bottom: the map, all sections, my room, the board */
.tabs { position: fixed; z-index: 6; left: 12px; right: 12px; bottom: var(--bottom); display: flex; justify-content: space-around; padding: 8px 6px; border-radius: 999px; background: rgba(255,250,242,.97); box-shadow: 0 0 0 2px #F3DDBB, 0 10px 24px rgba(20,70,80,.22); }
.tabs a, .tabs button { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 4px 6px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.tabs img { width: 34px; height: 34px; }
.tabs [aria-current="page"] { background: #FFE9C2; color: var(--ink); }

/* Nour's tour, as on the map of the web: everything dims except the place she is talking about */
.tour { position: fixed; inset: 0; z-index: 20; }
.tour[hidden] { display: none; }
.spot { position: absolute; z-index: 20; left: 50%; top: 40%; width: 0; height: 0; border-radius: 50%; box-shadow: 0 0 0 300vmax rgba(18,40,58,.6); outline: 4px dashed rgba(255,228,140,.95); outline-offset: 6px; transition: left .4s ease, top .4s ease, width .4s ease, height .4s ease, border-radius .4s ease; pointer-events: none; }
.spot[hidden] { display: none; }
.spot.off { outline-color: transparent; }
.tour-card { position: fixed; z-index: 21; left: 12px; right: 12px; bottom: calc(var(--bottom) + 12px); display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: start; padding: 12px 14px 14px 12px; border: 4px solid var(--paper); border-radius: 26px; background: #FFF9EE; box-shadow: 0 8px 0 rgba(90,68,184,.25), 0 18px 32px rgba(0,0,0,.25); }
.tour-card.up { bottom: auto; top: calc(var(--top) + 8px); }
.tour-card .face { width: 60px; margin-top: 4px; animation: bob 3.2s ease-in-out infinite; }
.tour-n { font-size: 13px; font-weight: 800; color: #7B64DA; }
.tour-card h2 { margin: 2px 0 4px; font-size: 20px; font-weight: 800; line-height: 1.25; }
.tour-card p { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.6; color: var(--ink-soft); }
.tour-btns { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.tour-btns button { height: 42px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 800; }
.tour-btns button[hidden] { display: none; }
.t-hear { display: inline-flex; align-items: center; gap: 4px; background: #FFF1C9; color: #8A5A00; }
.t-hear svg { width: 20px; height: 20px; }
.t-back { background: var(--paper); box-shadow: 0 0 0 2px #EFE3CF; }
.t-skip { padding: 0 6px !important; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 4px; }
.t-next { margin-inline-start: auto; background: var(--go); color: var(--paper); box-shadow: 0 4px 0 var(--go-deep); }
@media (prefers-reduced-motion: reduce) { .spot { transition: none; } .tour-card .face { animation: none; } }

.toast { position: fixed; z-index: 9; left: 50%; bottom: calc(var(--bottom) + 92px); translate: -50% 0; width: max-content; max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 999px; background: rgba(58,35,24,.92); color: var(--paper); font-size: 14px; font-weight: 700; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .nour-card .face, .isl .art img { animation: none; } }
</style>
</head>
<body>
<div class="sea" aria-hidden="true"></div>
<header class="top">
  <div class="me-row">
    <button class="me" type="button" id="me" data-go="room.html" aria-label="غرفتي: عمر، المستوى 7">
      <img src="../img/avatars/A-03.png" alt="" id="me-img">

<main>

<nav class="tabs" aria-label="التنقل">
  <button type="button" aria-current="page"><img src="../img/tabs/map.png" alt="">الخريطة</button>
  <a href="sections.html"><img src="../img/tabs/sections.png" alt="">كل الأقسام</a>

<!-- Nour's tour on a child's first visit: the page dims, one place lights at a time, and «تخطَّ الجولة» ends it any time -->
<div class="spot off" id="spot" hidden aria-hidden="true"></div>
<div class="tour" id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tour-t" aria-describedby="tour-p">
  <div class="tour-card" id="tour-card">
    <img class="face" src="../img/garden/nour-wave.png" alt="">
    <div>
      <span class="tour-n" id="tour-n"></span>

        <button type="button" class="t-skip" id="tour-skip">تخطَّ الجولة</button>

      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // the islands, as on the map of the web, one under another on the phone
  const ISLANDS = [
    { id: 'forest', c: '#5CB8F5', title: 'غابة المعرفة', sub: 'فيديوهات وكتب تعليمية', d: '#3D96D6', href: 'forest.html' },
    { id: 'beach', c: '#FF8FA8', title: 'شاطئ الحكايات', sub: 'اقرأ واستمع لقصص ممتعة', d: '#E0607F', href: 'beach.html' },
    { id: 'garden', c: '#67CFA9', title: 'حديقة القيم', sub: 'رحلتك الآن: قيمة التعاون', d: '#3FB396', href: 'garden.html' },
    { id: 'letters', c: '#FFD43B', title: 'واحة الحروف', sub: 'تعلّم الحروف والأرقام', d: '#E0B000', href: 'oasis.html' },
    { id: 'colors', c: '#FFA94D', title: 'وادي الألوان', sub: 'ارسم ولوّن', d: '#E58A2B', tip: true, href: 'colors.html' },
    { id: 'games', c: '#9C86F2', title: 'كثبان الألعاب', sub: 'ألعاب تعليمية', d: '#7B64DA', tip: true, href: 'games.html' },
    { id: 'quran', c: '#7CCB4C', title: 'واحة القرآن', sub: 'جزء عمّ', d: '#5DAA33', href: 'quran.html' },
    { id: 'ai', c: '#B9A8F7', title: 'ورشة السحر', sub: 'قصة أو فيديو تُكتب عنك', d: '#7B64DA', left: true, href: 'workshop.html' },
    { id: 'peak', c: '#FF7A6B', title: 'قمة الأبطال', sub: 'شارك في المسابقات', d: '#E0584A', href: 'peak.html' }
  ];
  const world = document.getElementById('world');
  world.innerHTML = ISLANDS.map((i, n) => `<a class="isl" href="${i.href || '#'}"${i.href ? '' : ' data-soon'} style="--d:${-n * 0.6}s;--c2:${i.c};--d2:${i.d}" aria-label="${i.title}، ${i.sub}">
      <span class="art"><img src="../img/${i.id}.png" alt="">${i.tip ? '<span class="mark tip">★ مقترح لك</span>' : ''}${i.left ? '<span class="mark left"><img src="../img/I-11.png" alt="">3 <img src="../img/I-14.png" alt="">1</span>' : ''}</span>
      <span class="name">${i.title}</span><span class="sub">${i.sub}</span></a>`).join('');

  // the dotted way from island to island, drawn once they are laid out
  const way = () => {
    world.querySelector('.way')?.remove();
    const box = world.getBoundingClientRect();
    const pts = [...world.querySelectorAll('.isl .art')].map((a) => { const r = a.getBoundingClientRect(); return [r.left + r.width / 2 - box.left, r.top + r.height * 0.55 - box.top]; });
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let k = 1; k < pts.length; k++) { const [x0, y0] = pts[k - 1], [x1, y1] = pts[k], my = (y0 + y1) / 2; d += ` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`; }
    world.insertAdjacentHTML('afterbegin', `<svg class="way" aria-hidden="true"><path d="${d}"/></svg>`);
  };
  addEventListener('load', way); addEventListener('resize', way);

  // Nour's card offers the journey under way in the garden, as the map's mission does (values.js)
  const j = window.Values && Values.current();
  if (j) {
    document.getElementById('journey').href = `value.html?v=${j.id}`;
    document.getElementById('journey').setAttribute('aria-label', `رحلتك مع نور: قيمة ${j.name}`);
    document.getElementById('journey-name').textContent = `قيمة ${j.name}`;
    if (j.id !== 'cooperation') document.getElementById('journey-about').textContent = j.about;
  }

  // the child the parent chose carries over (a visitor stays a visitor)
  try {
    const kid = JSON.parse(localStorage.getItem('ajyal.profile') || '{}');
    if (!(window.Guest && Guest.on)) {
      if (kid.name) { document.getElementById('me-name').textContent = kid.name; document.getElementById('me').setAttribute('aria-label', `غرفتي: ${kid.name}، المستوى 7`); }
      if (kid.photo || kid.avatar) document.getElementById('me-img').src = kid.photo || `../img/avatars/${kid.avatar}.png`;
    }
  } catch {}

  // the other screens of the app come next
  const toast = document.getElementById('toast');
  document.addEventListener('click', (e) => {
    // the child's card, the bell and the stats open their pages in the app
    const go = e.target.closest('[data-go]'); if (go) { location.href = go.dataset.go; return; }
    const b = e.target.closest('[data-soon]'); if (!b) return;
    e.preventDefault();
    toast.textContent = 'في النموذج: هذه الشاشة على الجوال تأتي في الخطوات القادمة';
    toast.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove('show'), 2200);
  });

  // ---- Nour's tour: on a child's first visit she shows every island, the bar and her journey (?tour=1 shows it again);
  // the same words as the tour on the map of the web, and the same «seen» on this device
  const $ = (id) => document.getElementById(id);
  const tour = $('tour'), spot = $('spot'), card = $('tour-card');
  const SAY = {
    ai: 'هنا نصنع معاً قصة أو فيديو يُكتب عنك.',
    forest: 'هنا فيديوهات وكتب وصور، تتعلم منها أشياء جديدة.',
    beach: 'هنا قصص تقرؤها أو تستمع إليها، ثم تجيب عن أسئلة صغيرة.',
    quran: 'هنا تستمع إلى سور جزء عمّ، وتردّدها، ثم تسمّعها.',
    games: 'هنا ألعاب ممتعة، تتعلم وأنت تلعب.',
    colors: 'هنا ترسم بحرية، وتلوّن الرسومات الجميلة.',
    peak: 'هنا المسابقات! أجب عن الأسئلة، أو شارك برسمتك.',
    letters: 'هنا تتعلم الحروف والأرقام: تراها، وتسمعها، وتكتبها.',
    garden: 'وهذه حديقتي! هنا نزرع القيم معاً، مثل الصدق والتعاون.'
  };
  let who = ''; try { who = JSON.parse(localStorage.getItem('ajyal.profile') || '{}').name || ''; } catch {}
  const STEPS = [
    { t: window.Guest && Guest.on ? 'أهلاً بك! أنا نور' : `أهلاً يا ${who || 'عمر'}! أنا نور`, p: 'أنا صديقتك في عالم أجيال. تعال أعرّفك على الجزر، جزيرة بعد جزيرة!' },
    ...ISLANDS.map((i, n) => ({ isl: n, t: i.title, p: SAY[i.id] })),
    { el: '.tabs', t: 'الشريط السفلي', p: 'من هنا ترجع إلى الخريطة، وتفتح كل الأقسام، وغرفتك، والمتصدرين.' },
    { el: '#journey', t: 'رحلتك معي', p: 'اضغط هنا لتكمل معي رحلة القيمة.' },
    { t: 'أنت جاهز!', p: 'اضغط على أي جزيرة لتبدأ. وأنا معك دائماً.', last: true }
  ];
  let step = 0;
  const seen = () => { try { return localStorage.getItem('ajyal.tour') === 'done'; } catch { return true; } };
  // the light sits on the page, so it stays on its place; the card moves away from it
  function lightOn(el, pad, round) {
    const b = el.getBoundingClientRect(), fixed = getComputedStyle(el).position === 'fixed';
    spot.classList.remove('off');
    Object.assign(spot.style, { position: fixed ? 'fixed' : 'absolute', left: `${b.left - pad + (fixed ? 0 : scrollX)}px`, top: `${b.top - pad + (fixed ? 0 : scrollY)}px`,
      width: `${b.width + pad * 2}px`, height: `${b.height + pad * 2}px`, borderRadius: round ? '50%' : '28px' });
    card.classList.toggle('up', b.top + b.height / 2 > innerHeight * 0.5);
  }
  function lightOff() { spot.classList.add('off'); Object.assign(spot.style, { position: 'fixed', left: '50%', top: '40%', width: '0px', height: '0px' }); card.classList.remove('up'); }
  function show(n) {
    step = n; const S = STEPS[n];
    $('tour-n').textContent = n === 0 || S.last ? 'جولة مع نور' : `${n} من ${STEPS.length - 2}`;
    $('tour-t').textContent = S.t; $('tour-p').textContent = S.p;
    $('tour-back').hidden = n === 0;
    $('tour-next').textContent = n === 0 ? 'هيا بنا' : S.last ? 'لنبدأ!' : 'التالي';
    $('tour-skip').hidden = !!S.last;
    quiet();
    if (S.isl !== undefined) {
      // the island comes up to the top part of the screen, above the card, then the light lands on it
      // (the light glides from island to island; the page itself jumps, so the light always lands where the island is)
      const isl = world.querySelectorAll('.isl')[S.isl];
      scrollTo({ top: isl.getBoundingClientRect().top + scrollY - innerHeight * 0.2, behavior: 'instant' });
      lightOn(isl, 6, false);
    } else if (S.el) {
      if (S.el === '#journey') scrollTo({ top: 0, behavior: 'instant' });
      lightOn(document.querySelector(S.el), 8, false);
    } else { scrollTo({ top: 0, behavior: 'instant' }); lightOff(); }
    $('tour-next').focus({ preventScroll: true });
  }
  function startTour() {
    document.documentElement.style.overflow = 'hidden';
    spot.hidden = false; tour.hidden = false; show(0);
  }
  function endTour() {
    quiet(); tour.hidden = true; spot.hidden = true; lightOff();
    document.documentElement.style.overflow = '';
    try { localStorage.setItem('ajyal.tour', 'done'); } catch {}
    scrollTo({ top: 0, behavior: 'instant' });
    if (new URLSearchParams(location.search).has('tour')) history.replaceState(null, '', location.pathname);
  }
  $('tour-next').addEventListener('click', () => (STEPS[step].last ? endTour() : show(step + 1)));
  $('tour-back').addEventListener('click', () => step > 0 && show(step - 1));
  $('tour-skip').addEventListener('click', endTour);
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !tour.hidden) endTour(); });
  // read aloud for children who do not read yet (in the product: Nour's recorded voice)
  const synth = window.speechSynthesis; synth?.getVoices();
  const quiet = () => { if (synth?.speaking) synth.cancel(); };
  $('tour-hear').addEventListener('click', () => {
    const v = synth?.getVoices().find((x) => x.lang?.startsWith('ar')); if (!v) return;
    quiet();
    const u = new SpeechSynthesisUtterance(`${STEPS[step].t}. ${STEPS[step].p}`); u.voice = v; u.lang = v.lang; u.rate = 0.9; synth.speak(u);
  });
  addEventListener('resize', () => { if (!tour.hidden) show(step); });
  if (new URLSearchParams(location.search).get('tour') === '1' || !seen()) addEventListener('load', () => setTimeout(startTour, 500));
})();
</script>
</body>
</html>
