<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // the Heroes' Peak made for a phone, upright or on its side; a tablet and a computer get the web's peak
  if (!matchMedia('(max-width: 600px), (max-height: 500px)').matches) location.replace('../peak.html' + location.search);
</script>
<script src="../guest.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFF4F0">
<link rel="apple-touch-icon" href="/img/app-icon/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أجيال">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>قمة الأبطال · تطبيق أجيال</title>
<link rel="icon" href="../img/garden/nour-cheer.png">
<script src="../sfx.js"></script>
<script>Sfx.taps();</script>
<style>
@font-face { font-family: 'Thmanyah Sans'; src: url(../fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Thmanyah Sans'; src: url(../fonts/thmanyahsans-Bold.woff2) format('woff2'); font-weight: 600 900; font-display: swap; }
:root {
  --ink: #3A2318; --ink-soft: #6B5A48; --paper: #FFFFFF; --sand: #FFF4F0; --edge: #F2CFC6;
  --coral: #FF7A6B; --coral-deep: #C24A3C; --go: #2E8B2A; --go-deep: #1F6A1C;
  /* the phone's own edges: the status bar, the home bar and, on its side, the camera */
  --top: max(env(safe-area-inset-top), 12px); --bottom: max(env(safe-area-inset-bottom), 10px);
  --side-r: calc(14px + env(safe-area-inset-right)); --side-l: calc(14px + env(safe-area-inset-left));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overflow-x: clip; scrollbar-width: none; } html::-webkit-scrollbar { display: none; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: 'Thmanyah Sans', system-ui, sans-serif; font-weight: 500; color: var(--ink); background: var(--sand); }
img { display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid #D6531E; outline-offset: 3px; }

/* the peak with its trophy, fading into the page; Shaheen the falcon greets the child from his island */
.hero { position: relative; height: calc(var(--top) + 268px); overflow: hidden; }
.hero .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
.hero::after { content: ""; position: absolute; inset: auto 0 0; height: 90px; background: linear-gradient(rgba(255,244,240,0), var(--sand) 90%); }
.bar { position: absolute; z-index: 3; top: var(--top); right: var(--side-r); left: var(--side-l); display: flex; align-items: center; gap: 6px; }
.back { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--paper); box-shadow: 0 3px 0 var(--edge); }
.back svg { width: 22px; height: 22px; }
.find { border: 0; color: #B4531C; cursor: pointer; }
.pill { display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 11px; border-radius: 999px; background: var(--paper); font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 var(--edge); font-variant-numeric: tabular-nums; }
.pill img { width: 22px; height: 22px; }
.pill.time { margin-inline-start: auto; color: #2D6A12; }
.title { position: absolute; z-index: 2; top: calc(var(--top) + 54px); right: var(--side-r); left: var(--side-l); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
h1 { margin: 0; font-size: 40px; font-weight: 800; line-height: 1; color: var(--paper);
  text-shadow: 0 4px 0 var(--coral-deep), 2px 0 0 var(--coral-deep), -2px 0 0 var(--coral-deep), 0 -2px 0 var(--coral-deep), 2px 2px 0 var(--coral-deep), -2px 2px 0 var(--coral-deep), 2px -2px 0 var(--coral-deep), -2px -2px 0 var(--coral-deep); }
.title p { margin: 0; padding: 3px 14px; border-radius: 999px; background: rgba(255,255,255,.9); font-size: 14px; font-weight: 800; }
.guide { position: absolute; z-index: 2; left: calc(env(safe-area-inset-left) + 2px); bottom: 0; width: 140px; height: 140px; animation: float 4.5s ease-in-out infinite; }
.say { position: absolute; z-index: 2; left: calc(env(safe-area-inset-left) + 142px); bottom: 54px; max-width: 200px; margin: 0; padding: 9px 14px 10px; border-radius: 20px; background: var(--paper); font-size: 15px; font-weight: 800; line-height: 1.35; box-shadow: 0 4px 0 var(--coral); }
.say svg { position: absolute; left: -14px; bottom: 12px; }
@keyframes float { 50% { translate: 0 -7px; } }

/* running now or ended: two halves of one switch, staying in reach while the list scrolls */
.seg-bar { position: sticky; z-index: 4; top: 0; padding: 8px var(--side-r) 10px var(--side-l); background: var(--sand); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--paper); box-shadow: 0 3px 0 var(--edge); }
.seg button { flex: 1; height: 42px; border-radius: 999px; font-size: 15px; font-weight: 800; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: linear-gradient(#FF9384, #E85D4D); color: var(--paper); box-shadow: inset 0 3px 0 rgba(255,255,255,.3); }

main { padding: 2px var(--side-r) calc(var(--bottom) + 100px) var(--side-l); }
.note { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.55; color: var(--ink-soft); }

/* a competition: what it is, how long it runs, and where the child stands */
.comps { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; }
.comp { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 14px; border-radius: 26px; background: var(--paper); box-shadow: 0 5px 0 var(--edge); }
.comp:active { translate: 0 2px; }
.cov { position: relative; overflow: hidden; border-radius: 18px; aspect-ratio: 16 / 9; }
.cov img { width: 100%; height: 100%; object-fit: cover; }
.comp.ended .cov img { filter: saturate(.55); }
.type { position: absolute; top: 8px; right: 8px; display: flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.95); font-size: 13px; font-weight: 800; }
.comp b { margin-top: 4px; padding: 0 4px; font-size: 20px; font-weight: 800; line-height: 1.25; }
.comp p { margin: 0; padding: 0 4px; font-size: 14px; font-weight: 700; line-height: 1.5; color: var(--ink-soft); }
.when { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }
.when span { display: flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: #FFF1EC; font-size: 12px; font-weight: 800; }
.when .soon { background: #FFE9C2; color: #8A5A00; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; padding: 0 4px; }
.me { min-width: 0; font-size: 14px; font-weight: 800; line-height: 1.35; }
.me.ok { color: var(--go-deep); } .me.wait { color: #8A5A00; } .me.win { color: var(--coral-deep); }
.cta { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px; border-radius: 999px; background: var(--go); color: var(--paper); font-size: 15px; font-weight: 800; box-shadow: 0 4px 0 var(--go-deep); }
.cta svg { width: 14px; height: 14px; }
.comp.ended .cta { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 2px var(--edge), 0 4px 0 var(--edge); }
.empty { margin: 14px 0 0; padding: 18px 20px; border-radius: 22px; background: rgba(255,255,255,.75); font-size: 15px; font-weight: 700; color: var(--ink-soft); }

/* the bar at the bottom, as on the phone's home */
.tabs { position: fixed; z-index: 6; left: var(--side-l); right: var(--side-r); bottom: var(--bottom); display: flex; justify-content: space-around; padding: 8px 6px; border-radius: 28px; background: rgba(255,250,242,.97); box-shadow: 0 0 0 2px #F3DDBB, 0 10px 24px rgba(120,50,30,.2); }
.tabs a, .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 4px 6px; border-radius: 18px; font-size: 12px; font-weight: 800; color: var(--ink-soft); white-space: nowrap; }
.tabs img { width: 34px; height: 34px; }

.toast { position: fixed; z-index: 9; left: 50%; bottom: calc(var(--bottom) + 92px); translate: -50% 0; width: max-content; max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 999px; background: rgba(58,35,24,.92); color: var(--paper); font-size: 14px; font-weight: 700; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }

/* a phone on its side: a low hero with the name beside Shaheen, two competitions a row, and the bar as one slim row */
@media (max-height: 500px) {
  .hero { height: calc(var(--top) + 150px); }
  .hero .bg { object-position: 50% 30%; }
  .title { top: calc(var(--top) + 6px); right: 70px; left: 280px; }
  h1 { font-size: 32px; }
  .title p { font-size: 13px; }
  .guide { width: 116px; height: 116px; left: calc(env(safe-area-inset-left) + 8px); }
  .say { left: calc(env(safe-area-inset-left) + 124px); bottom: 40px; max-width: 180px; padding: 7px 12px 8px; font-size: 13px; }
  .bar .pill:not(.time) { display: none; }
  .bar { pointer-events: none; } .bar > * { pointer-events: auto; }
  .seg-bar { padding-top: 4px; padding-bottom: 8px; }
  .seg { width: min(420px, 100%); margin: 0 auto; }
  .seg button { height: 38px; font-size: 14px; }
  main { padding-bottom: calc(var(--bottom) + 70px); }
  .note { text-align: center; }
  .comps { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .comp { display: grid; grid-template-columns: 150px minmax(0, 1fr); grid-template-rows: auto auto auto 1fr; column-gap: 12px; row-gap: 4px; align-content: start; padding: 10px; }
  .cov { grid-row: 1 / 5; aspect-ratio: auto; height: 100%; min-height: 150px; }
  .comp b { margin-top: 0; font-size: 17px; }
  .comp p { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { flex-direction: column; align-items: flex-start; gap: 6px; align-self: end; }
  .cta { height: 38px; font-size: 14px; }
  .tabs { left: 50%; right: auto; translate: -50% 0; gap: 2px; padding: 4px 6px; }
  .tabs a, .tabs button { flex-direction: row; gap: 5px; min-width: 0; padding: 4px 12px; font-size: 13px; }
  .tabs img { width: 26px; height: 26px; }
  .toast { bottom: calc(var(--bottom) + 60px); }
}
@media (prefers-reduced-motion: reduce) { .guide { animation: none; } }
</style>
</head>
<body>
<header class="hero">
  <img class="bg" src="../img/peak/peak-hero.jpg" alt="">
  <div class="bar">
    <a class="back" href="../index.html" aria-label="العودة إلى الخريطة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <button class="back find" type="button" id="find" aria-label="ابحث في قمة الأبطال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <span class="pill time" title="الوقت المتبقي اليوم" role="img" aria-label="الوقت المتبقي اليوم: 35 دقيقة"><img src="../img/hud/clock.png" alt="">35 د</span>
    <span class="pill" title="النقاط" role="img" aria-label="النقاط: 3,240"><img src="../img/hud/points.png" alt="">3,240</span>
    <span class="pill" title="الشارات" role="img" aria-label="الشارات: 6"><img src="../img/hud/badge.png" alt="">6</span>
  </div>
  <div class="title">
    <h1>قمة الأبطال</h1>
    <p>شارك في المسابقات مع الصقر شاهين</p>
  </div>
  <img class="guide" src="../img/peak.png" alt="الصقر شاهين في قمة الأبطال">
  <p class="say">أهلاً يا <span id="kid">عمر</span>! أنا شاهين. أي مسابقة تشارك فيها اليوم؟<svg width="22" height="18" viewBox="0 0 30 24" aria-hidden="true"><path d="M30 0 L0 22 L26 18 z" fill="#FFFFFF"/></svg></p>
</header>

<div class="seg-bar">
  <div class="seg" role="group" aria-label="المسابقات" id="seg"><button type="button" data-v="open" aria-pressed="true"></button><button type="button" data-v="ended" aria-pressed="false"></button></div>
</div>

<main>
  <p class="note">المسابقات من فريق أجيال. في المسابقة السريعة تجيب عن أسئلة بوقت محدد، وفي المسابقة المستمرة تشارك بعملك ويصوّت الأطفال.</p>
  <!-- the competitions the admin made (peak-data.js, the same as the web's peak) -->
  <div class="comps" id="comps"></div>
</main>

<nav class="tabs" aria-label="التنقل">
  <a href="../index.html"><img src="../img/nav/map.png" alt="">الخريطة</a>
  <a href="sections.html"><img src="../img/nav/sections.png" alt="">كل الأقسام</a>
  <a href="room.html"><img src="../img/nav/room.png" alt="">غرفتي</a>
  <a href="leaders.html"><img src="../img/nav/leaders.png" alt="">المتصدرون</a>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="../peak.js"></script>
<script src="../peak-data.js"></script>
<script src="../search.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { ar } = Peak;
  // search inside the peak, by typing or by voice (search.js)
  IslandSearch.mount({ button: $('find'), where: 'قمة الأبطال', items: () => PeakBoard.searchItems('../') });
  const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let tab = 'open';

  // the running and the ended competitions, as in the web's peak
  function render() {
    const L = PeakBoard.lists('../');
    const [b1, b2] = $('seg').querySelectorAll('button');
    b1.textContent = `جارية الآن (${ar(L.open.length)})`; b2.textContent = `انتهت (${ar(L.ended.length)})`;
    const list = L[tab];
    $('comps').innerHTML = list.length ? list.map((c) => `<a class="comp ${c.on ? '' : 'ended'}" href="${c.href}">
        <span class="cov"><img src="${c.cover}" alt=""><span class="type">${c.type}</span></span>
        <b>${c.name}</b><p>${c.about}</p>
        <span class="when"><span class="${c.on ? 'soon' : ''}">${c.when}</span><span>${c.people}</span></span>
        <span class="foot"><span class="me ${c.cls}">${c.me}</span><span class="cta">${c.cta}${ARROW}</span></span></a>`).join('')
      : '<p class="empty">لا توجد مسابقات هنا الآن، تابع القمة قريباً</p>';
  }
  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.v; $('seg').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); render();
  });
  // coming back from a competition shows the child's new part in it
  addEventListener('pageshow', (e) => { if (e.persisted) render(); });
  render();

  // the child the parent chose carries over (a visitor stays a visitor)
  try {
    const kid = JSON.parse(localStorage.getItem('ajyal.profile') || '{}');
    if (kid.name && !(window.Guest && Guest.on)) document.getElementById('kid').textContent = kid.name;
  } catch {}

  // the other screens of the app come next
  const toast = $('toast');
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-soon]')) return;
    toast.textContent = 'في النموذج: هذه الشاشة على الجوال تأتي في الخطوات القادمة';
    toast.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove('show'), 2200);
  });
})();
</script>
</body>
</html>
