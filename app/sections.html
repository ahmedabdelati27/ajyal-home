<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // all the sections made for a phone, upright or on its side; a tablet and a computer get the web's page
  if (!matchMedia('(max-width: 600px), (max-height: 500px)').matches) location.replace('../sections.html' + location.search);
</script>
<script src="../guest.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EAF6F2">
<link rel="apple-touch-icon" href="/img/app-icon/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أجيال">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>كل الأقسام · تطبيق أجيال</title>
<link rel="icon" href="../img/garden/nour-cheer.png">
<script src="../sfx.js"></script>
<script>Sfx.taps();</script>
<style>
/* moving between the app's pages fades instead of flashing white (where the browser can) */
@view-transition { navigation: auto; }
@font-face { font-family: 'Thmanyah Sans'; src: url(../fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Thmanyah Sans'; src: url(../fonts/thmanyahsans-Bold.woff2) format('woff2'); font-weight: 600 900; font-display: swap; }
:root {
  --ink: #3A2318; --ink-soft: #6B5A48; --paper: #FFFFFF; --page: #EAF6F2; --edge: #CDE6DE;
  --sea: #2F6FA8; --go: #2E8B2A; --go-deep: #1F6A1C; --leaf: #5BC236;
  /* the phone's own edges: the status bar, the home bar and, on its side, the camera */
  --top: max(env(safe-area-inset-top), 12px); --bottom: max(env(safe-area-inset-bottom), 10px);
  --side-r: calc(14px + env(safe-area-inset-right)); --side-l: calc(14px + env(safe-area-inset-left));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overflow-x: clip; scrollbar-width: none; } html::-webkit-scrollbar { display: none; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: 'Thmanyah Sans', system-ui, sans-serif; font-weight: 500; color: var(--ink); background: var(--page); }
img { display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid #D6531E; outline-offset: 3px; }

/* the whole world from the sea at the top, fading into the page; Nour greets the child */
.hero { position: relative; height: calc(var(--top) + 240px); overflow: hidden; }
.hero .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 52%; }
.hero::after { content: ""; position: absolute; inset: auto 0 0; height: 80px; background: linear-gradient(rgba(234,246,242,0), var(--page) 90%); }
.bar { position: absolute; z-index: 3; top: var(--top); right: var(--side-r); left: var(--side-l); display: flex; align-items: center; gap: 6px; }
.back { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--paper); box-shadow: 0 3px 0 var(--edge); }
.back svg { width: 22px; height: 22px; }
.pill { display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 11px; border-radius: 999px; background: var(--paper); font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 var(--edge); font-variant-numeric: tabular-nums; }
.pill img { width: 22px; height: 22px; }
.pill.time { margin-inline-start: auto; color: #2D6A12; }
.title { position: absolute; z-index: 2; top: calc(var(--top) + 54px); right: var(--side-r); left: var(--side-l); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
h1 { margin: 0; font-size: 40px; font-weight: 800; line-height: 1; color: var(--paper);
  text-shadow: 0 4px 0 var(--sea), 2px 0 0 var(--sea), -2px 0 0 var(--sea), 0 -2px 0 var(--sea), 2px 2px 0 var(--sea), -2px 2px 0 var(--sea), 2px -2px 0 var(--sea), -2px -2px 0 var(--sea); }
.title p { margin: 0; padding: 3px 14px; border-radius: 999px; background: rgba(255,255,255,.9); font-size: 14px; font-weight: 800; }
.guide { position: absolute; z-index: 2; left: calc(env(safe-area-inset-left) + 12px); bottom: 8px; width: 92px; animation: float 4.5s ease-in-out infinite; }
.say { position: absolute; z-index: 2; left: calc(env(safe-area-inset-left) + 116px); bottom: 46px; max-width: 200px; margin: 0; padding: 9px 14px 10px; border-radius: 20px; background: var(--paper); font-size: 15px; font-weight: 800; line-height: 1.35; box-shadow: 0 4px 0 #F2C94C; }
.say svg { position: absolute; left: -14px; bottom: 12px; }
@keyframes float { 50% { translate: 0 -7px; } }

main { padding: 4px var(--side-r) calc(var(--bottom) + 100px) var(--side-l); }

/* carry on: the one thing the child left half done */
.cont { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 22px; background: var(--paper); box-shadow: 0 5px 0 var(--edge); }
.cont .thumb { position: relative; flex-shrink: 0; width: 74px; height: 92px; overflow: hidden; border-radius: 14px; }
.cont .thumb img { width: 100%; height: 100%; object-fit: cover; }
.cont .txt { flex: 1; min-width: 0; }
.cont small { display: block; font-size: 12px; font-weight: 800; color: #2E7D32; }
.cont b { display: block; font-size: 18px; font-weight: 800; line-height: 1.25; }
.cont .when { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.cont .when span { white-space: nowrap; }
.cont .meter { display: block; max-width: 260px; height: 7px; margin-top: 6px; border-radius: 999px; background: #E3EFE9; overflow: hidden; }
.cont .meter i { display: block; width: 60%; height: 100%; border-radius: inherit; background: var(--leaf); }
.cont .go { flex-shrink: 0; display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px; border-radius: 999px; background: var(--go); color: var(--paper); font-size: 15px; font-weight: 800; box-shadow: 0 4px 0 var(--go-deep); }
.cont .go svg { width: 14px; height: 14px; }

h2 { margin: 22px 0 12px; font-size: 21px; font-weight: 800; }

/* every place of the world, two to a row: the island on its own place, its name, and the way in */
.places { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.place { position: relative; min-width: 0; display: flex; flex-direction: column; padding: 7px 7px 12px; border-radius: 22px; background: var(--paper); box-shadow: 0 5px 0 var(--edge); transition: transform .2s; }
.place:active { transform: translateY(2px); }
.place .art { min-width: 0; height: 116px; border-radius: 16px; background: var(--bg) center 45% / cover, var(--c); display: grid; place-items: center; overflow: hidden; }
.place .art img { width: 124px; max-width: 90%; filter: drop-shadow(0 6px 5px rgba(0,0,0,.2)); }
.place b { padding: 8px 5px 0; font-size: 18px; font-weight: 800; line-height: 1.2; }
.place p { flex: 1; margin: 2px 0 0; padding: 0 5px; font-size: 13px; font-weight: 700; line-height: 1.35; color: var(--ink-soft); }
/* the little sign: suggested for the child, or what is under way */
.tag { position: absolute; top: 13px; right: 13px; display: flex; align-items: center; gap: 4px; max-width: calc(100% - 26px); height: 26px; padding: 0 9px; border-radius: 999px; background: rgba(255,255,255,.95); font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; box-shadow: 0 2px 0 rgba(0,0,0,.1); }
.tag img { flex-shrink: 0; width: 16px; height: 16px; }
.tag.tip { background: #FFF1C9; color: #8A5A00; }
.go-in { align-self: flex-start; display: inline-flex; align-items: center; height: 36px; margin: 8px 5px 0; padding: 0 18px; border-radius: 999px; background: var(--d); color: var(--paper); font-size: 15px; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
/* a place left alone on the last row takes the whole row */
.place:last-child:nth-child(odd) { grid-column: 1 / -1; }
@media (hover: hover) { .place:hover { transform: translateY(-3px); } }

/* the bar at the bottom, as on the phone's home; this page is its «كل الأقسام» */
.tabs { position: fixed; z-index: 6; left: var(--side-l); right: var(--side-r); bottom: var(--bottom); display: flex; justify-content: space-around; padding: 8px 6px; border-radius: 28px; background: rgba(255,250,242,.97); box-shadow: 0 0 0 2px #F3DDBB, 0 10px 24px rgba(20,70,80,.2); }
.tabs a, .tabs button { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 4px 6px; border-radius: 18px; font-size: 12px; font-weight: 800; color: var(--ink-soft); white-space: nowrap; }
.tabs img { width: 34px; height: 34px; }
.tabs [aria-current="page"] { background: #FFE9C2; color: var(--ink); }

.toast { position: fixed; z-index: 9; left: 50%; bottom: calc(var(--bottom) + 92px); translate: -50% 0; width: max-content; max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 999px; background: rgba(58,35,24,.92); color: var(--paper); font-size: 14px; font-weight: 700; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }

/* a phone on its side: a low sea with the name beside Nour, three places to a row, and the bar as one slim row */
@media (max-height: 500px) {
  .hero { height: calc(var(--top) + 132px); }
  .hero .bg { object-position: 50% 48%; }
  .title { top: calc(var(--top) + 6px); right: 70px; left: 290px; }
  h1 { font-size: 32px; }
  .title p { font-size: 13px; }
  .guide { width: 68px; bottom: 6px; left: calc(env(safe-area-inset-left) + 18px); }
  .say { left: calc(env(safe-area-inset-left) + 98px); bottom: 30px; max-width: 170px; padding: 7px 12px 8px; font-size: 13px; }
  .bar .pill:not(.time) { display: none; }
  .bar { pointer-events: none; } .bar > * { pointer-events: auto; }
  main { padding-bottom: calc(var(--bottom) + 70px); }
  .cont { padding: 8px; } .cont .thumb { width: 58px; height: 72px; }
  h2 { margin: 16px 0 10px; font-size: 19px; }
  .places { grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .place:last-child:nth-child(odd) { grid-column: auto; }
  .place .art { height: 104px; }
  .tabs { left: 50%; right: auto; translate: -50% 0; gap: 2px; padding: 4px 6px; }
  .tabs a, .tabs button { flex-direction: row; gap: 5px; min-width: 0; padding: 4px 12px; font-size: 13px; }
  .tabs img { width: 26px; height: 26px; }
  .toast { bottom: calc(var(--bottom) + 60px); }
}
@media (prefers-reduced-motion: reduce) { .guide { animation: none; } .place { transition: none; } }
</style>
</head>
<body>
<header class="hero">
  <img class="bg" src="../img/map-wide.jpg" alt="">
  <div class="bar">
    <a class="back" href="../index.html" aria-label="العودة إلى الخريطة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <span class="pill time" title="الوقت المتبقي اليوم" role="img" aria-label="الوقت المتبقي اليوم: 35 دقيقة"><img src="../img/hud/clock.png" alt="">35 د</span>
    <span class="pill" title="النقاط" role="img" aria-label="النقاط: 3,240"><img src="../img/hud/points.png" alt="">3,240</span>
  </div>
  <div class="title">
    <h1>كل الأقسام</h1>
    <p>كل أماكن عالم أجيال في مكان واحد</p>
  </div>
  <img class="guide" src="../img/garden/nour-wave.png" alt="نور تلوّح بيدها">
  <p class="say">أهلاً يا <span id="kid">عمر</span>! اختر مكاناً لنبدأ<svg width="22" height="18" viewBox="0 0 30 24" aria-hidden="true"><path d="M30 0 L0 22 L26 18 z" fill="#FFFFFF"/></svg></p>
</header>

<main>
  <a class="cont" href="../story.html?resume=1" aria-label="أكمل قصة الأرنب الصادق في شاطئ الحكايات، الصفحة 6 من 10">
    <span class="thumb"><img src="../img/stories/cover-00.jpg" alt=""></span>
    <span class="txt"><small>أكمل من حيث توقفت</small><b>الأرنب الصادق</b><span class="when">شاطئ الحكايات · <span>الصفحة 6 من 10</span></span><span class="meter"><i></i></span></span>
    <span class="go">أكمل<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14L6 12z" fill="#FFFFFF"/></svg></span>
  </a>

  <h2>إلى أين تذهب اليوم؟</h2>
  <!-- the same places as the map, in the order a child meets them (sections-data.js, shared with the web's page) -->
  <div class="places" id="places"></div>
</main>

<nav class="tabs" aria-label="التنقل">
  <a href="../index.html"><img src="../img/nav/map.png" alt="">الخريطة</a>
  <button type="button" aria-current="page" id="here"><img src="../img/nav/sections.png" alt="">كل الأقسام</button>
  <a href="room.html"><img src="../img/nav/room.png" alt="">غرفتي</a>
  <a href="leaders.html"><img src="../img/nav/leaders.png" alt="">المتصدرون</a>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="../values.js"></script>
<script src="../workshop.js"></script>
<script src="../sections-data.js"></script>
<script>
(() => {
  // each place opens its island in the app; the signs about the child's own progress are a visitor's to skip (guest.js hides .state)
  const host = document.getElementById('places');
  host.innerHTML = Sections.places('../').map((p) => `<a class="place" href="${p.href}" data-sfx="none" style="--c:${p.c};--d:${p.d};--bg:url(${p.bg})" aria-label="${p.title}، ${p.sub}${p.tip ? '، مقترح لك' : ''}">
    <span class="art"><img src="${p.art}" alt=""></span>
    ${p.tip ? '<span class="tag tip"><img src="../img/I-15.png" alt="">مقترح لك</span>' : p.tag ? `<span class="tag state">${p.tag}</span>` : ''}
    <b>${p.title}</b><p>${p.sub}</p><span class="go-in" aria-hidden="true">ادخل</span></a>`).join('');

  // tapping a place plays the opening sound and lets it start before the island loads
  host.addEventListener('click', (e) => {
    const a = e.target.closest('a.place'); if (!a || e.defaultPrevented || e.ctrlKey || e.metaKey) return;
    e.preventDefault(); Sfx.play('open');
    setTimeout(() => { location.href = a.href; }, 160);
  });

  // the current tab takes the child back to the top
  document.getElementById('here').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

  // the child the parent chose carries over (a visitor stays a visitor)
  try {
    const kid = JSON.parse(localStorage.getItem('ajyal.profile') || '{}');
    if (kid.name && !(window.Guest && Guest.on)) document.getElementById('kid').textContent = kid.name;
  } catch {}

  // the other screens of the app come next
  const toast = document.getElementById('toast');
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-soon]')) return;
    e.preventDefault();
    toast.textContent = 'في النموذج: هذه الشاشة على الجوال تأتي في الخطوات القادمة';
    toast.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove('show'), 2200);
  });
})();
</script>
</body>
</html>
