<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرفتي · أجيال الصالحية</title>
<link rel="stylesheet" href="clouds.css">
<link rel="stylesheet" href="hub.css">
<script src="clouds.js"></script>
<script src="sfx.js"></script>
<script>Sfx.taps();</script>
<style>
.hero { --hero: url(img/room/room-hero.jpg); }
:root { --accent-deep: #8A4B1A; }
/* the child's card sits on the left of the room */
.me { position: absolute; z-index: 3; left: 80px; top: 96px; width: 420px; display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; padding: 18px; }
.me .face { width: 120px; height: 120px; border-radius: 50%; border: 5px solid #FFFFFF; box-shadow: 0 5px 0 var(--edge); }
.me b { display: block; font-size: 32px; font-weight: 800; line-height: 1.2; }
.me small { display: block; font-size: 17px; font-weight: 700; color: var(--ink-soft); }
.me .btn { margin-top: 10px; height: 42px; padding: 0 16px; font-size: 16px; }

.seg { align-self: flex-start; display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--paper); box-shadow: 0 4px 0 var(--edge); }
.seg button { height: 50px; padding: 0 24px; border: 0; border-radius: 999px; background: none; font-size: 19px; font-weight: 800; }
.seg button[aria-selected="true"] { background: linear-gradient(#F7A35C, #E07A2E); color: var(--paper); }
[role="tabpanel"] { display: flex; flex-direction: column; gap: 22px; }
[role="tabpanel"][hidden] { display: none; }

/* points, level and days in a row */
.nums { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; }
.num { padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
.num .k { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: var(--ink-soft); }
.num .k img { width: 34px; height: 34px; }
.num .v { font-size: 38px; font-weight: 800; line-height: 1.1; }
.lvl-bar { height: 16px; border-radius: 999px; background: #F2E6D4; overflow: hidden; }
.lvl-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FFC93C, #F4823F); }
.num small { font-size: 16px; font-weight: 700; color: var(--ink-soft); }
.num.link { color: var(--ink); text-decoration: none; }
.num.link small { color: var(--accent-deep); font-weight: 800; }
.rules-note { margin: 0; padding: 12px 18px; border-radius: 18px; background: #FFF1DD; font-size: 16px; font-weight: 700; color: var(--ink-soft); }

/* badges: the ones earned shine, the others say how to get them */
.badges-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.badges-head .btn { height: 48px; padding: 0 20px; font-size: 17px; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 12px 18px; text-align: center; }
.badge img { width: 120px; height: 120px; }
.badge b { font-size: 19px; font-weight: 800; }
.badge small { font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.badge.no img { filter: grayscale(1) opacity(.45); }
.badge.no b { color: var(--ink-soft); }

/* progress: one row per journey, with a way back in */
.prog { display: grid; grid-template-columns: 90px 1fr auto; gap: 18px; align-items: center; padding: 14px 18px 14px 14px; }
.prog .isl { width: 90px; height: 90px; border-radius: 22px; background: var(--c); display: grid; place-items: center; }
.prog .isl img { width: 100px; margin: 0 -5px; }
.prog b { font-size: 22px; font-weight: 800; }
.prog .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.prog .pbar { flex: 1; height: 14px; border-radius: 999px; background: #F2E6D4; overflow: hidden; }
.prog .pbar i { display: block; height: 100%; border-radius: 999px; background: var(--d); }
.prog .row span { font-size: 16px; font-weight: 800; white-space: nowrap; }
.prog small { display: block; margin-top: 6px; font-size: 16px; font-weight: 700; color: var(--ink-soft); }

/* «إبداعاتي»: every kind, each with its state */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--paper); font-size: 17px; font-weight: 800; box-shadow: 0 4px 0 var(--edge); }
.chip[aria-pressed="true"] { background: #FFE2C4; box-shadow: 0 4px 0 #F1B27A; }
.works-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.upload { position: relative; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
.works { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.work { display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 14px; border: 0; text-align: start; color: var(--ink); transition: transform .15s; }
.work:hover { transform: translateY(-3px); }
.work .pic { display: block; border-radius: 18px; overflow: hidden; background: #FFFFFF; box-shadow: inset 0 0 0 2px var(--edge); }
.work img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.work b { padding: 0 6px; font-size: 18px; font-weight: 800; line-height: 1.3; }
.work .tags { padding: 0 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.work i { font-style: normal; height: 28px; padding: 0 10px; border-radius: 999px; background: #F5EDE2; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; }
.work i.review { background: #FFE9C2; color: #8A5A00; } .work i.published { background: #DDF5D2; color: var(--go-deep); } .work i.rejected { background: #FFE0DC; color: #A13A2E; }
#work .big { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 20px; background: #FFFFFF; box-shadow: inset 0 0 0 2px var(--edge); margin-bottom: 12px; }
#work .tags { display: flex; gap: 8px; margin-bottom: 10px; }
#work .tags i { font-style: normal; height: 32px; padding: 0 12px; border-radius: 999px; background: #F5EDE2; font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; }
#work .tags i.review { background: #FFE9C2; color: #8A5A00; } #work .tags i.published { background: #DDF5D2; color: var(--go-deep); } #work .tags i.rejected { background: #FFE0DC; color: #A13A2E; }

/* small windows: change name and picture, delete a work */
dialog { width: min(560px, calc(100vw - 32px)); padding: 24px; border: 0; border-radius: 30px; background: #FFFDF8; color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(58,35,24,.45); }
dialog h3 { margin: 0 0 12px; font-size: 26px; font-weight: 800; }
dialog p { margin: 0 0 14px; font-size: 17px; font-weight: 700; color: var(--ink-soft); line-height: 1.6; }
dialog label { display: block; margin-bottom: 6px; font-size: 17px; font-weight: 800; }
dialog input[type=text] { width: 100%; height: 54px; padding: 0 16px; border: 3px solid var(--edge); border-radius: 16px; font: inherit; font-size: 21px; font-weight: 800; color: var(--ink); background: #FFFFFF; }
dialog input[type=text]:focus { outline: none; border-color: var(--accent); }
.err { min-height: 22px; margin: 6px 0 4px !important; font-size: 15px !important; color: #A13A2E !important; }
.faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 18px; }
.faces button { padding: 4px; border: 4px solid transparent; border-radius: 50%; background: none; }
.faces button[aria-pressed="true"] { border-color: var(--accent); }
.faces img { width: 100%; border-radius: 50%; }
.dbtns { display: flex; gap: 10px; flex-wrap: wrap; }

.narrow .me { left: 32px; right: 32px; top: 90px; width: auto; }
.narrow .head { top: 330px; }
.embed .me { top: 40px; } .embed .narrow .me { top: 32px; } .embed .narrow .head { top: 270px; }
.narrow .seg button { padding: 0 16px; font-size: 17px; }
.narrow .nums { grid-template-columns: 1fr 1fr; } .narrow .nums .num:first-child { grid-column: 1 / -1; }
.narrow .badges { grid-template-columns: 1fr 1fr; }
.narrow .prog { grid-template-columns: 76px 1fr; } .narrow .prog .isl { width: 76px; height: 76px; } .narrow .prog .isl img { width: 84px; }
.narrow .prog .btn { grid-column: 1 / -1; }
.narrow .works { grid-template-columns: 1fr 1fr; }
</style>
<link rel="stylesheet" href="dock.css">
</head>
<body>
<div id="wrap"><div id="page">
<header class="hero">
  <div class="bar">
    <a class="pill back" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>العودة إلى الخريطة</span></a>
    <div class="stats"><span class="pill" title="الوقت المتبقي اليوم" style="color:#2D6A12"><img src="img/hud/clock.png" alt="">35 د</span></div>
  </div>
  <div class="me card" id="mycard"></div>
  <div class="head">
    <h1>غرفتي</h1>
    <p>ملفك وتقدمك وإبداعاتك</p>
  </div>
</header>

<main>
  <div class="seg" role="tablist" aria-label="غرفتي" id="tabs">
    <button type="button" role="tab" id="t-me" aria-controls="p-me" data-v="me">ملفي</button>
    <button type="button" role="tab" id="t-progress" aria-controls="p-progress" data-v="progress">تقدمي</button>
    <button type="button" role="tab" id="t-works" aria-controls="p-works" data-v="works">إبداعاتي</button>
  </div>

  <section role="tabpanel" id="p-me" aria-labelledby="t-me">
    <div class="nums" id="nums"></div>
    <p class="rules-note">تاريخ ميلادك، ووقت اللعب، وما يمكنك استخدامه، يحددها ولي أمرك أو معلّمك. أنت تغيّر اسمك وصورتك فقط.</p>
    <div class="badges-head"><h2 id="badges-t"></h2><a class="btn soft" href="index.html?open=badges">كل الشارات وكيف تحصل عليها</a></div>
    <div class="badges" id="badges"></div>
  </section>

  <section role="tabpanel" id="p-progress" aria-labelledby="t-progress" hidden>
    <p class="note" style="margin:0">اختر نشاطاً لم تكمله، وأكمله من حيث توقفت.</p>
    <div id="progs" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>

  <section role="tabpanel" id="p-works" aria-labelledby="t-works" hidden>
    <div class="works-top">
      <div class="chips" role="group" aria-label="نوع الإبداع" id="chips"></div>
      <label class="btn soft upload">📷 ارفع رسمة من جهازك<input type="file" accept="image/png, image/jpeg" id="file"></label>
    </div>
    <div class="works" id="works"></div>
  </section>
</main>
</div></div>

<nav class="dock" aria-label="التنقل السريع">
  <a href="index.html" aria-label="الخريطة"><img src="img/nav/map.png" alt=""><span>الخريطة</span></a>
  <a href="index.html?open=sections" aria-label="كل الأقسام"><img src="img/nav/sections.png" alt=""><span>كل الأقسام</span></a>
  <a href="index.html?open=room" aria-current="page" aria-label="غرفتي"><img src="img/nav/room.png" alt=""><span>غرفتي</span></a>
  <a href="index.html?open=leaders" aria-label="المتصدرون، ترتيبك 12"><img src="img/nav/leaders.png" alt=""><span>المتصدرون</span><span class="rank">12</span></a>
</nav>
<div class="toast" id="toast" role="status"></div>

<dialog id="edit" aria-labelledby="edit-t">
  <h3 id="edit-t">غيّر اسمك وصورتك</h3>
  <label for="name">اسمك</label>
  <input type="text" id="name" maxlength="12" autocomplete="off">
  <p class="err" id="name-err" role="alert"></p>
  <label id="faces-t">صورتك</label>
  <div class="faces" role="group" aria-labelledby="faces-t" id="faces"></div>
  <div class="dbtns"><button class="btn go" type="button" id="edit-ok">احفظ</button><button class="btn soft" type="button" id="edit-no">إلغاء</button></div>
</dialog>
<dialog id="work" aria-labelledby="work-t">
  <h3 id="work-t"></h3>
  <div id="work-b"></div>
</dialog>
<dialog id="ask" aria-labelledby="ask-t">
  <h3 id="ask-t"></h3>
  <p id="ask-p"></p>
  <div class="dbtns"><button class="btn warn" type="button" id="ask-ok">احذف</button><button class="btn soft" type="button" id="ask-no">لا، أبقِها</button></div>
</dialog>

<script src="valley.js"></script>
<script src="values.js"></script>
<script src="profile.js"></script>
<script src="hub.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { ar, num, AVATARS, BADGES } = Profile;
  let me = Profile.read();

  // ---- the child's card and «ملفي»
  function card() {
    $('mycard').innerHTML = `<img class="face" src="img/avatars/${me.avatar}.png" alt="">
      <div><b>${me.name}</b><small>${ar(me.age)} سنوات · المستوى ${ar(me.level)}</small>
      <button class="btn soft" type="button" id="edit-open">✏️ غيّر اسمك وصورتك</button></div>`;
  }
  function mine() {
    const pct = Math.round((me.xp - me.from) / (me.to - me.from) * 100);
    $('nums').innerHTML = `<div class="num card"><span class="k"><img src="img/I-08.png" alt="">المستوى ${ar(me.level)}</span>
        <span class="lvl-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="التقدم نحو المستوى ${ar(me.level + 1)}"><i style="width:${pct}%"></i></span>
        <small>باقي ${num(me.to - me.xp)} نقطة للوصول إلى المستوى ${ar(me.level + 1)}</small></div>
      <div class="num card"><span class="k"><img src="img/hud/points.png" alt="">مجموع نقاطي</span><span class="v">${num(me.xp)}</span></div>
      <a class="num card link" href="index.html?open=streak" aria-label="أيامي المتتالية: ${ar(me.streak)}"><span class="k"><img src="img/hud/streak.png" alt="">أيام متتالية</span><span class="v">${ar(me.streak)}</span><small>شاهد أيامك ←</small></a>`;
    const got = BADGES.filter((b) => b.got).length;
    $('badges-t').textContent = `شاراتي (${ar(got)} من ${ar(BADGES.length)})`;
    $('badges').innerHTML = BADGES.map((b) => `<div class="badge card ${b.got ? '' : 'no'}"><img src="img/badges/${b.id}.png" alt="">
      <b>${b.n}</b><small>${b.got ? 'حصلت عليها' : b.how}</small></div>`).join('');
  }

  // ---- «تقدمي»: only the journeys, with a simple bar, a count and the last thing done
  function progress() {
    const vals = Values.VALUES, doneVals = vals.filter((v) => Values.state(v).complete).length, cur = Values.current();
    const P = [
      // «أكمل» opens the unfinished thing itself; the counts match what each region shows
      { isl: 'beach', c: '#FFE3EA', d: '#E0607F', n: 'القصص', done: 3, of: 12, last: 'الأرنب الصادق، الصفحة ٦', href: 'story.html?resume=1' },
      { isl: 'letters', c: '#FFF2C2', d: '#E0B000', n: 'الحروف والأرقام', done: 7, of: 64, last: 'حرف الباء', href: 'learn.html?k=l&id=ب' },
      { isl: 'quran', c: '#E2F4D6', d: '#5DAA33', n: 'القرآن الكريم', done: 2, of: 37, last: 'سورة الإخلاص', href: 'surah.html?s=112' },
      { isl: 'games', c: '#ECE6FD', d: '#7B64DA', n: 'الألعاب', done: 2, of: 9, last: 'نظّف البحر', href: 'game.html?resume=1' },
      { isl: 'garden', c: '#D9F3EA', d: '#3FB396', n: 'حديقة القيم', done: doneVals, of: vals.length, last: cur ? `قيمة ${cur.name}، ${ar(Values.state(cur).n)} من ${ar(Values.state(cur).all)} خطوات` : '', href: cur ? `value.html?v=${cur.id}` : 'garden.html' }
    ];
    $('progs').innerHTML = P.map((p) => `<div class="prog card" style="--c:${p.c};--d:${p.d}">
      <span class="isl"><img src="img/${p.isl}.png" alt=""></span>
      <div><b>${p.n}</b><span class="row"><span class="pbar" aria-hidden="true"><i style="width:${Math.round(p.done / p.of * 100)}%"></i></span><span>أكملت ${ar(p.done)} من ${ar(p.of)}</span></span>
        ${p.last ? `<small>آخر نشاط: ${p.last}</small>` : ''}</div>
      ${p.last ? `<a class="btn go" href="${p.href}" aria-label="أكمل ${p.last}">أكمل</a>` : `<a class="btn soft" href="${p.href}">ابدأ</a>`}</div>`).join('');
  }

  // ---- «إبداعاتي»: everything the child made, by kind; only what is not under review or published can be deleted
  const KINDS = [['all', 'الكل'], ['draw', 'رسوماتي'], ['color', 'تلويني'], ['ai-story', 'قصصي'], ['ai-video', 'فيديوهاتي'], ['hero', 'أنت بطل القصة']];
  const KIND_N = { draw: 'رسمة', color: 'تلوين', 'ai-story': 'قصة مصورة', 'ai-video': 'فيديو', hero: 'أنت بطل القصة' };
  let kind = 'all';
  const open = (w) => w.href || (w.kind === 'color' ? `color.html?pic=${w.pic}` : '');
  function works() {
    $('chips').innerHTML = KINDS.map(([k, n]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k === kind}">${n}</button>`).join('');
    const list = Valley.works.read().filter((w) => KIND_N[w.kind] && (kind === 'all' || w.kind === kind));
    $('works').innerHTML = list.length ? list.map((w) => `<button class="work card" type="button" data-w="${w.id}" aria-label="${w.name}، ${KIND_N[w.kind]}، ${Valley.STATES[w.state]}">
        <span class="pic"><img src="${w.img}" alt=""></span>
        <b>${w.name}</b><span class="tags"><i>${KIND_N[w.kind]}</i><i class="${w.state}">${Valley.STATES[w.state]}</i></span></button>`).join('')
      : `<p class="empty">لا يوجد شيء هنا بعد. ارسم في <a href="colors.html">وادي الألوان</a>، أو اصنع قصة في <a href="workshop.html">ورشة السحر</a>.</p>`;
    Hub.fit();
  }
  $('chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) { kind = c.dataset.k; works(); } });

  // ---- one work's details: open it, send it for publishing, or delete it (a notification about a work opens here: ?w=id)
  // colorings are only kept, and «أنت بطل القصة» copies are not published (Q-105)
  const SENDABLE = ['draw', 'ai-story', 'ai-video'];
  const SAYS = { private: 'خاصة بك، لا يراها أحد غيرك.', review: 'أرسلتها للنشر، وسيراجعها فريق أجيال، ونخبرك بالنتيجة.', published: 'منشورة، يراها أطفال أجيال. المنشور يبقى في المنصة.', rejected: 'لم تُعتمد للنشر، وتبقى خاصة بك.' };
  let cur = null;
  function detail(id) {
    cur = Valley.works.read().find((w) => w.id === id); if (!cur) return;
    const href = open(cur), send = cur.state === 'private' && SENDABLE.includes(cur.kind), del = cur.state === 'private' || cur.state === 'rejected';
    $('work-t').textContent = cur.name;
    $('work-b').innerHTML = `<img class="big" src="${cur.img}" alt="">
      <span class="tags"><i>${KIND_N[cur.kind]}</i><i class="${cur.state}">${Valley.STATES[cur.state]}</i></span>
      <p>${cur.kind === 'color' ? 'أعمال التلوين تُحفظ لك فقط.' : SAYS[cur.state]}</p>
      <div class="dbtns">${href ? `<a class="btn go" href="${href}">افتح</a>` : ''}${send ? '<button class="btn go" type="button" id="w-send">أرسلها للنشر</button>' : ''}${del ? '<button class="btn warn" type="button" id="w-del">احذف</button>' : ''}<button class="btn soft" type="button" id="w-close">إغلاق</button></div>`;
    if (!$('work').open) $('work').showModal();
  }
  $('works').addEventListener('click', (e) => { const w = e.target.closest('[data-w]'); if (w) detail(w.dataset.w); });
  $('work').addEventListener('click', (e) => {
    if (e.target.closest('#w-close')) return $('work').close();
    if (e.target.closest('#w-send')) { cur.state = 'review'; Valley.works.save(cur); Hub.toast('أرسلناها إلى فريق أجيال لتُراجَع'); works(); return detail(cur.id); }
    if (e.target.closest('#w-del')) {
      $('ask-t').textContent = `هل تريد حذف «${cur.name}»؟`;
      $('ask-p').textContent = 'إذا حذفتها فلن تعود إلى «إبداعاتي».';
      $('ask').showModal(); $('ask-no').focus();
    }
  });
  // delete only after asking, and say it cannot be undone
  $('ask-no').addEventListener('click', () => $('ask').close());
  $('ask-ok').addEventListener('click', () => {
    try { localStorage.setItem('ajyal.works', JSON.stringify(Valley.works.read().filter((w) => w.id !== cur.id))); } catch {}
    if (cur.kind === 'hero') { try { localStorage.removeItem('ajyal.hero.honest'); } catch {} }
    $('ask').close(); $('work').close(); Hub.toast('حُذفت'); works();
  });

  // a drawing from the device is kept private, like a drawing made here
  $('file').addEventListener('change', (e) => {
    const f = e.target.files?.[0]; e.target.value = ''; if (!f) return;
    if (!/^image\/(png|jpeg)$/.test(f.type)) return Hub.toast('اختر صورة بصيغة JPG أو PNG');
    const img = new Image();
    img.onload = () => {
      const s = 600, k = Math.min(1, s / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      const ok = Valley.works.save({ id: `upload-${Date.now()}`, kind: 'draw', name: 'رسمة من جهازي', img: c.toDataURL('image/jpeg', .85), state: 'private', at: Date.now() });
      if (!ok) return Hub.toast('لم نستطع الحفظ على هذا الجهاز');
      kind = 'all'; Sfx.play('win'); Hub.toast('حُفظت في إبداعاتي، خاصة بك'); works();
    };
    img.onerror = () => Hub.toast('لم نستطع فتح هذه الصورة');
    img.src = URL.createObjectURL(f);
  });

  // ---- change the name and the picture (nothing else)
  let face = me.avatar;
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#edit-open')) return;
    face = me.avatar; $('name').value = me.name; $('name-err').textContent = '';
    $('faces').innerHTML = AVATARS.map((a) => `<button type="button" data-a="${a}" aria-pressed="${a === face}" aria-label="صورة ${ar(AVATARS.indexOf(a) + 1)}"><img src="img/avatars/${a}.png" alt=""></button>`).join('');
    $('edit').showModal(); $('name').focus();
  });
  $('faces').addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    face = b.dataset.a; $('faces').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('edit-no').addEventListener('click', () => $('edit').close());
  $('edit-ok').addEventListener('click', () => {
    const v = $('name').value.trim();
    if (!/^[ء-ْa-zA-Z ]{2,12}$/.test(v)) { $('name-err').textContent = 'اكتب اسماً من حرفين إلى ١٢ حرفاً، بالحروف فقط'; return $('name').focus(); }
    me = { ...me, name: v, avatar: face };
    if (!Profile.save(me)) return Hub.toast('لم نستطع الحفظ على هذا الجهاز');
    $('edit').close(); card(); Hub.toast('حُفظ اسمك وصورتك');
  });

  // ---- tabs: the hash opens one directly (#works from the valley)
  function tab(v, focus) {
    ['me', 'progress', 'works'].forEach((x) => { $(`t-${x}`).setAttribute('aria-selected', String(x === v)); $(`t-${x}`).tabIndex = x === v ? 0 : -1; $(`p-${x}`).hidden = x !== v; });
    if (focus) $(`t-${v}`).focus();
    // inside the map's panel the hash stays out of the address, or the browser would scroll the map to it
    if (!Hub.embed) history.replaceState(null, '', `#${v}`);
    Hub.fit();
  }
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('[role=tab]'); if (b) tab(b.dataset.v); });
  $('tabs').addEventListener('keydown', (e) => {
    const order = ['me', 'progress', 'works'], at = order.indexOf(document.activeElement.dataset.v);
    if (at < 0) return;
    if (e.key === 'ArrowLeft') tab(order[(at + 1) % 3], true);
    if (e.key === 'ArrowRight') tab(order[(at + 2) % 3], true);
  });

  card(); mine(); progress(); works();
  // the tab comes from the hash, or from ?tab= inside the map's panel (a hash there would scroll the map behind it)
  const fromHash = () => { const t = location.hash.slice(1) || new URLSearchParams(location.search).get('tab'); tab(['me', 'progress', 'works'].includes(t) ? t : 'me'); };
  fromHash(); addEventListener('hashchange', fromHash);
  const wanted = new URLSearchParams(location.search).get('w');
  if (wanted) { tab('works'); detail(wanted); }
  addEventListener('load', Hub.fit);
  addEventListener('pageshow', (e) => { if (e.persisted) { me = Profile.read(); card(); works(); } });
})();
</script>
</body>
</html>
