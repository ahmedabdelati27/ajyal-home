<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المتصدرون · أجيال الصالحية</title>
<link rel="stylesheet" href="clouds.css">
<link rel="stylesheet" href="hub.css">
<script src="clouds.js"></script>
<script src="sfx.js"></script>
<script>Sfx.taps();</script>
<style>
.hero { --hero: url(img/room/leaders-hero.jpg); background-position: center 55%; }
:root { --accent-deep: #C24A3C; }

/* the first three on their steps */
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 20px; align-items: end; }
.top { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 16px 20px; text-align: center; }
.top .face { position: relative; }
.top .face img { width: 110px; height: 110px; border-radius: 50%; border: 6px solid var(--m); }
.top .face span { position: absolute; bottom: -6px; left: 50%; translate: -50% 0; width: 42px; height: 42px; border-radius: 50%; background: var(--m); color: #FFFFFF; display: grid; place-items: center; font-size: 22px; font-weight: 800; border: 3px solid #FFFFFF; }
.top.first .face img { width: 140px; height: 140px; }
.top b { margin-top: 6px; font-size: 26px; font-weight: 800; }
.xp { display: inline-flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 800; color: var(--ink-soft); }
.xp img { width: 28px; height: 28px; }
.top .bdg { width: 48px; height: 48px; }
.top.first { order: 2; padding-top: 34px; }
.top.second { order: 1; } .top.third { order: 3; }
.top.first::before { content: '👑'; font-size: 40px; margin: -20px 0 -6px; }

/* everyone else in one list; the child's own row is lit */
.list { margin: 0; padding: 8px; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.list li { display: grid; grid-template-columns: 56px 64px 1fr auto 44px; gap: 14px; align-items: center; padding: 10px 16px; border-radius: 22px; }
.list li:nth-child(odd):not(.me) { background: #FFF8EF; }
.list .n { font-size: 22px; font-weight: 800; color: var(--ink-soft); text-align: center; }
.list .av { width: 64px; height: 64px; border-radius: 50%; }
.list b { font-size: 22px; font-weight: 800; }
.list .bdg { width: 44px; height: 44px; }
.list li.me { background: linear-gradient(#FFE7C7, #FFD29A); box-shadow: 0 0 0 3px #F4A35C; }
.list li.me b::after { content: ' (أنت)'; font-size: 17px; color: var(--accent-deep); }
.list li.gap { display: block; padding: 0; text-align: center; font-size: 26px; font-weight: 800; color: var(--ink-soft); letter-spacing: 6px; }

.narrow .podium { gap: 10px; }
.narrow .top { padding: 16px 8px; } .narrow .top .face img { width: 96px; height: 96px; } .narrow .top.first .face img { width: 116px; height: 116px; }
.narrow .top b { font-size: 22px; } .narrow .xp { font-size: 17px; }
.narrow .list li { grid-template-columns: 44px 56px 1fr auto; } .narrow .list .bdg { display: none; } .narrow .list .av { width: 56px; height: 56px; }
</style>
<link rel="stylesheet" href="dock.css">
</head>
<body>
<div id="wrap"><div id="page">
<header class="hero">
  <div class="bar">
    <a class="pill back" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>العودة إلى الخريطة</span></a>
    <div class="stats">
      <span class="pill" title="الوقت المتبقي اليوم" style="color:#2D6A12"><img src="img/forest/I-10.png" alt="">35 د</span>
      <span class="pill" title="ترتيبك"><img src="img/I-04.png" alt="">ترتيبك ١٢</span>
    </div>
  </div>
  <div class="head">
    <h1>المتصدرون</h1>
    <p>الترتيب حسب مجموع النقاط</p>
  </div>
</header>

<main>
  <div class="podium" id="podium"></div>
  <p class="note" style="margin:0">ترتيب واحد لكل أطفال أجيال. تزيد نقاطك عندما تُكمل نشاطاً، أو تشارك في مسابقة، أو يُعتمد إبداعك للنشر.</p>
  <ol class="list card" id="list"></ol>
</main>
</div></div>

<nav class="dock" aria-label="التنقل السريع">
  <a href="index.html" aria-label="الخريطة"><img src="img/nav/map.png" alt=""><span>الخريطة</span></a>
  <a href="index.html?open=sections" aria-label="كل الأقسام"><img src="img/nav/sections.png" alt=""><span>كل الأقسام</span></a>
  <a href="index.html?open=room" aria-label="غرفتي"><img src="img/nav/room.png" alt=""><span>غرفتي</span></a>
  <a href="index.html?open=leaders" aria-current="page" aria-label="المتصدرون، ترتيبك 12"><img src="img/nav/leaders.png" alt=""><span>المتصدرون</span><span class="rank">12</span></a>
</nav>

<script src="profile.js"></script>
<script src="hub.js"></script>
<script>
(() => {
  const { ar, num, LEADERS, ME_RANK, BADGES } = Profile;
  const me = Profile.read();
  const badge = (id) => BADGES.find((b) => b.id === id)?.n || '';
  // only what suits children: the display name, the picture, the points and a badge
  const MEDAL = ['#F2A900', '#A7B1BD', '#D0874A'];
  const top = (p, i) => `<div class="top card ${['first', 'second', 'third'][i]}" style="--m:${MEDAL[i]}">
    <span class="face"><img src="img/avatars/${p.avatar}.png" alt=""><span aria-label="المركز ${ar(p.rank)}">${ar(p.rank)}</span></span>
    <b>${p.name}</b><span class="xp"><img src="img/hud/points.png" alt="">${num(p.xp)}</span>
    <img class="bdg" src="img/badges/${p.badge}.png" alt="شارة ${badge(p.badge)}"></div>`;
  // read in order 1, 2, 3; shown right to left as second, first, third
  const mine = { rank: ME_RANK, name: me.name, avatar: me.avatar, xp: me.xp, badge: 'S-06' };
  document.getElementById('podium').innerHTML = LEADERS.slice(0, 3).map((p, i) => top(p.rank === ME_RANK ? mine : p, i)).join('');
  const row = (p, mine) => `<li class="${mine ? 'me' : ''}" ${mine ? 'aria-current="true"' : ''}><span class="n">${ar(p.rank)}</span><img class="av" src="img/avatars/${p.avatar}.png" alt="">
    <b>${p.name}</b><span class="xp"><img src="img/hud/points.png" alt="">${num(p.xp)}</span>${p.badge ? `<img class="bdg" src="img/badges/${p.badge}.png" alt="شارة ${badge(p.badge)}">` : '<span></span>'}</li>`;
  // the top ten, then the child's own place with the one just above when it is further down; a child in the top ten is lit in place
  const top10 = LEADERS.slice(3, 10).map((p) => (p.rank === ME_RANK ? row(mine, true) : row(p))).join('');
  const below = ME_RANK > 10 ? `${ME_RANK > 11 ? '<li class="gap" aria-hidden="true">…</li>' : ''}${LEADERS[ME_RANK - 2] && ME_RANK > 11 ? row(LEADERS[ME_RANK - 2]) : ''}${row(mine, true)}` : '';
  document.getElementById('list').innerHTML = top10 + below;
  Hub.fit();
  addEventListener('load', Hub.fit);
})();
</script>
</body>
</html>
