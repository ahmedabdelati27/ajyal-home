<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كثبان الألعاب · أجيال الصالحية</title>
<style>
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Bold.woff2) format('woff2'); font-weight: 600 900; font-display: swap; }
:root { --ink: #3A2318; --ink-soft: #6B5A48; --paper: #FFFFFF; --sand: #FFF1E2; --go: #2E8B2A; --go-deep: #1F6A1C; --rust: #E2762E; --rust-deep: #A8481A; --line: #6B3A1E; --leaf: #5BC236; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Thmanyah Sans', system-ui, sans-serif; color: var(--ink); background: var(--sand); font-weight: 500; }
img { display: block; max-width: none; }
button { font: inherit; color: inherit; cursor: pointer; }

/* drawn at 1440 wide like the forest board, then scaled to the window */
#wrap { position: relative; width: 100%; overflow: hidden; }
#page { position: absolute; top: 0; left: 0; width: 1440px; transform-origin: top left; }

/* hero: the dunes at sunset, fading into the sand */
.hero { position: relative; height: 500px; background: url(img/games/dunes-hero.jpg) center 65% / cover; }
.hero::after { content: ''; position: absolute; inset: auto 0 0 0; height: 150px; background: linear-gradient(rgba(255,241,226,0), var(--sand) 92%); pointer-events: none; }
.bar { position: absolute; z-index: 3; top: 20px; left: 32px; right: 32px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 46px; padding: 0 14px; border-radius: 999px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #EBC9A5; white-space: nowrap; }
.pill img { width: 30px; height: 30px; margin: -4px 0; }
.stats { display: flex; gap: 10px; }
.isle { position: absolute; z-index: 2; left: 70px; top: 54px; width: 380px; animation: float 4.5s ease-in-out infinite; }
@keyframes float { 50% { translate: 0 -8px; } }
.say { position: absolute; z-index: 3; left: 420px; top: 96px; max-width: 250px; margin: 0; background: var(--paper); border-radius: 26px; padding: 14px 20px 16px; font-weight: 800; font-size: 20px; line-height: 1.35; box-shadow: 0 5px 0 var(--rust); }
.say::before { content: ''; position: absolute; left: -16px; bottom: 18px; border: 12px solid transparent; border-right-color: var(--paper); border-left: 0; }
.head { position: absolute; z-index: 3; right: 80px; top: 120px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.head h1 { margin: 0; font-size: 78px; font-weight: 800; line-height: 1; color: var(--paper); text-shadow: 0 5px 0 var(--rust-deep), 3px 0 0 var(--rust-deep), -3px 0 0 var(--rust-deep), 0 -3px 0 var(--rust-deep), 3px 3px 0 var(--rust-deep), -3px 3px 0 var(--rust-deep), 3px -3px 0 var(--rust-deep), -3px -3px 0 var(--rust-deep); }
.head p { margin: 0; font-size: 22px; font-weight: 800; background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px 18px; }

main { position: relative; z-index: 2; margin: -30px 0 0; padding: 0 80px 150px; display: flex; flex-direction: column; gap: 30px; }
.meter { width: 220px; height: 12px; border-radius: 999px; background: #F2E1CC; overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--p); border-radius: 999px; background: var(--leaf); }

/* continue playing */
.cont { display: flex; align-items: center; gap: 22px; background: var(--paper); border-radius: 32px; padding: 16px 16px 16px 24px; box-shadow: 0 6px 0 #EED3B4; }
.cont .art { width: 196px; height: 112px; border-radius: 22px; overflow: hidden; flex-shrink: 0; }
.cont .art img { width: 100%; height: 100%; object-fit: cover; }
.cont .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cont h2 { margin: 0; font-size: 16px; font-weight: 800; color: var(--rust-deep); }
.cont b { font-size: 30px; font-weight: 800; line-height: 1.15; }
.cont small { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; color: var(--ink-soft); }
.go { display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 30px; border-radius: 999px; background: var(--go); color: var(--paper); text-decoration: none; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 var(--go-deep); flex-shrink: 0; }

/* worlds: the admin's themes, only a way to group the games */
h2.sec { margin: 0 0 14px; font-size: 30px; font-weight: 800; }
.worlds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.world { position: relative; padding: 0; border: 0; border-radius: 28px; overflow: hidden; background: var(--paper); text-align: start; box-shadow: 0 6px 0 #EED3B4; transition: transform .2s; }
.world:hover { transform: translateY(-4px); }
.world[aria-pressed="true"] { box-shadow: 0 0 0 5px #F7B347, 0 6px 0 #C98A1E; }
.world img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.world span { display: flex; flex-direction: column; gap: 4px; padding: 10px 16px 14px; }
.world b { font-size: 24px; font-weight: 800; }
.world small { font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.world .meter { width: 100%; height: 8px; margin-top: 4px; }

/* the games of the chosen world */
.games { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.game { position: relative; display: flex; flex-direction: column; background: var(--paper); border-radius: 26px; overflow: hidden; text-decoration: none; color: var(--ink); box-shadow: 0 6px 0 #EED3B4; transition: transform .2s; }
.game:hover { transform: translateY(-5px) rotate(-1deg); }
.game .cov { position: relative; aspect-ratio: 16 / 9; }
.game .cov img { width: 100%; height: 100%; object-fit: cover; }
.play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 4px solid var(--line); border-radius: 50%; background: linear-gradient(#FFD98C, #F7B347 55%, #EE9C2E); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), 0 4px 0 var(--line); display: flex; align-items: center; justify-content: center; }
.play svg { width: 28px; height: 28px; }
.tag { position: absolute; top: 10px; left: 10px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 800; display: flex; align-items: center; }
.tag.ok { background: #4CB944; color: var(--paper); border: 2px solid var(--paper); }
.tag.new { background: var(--paper); color: #D0335A; }
.tag.on { background: #FFF1C9; color: #8A5A00; }
.game .body { display: flex; flex-direction: column; gap: 3px; padding: 10px 14px 14px; }
.game b { font-size: 20px; font-weight: 800; }
.game small { font-size: 15px; font-weight: 700; color: var(--ink-soft); }

.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(58,35,24,.9); color: var(--paper); border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 16px; z-index: 40; opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; }

/* dock: the same game bar as the map */
.dock { position: fixed; z-index: 10; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border: 4px solid var(--line); border-radius: 999px;
  background: linear-gradient(#FFD98C, #F7B347 55%, #EE9C2E); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(166,84,20,.35), 0 5px 0 var(--line), 0 12px 20px rgba(58,35,24,.25); }
.dock a { display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 18px; border: 3px solid transparent; border-radius: 999px; color: #4A2612; text-decoration: none; font-weight: 800; font-size: 17px; white-space: nowrap; }
.dock a:hover { background: rgba(255,255,255,.25); }
.dock a img { width: 36px; height: 36px; margin: -6px 0; flex-shrink: 0; }
.rank { background: #FFF6E6; color: #C9372C; border: 2px solid var(--line); border-radius: 999px; padding: 0 9px; height: 26px; display: flex; align-items: center; font-size: 15px; }
@media (max-width: 760px) { .dock a span { display: none; } .dock a { padding: 0 14px; } }
@media (prefers-reduced-motion: reduce) { .isle { animation: none; } .world, .game { transition: none; } }
</style>
</head>
<body>
<div id="wrap"><div id="page">
<header class="hero">
  <div class="bar">
    <a class="pill back" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>العودة إلى الخريطة</span></a>
    <div class="stats">
      <span class="pill" title="الوقت المتبقي اليوم" style="color:#2D6A12"><img src="img/forest/I-10.png" alt="">35 د</span>
      <span class="pill" title="النقاط"><img src="img/forest/I-06.png" alt="">3,240</span>
      <span class="pill" title="أيام متتالية"><img src="img/forest/I-07.png" alt="">5</span>
      <span class="pill" title="الشارات"><img src="img/forest/S-01.png" alt="">12</span>
    </div>
  </div>
  <img class="isle" src="img/games.png" alt="الثعلب فنّوش في كثبان الألعاب">
  <p class="say">أهلاً يا يوسف! أي لعبة نلعب اليوم؟</p>
  <div class="head">
    <h1>كثبان الألعاب</h1>
    <p>العب وتعلّم مع الثعلب فنّوش</p>
  </div>
</header>

<main>
  <section class="cont" aria-labelledby="cont-t">
    <div class="art" aria-hidden="true"><img src="img/games/g-01.jpg" alt=""></div>
    <div class="txt">
      <h2 id="cont-t">أكمل من حيث توقفت</h2>
      <b>نظّف البحر</b>
      <small>المرحلة ٢ من ٢: رتّب المخلفات <span class="meter" style="--p:50%"><i></i></span></small>
    </div>
    <a class="go" href="game.html?resume=1">أكمل اللعب <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14L6 12z" fill="#FFFFFF"/></svg></a>
  </section>

  <section aria-labelledby="w-t">
    <h2 class="sec" id="w-t">العوالم</h2>
    <div class="worlds" id="worlds" role="group" aria-label="اختر عالماً"></div>
  </section>

  <section aria-labelledby="g-t">
    <h2 class="sec" id="g-t"></h2>
    <div class="games" id="games"></div>
  </section>
</main>
</div></div>

<nav class="dock" aria-label="التنقل السريع">
  <a href="index.html"><img src="img/I-01.png" alt=""><span>الخريطة</span></a>
  <a href="#"><img src="img/I-02.png" alt=""><span>كل الأقسام</span></a>
  <a href="#"><img src="img/I-03.png" alt=""><span>غرفتي</span></a>
  <a href="#" aria-label="المتصدرون، ترتيبك 12"><img src="img/I-04.png" alt=""><span>المتصدرون</span><span class="rank">12</span></a>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // worlds and games come from the admin (name, cover, short description, order); state is the child's: 'ok' done, 'new', or '1/2' stage reached
  const g = (name, cover, how, state = '', href = '#') => ({ name, cover, how, state, href });
  const WORLDS = [
    { id: 'env', name: 'البيئة', about: 'نحافظ على الطبيعة نظيفة وجميلة', cover: 'w-01', games: [
      g('نظّف البحر', 'g-01', 'اجمع المخلفات ورتّبها في الحاويات', '2/2', 'game.html?resume=1'),
      g('نظّف الحديقة', 'g-02', 'التقط المخلفات من العشب', 'ok'),
      g('ازرع نبتة', 'g-03', 'ازرع البذرة واسقها حتى تكبر', 'new')] },
    { id: 'care', name: 'المسؤولية', about: 'نهتم بأشيائنا وبمن حولنا', cover: 'w-02', games: [
      g('أطعم الحيوانات', 'g-04', 'أعطِ كل حيوان طعامه المناسب'),
      g('رتّب الغرفة', 'g-05', 'ضع كل لعبة في صندوقها')] },
    { id: 'home', name: 'الوطن', about: 'نتعرّف على تراث وطننا الجميل', cover: 'w-03', games: [
      g('رحلة في وطني', 'g-06', 'اجمع رموز التراث في المشهد', 'new')] },
    { id: 'craft', name: 'الإتقان', about: 'نتقن عملنا خطوة بخطوة', cover: 'w-04', games: [
      g('أكمل الصورة', 'g-07', 'ضع كل قطعة في مكانها الصحيح', 'ok'),
      g('ابنِ البيت', 'g-08', 'رتّب المكعبات لتبني بيتاً')] }
  ];
  const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
  let at = 'env';

  function render() {
    $('worlds').innerHTML = WORLDS.map((w) => {
      const done = w.games.filter((x) => x.state === 'ok').length;
      return `<button class="world" type="button" data-id="${w.id}" aria-pressed="${w.id === at}"><img src="img/games/${w.cover}.jpg" alt="">
        <span><b>${w.name}</b><small>${w.about}</small><small>أكملت ${ar(done)} من ${ar(w.games.length)} ${w.games.length > 2 ? 'ألعاب' : w.games.length === 2 ? '' : 'لعبة'}</small><span class="meter" style="--p:${(done / w.games.length) * 100}%"><i></i></span></span></button>`;
    }).join('');
    const w = WORLDS.find((x) => x.id === at);
    $('g-t').textContent = `ألعاب عالم ${w.name}`;
    $('games').innerHTML = w.games.map((x) => {
      const tag = x.state === 'ok' ? '<span class="tag ok">✓ مكتملة</span>' : x.state === 'new' ? '<span class="tag new">جديدة</span>' : x.state ? `<span class="tag on">المرحلة ${ar(x.state.split('/')[0])} من ${ar(x.state.split('/')[1])}</span>` : '';
      return `<a class="game" href="${x.href}" aria-label="${x.name}، ${x.how}"><span class="cov"><img src="img/games/${x.cover}.jpg" alt="">${tag}
        <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.8l-10-6.5A1 1 0 0 0 8 5.5z" fill="#6B3A1E"/></svg></span></span>
        <span class="body"><b>${x.name}</b><small>${x.how}</small></span></a>`;
    }).join('');
    fit();
  }
  $('worlds').addEventListener('click', (e) => { const b = e.target.closest('.world'); if (b) { at = b.dataset.id; render(); } });

  const toast = (s) => { const el = $('toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2400); };
  $('games').addEventListener('click', (e) => {
    const t = e.target.closest('.game'); if (!t || t.getAttribute('href') !== '#') return;
    e.preventDefault(); toast('في النموذج: جرّب لعبة «نظّف البحر» في عالم البيئة');
  });

  // the board is drawn at 1440 wide; scale it to the window like the forest
  const page = $('page'), wrap = $('wrap');
  function fit() {
    const k = Math.min(innerWidth / 1440, 1.5);
    const x = Math.max(0, (innerWidth - 1440 * k) / 2);
    page.style.transform = 'translateX(' + x + 'px) scale(' + k + ')';
    wrap.style.height = page.offsetHeight * k + 'px';
  }
  addEventListener('resize', fit);
  render();
})();
</script>
</body>
</html>
