<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حديقة القيم · أجيال الصالحية</title>
<link rel="stylesheet" href="clouds.css">
<script src="clouds.js"></script>
<script src="sfx.js"></script>
<script>Sfx.taps();</script>
<style>
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Medium.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Thmanyah Sans'; src: url(fonts/thmanyahsans-Bold.woff2) format('woff2'); font-weight: 600 900; font-display: swap; }
:root { --ink: #3A2318; --ink-soft: #6B5A48; --paper: #FFFFFF; --sand: #F1F8E8; --go: #2E8B2A; --go-deep: #1F6A1C; --leaf: #5BC236; --leaf-deep: #2F7A23; --sun: #F7B347; --line: #6B3A1E; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Thmanyah Sans', system-ui, sans-serif; color: var(--ink); background: var(--sand); font-weight: 500; }
img { display: block; max-width: none; }
button { font: inherit; color: inherit; cursor: pointer; }

/* drawn at 1440 wide like the forest board, then scaled to the window */
#wrap { position: relative; width: 100%; overflow: hidden; }
#page { position: absolute; top: 0; left: 0; width: 1440px; transform-origin: top left; }

/* hero: the garden at morning, fading into soft green */
.hero { position: relative; height: 480px; background: url(img/garden/garden-scene.jpg) center 30% / cover; }
.hero::after { content: ''; position: absolute; inset: auto 0 0 0; height: 160px; background: linear-gradient(rgba(241,248,232,0), var(--sand) 92%); pointer-events: none; }
.bar { position: absolute; z-index: 3; top: 20px; left: 32px; right: 32px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 46px; padding: 0 14px; border-radius: 999px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #CFE3BC; white-space: nowrap; }
.pill img { width: 30px; height: 30px; margin: -4px 0; }
.stats { display: flex; gap: 10px; }
.isle { position: absolute; z-index: 2; left: 70px; top: 54px; width: 380px; animation: float 4.5s ease-in-out infinite; }
@keyframes float { 50% { translate: 0 -8px; } }
.say { position: absolute; z-index: 3; left: 420px; top: 96px; max-width: 270px; margin: 0; background: var(--paper); border-radius: 26px; padding: 14px 20px 16px; font-weight: 800; font-size: 20px; line-height: 1.35; box-shadow: 0 5px 0 var(--sun); }
.say::before { content: ''; position: absolute; left: -16px; bottom: 18px; border: 12px solid transparent; border-right-color: var(--paper); border-left: 0; }
.head { position: absolute; z-index: 3; right: 80px; top: 116px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.head h1 { margin: 0; font-size: 78px; font-weight: 800; line-height: 1; color: var(--paper); text-shadow: 0 5px 0 var(--leaf-deep), 3px 0 0 var(--leaf-deep), -3px 0 0 var(--leaf-deep), 0 -3px 0 var(--leaf-deep), 3px 3px 0 var(--leaf-deep), -3px 3px 0 var(--leaf-deep), 3px -3px 0 var(--leaf-deep), -3px -3px 0 var(--leaf-deep); }
.head p { margin: 0; font-size: 22px; font-weight: 800; background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px 18px; }

main { position: relative; z-index: 2; margin: -40px 0 0; padding: 0 80px 150px; display: flex; flex-direction: column; gap: 30px; }
.meter { width: 220px; height: 12px; border-radius: 999px; background: #E3EFD6; overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--p); border-radius: 999px; background: var(--leaf); }

/* the journey the child is on */
.cont { display: flex; align-items: center; gap: 22px; background: var(--paper); border-radius: 32px; padding: 16px 16px 16px 24px; box-shadow: 0 6px 0 #D3E6C1; }
.cont[hidden] { display: none; }
.cont .art { width: 196px; height: 112px; border-radius: 22px; overflow: hidden; flex-shrink: 0; }
.cont .art img { width: 100%; height: 100%; object-fit: cover; }
.cont .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cont h2 { margin: 0; font-size: 16px; font-weight: 800; color: var(--leaf-deep); }
.cont b { font-size: 30px; font-weight: 800; line-height: 1.15; }
.cont small { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; color: var(--ink-soft); }
.go { display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 30px; border-radius: 999px; background: var(--go); color: var(--paper); text-decoration: none; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 var(--go-deep); flex-shrink: 0; }

/* garden or list */
.view { align-self: flex-start; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--paper); box-shadow: 0 4px 0 #D3E6C1; }
.view button { height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: none; font-size: 18px; font-weight: 800; }
.view button[aria-pressed="true"] { background: #E8F5DC; color: var(--leaf-deep); }
.small .view button { height: 80px; font-size: 32px; padding: 0 30px; }
.garden[hidden], .vlist[hidden] { display: none; }
.vlist { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.small .vlist { grid-template-columns: repeat(2, 1fr); }
.vcard { display: flex; flex-direction: column; gap: 6px; padding-bottom: 14px; border-radius: 26px; overflow: hidden; background: var(--paper); color: var(--ink); text-decoration: none; box-shadow: 0 6px 0 #D3E6C1; border-top: 8px solid var(--c); }
.vcard img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.vcard b { padding: 4px 14px 0; font-size: 22px; font-weight: 800; }
.vcard small { padding: 0 14px; font-size: 15px; font-weight: 800; color: var(--ink-soft); }
.small .vcard b { font-size: 40px; } .small .vcard small { font-size: 28px; }
/* the garden: one bed for each value, its plant grows with the journey */
.garden { position: relative; height: 760px; border: 8px solid var(--paper); border-radius: 40px; overflow: hidden; background: url(img/garden/garden-scene.jpg) center / cover; box-shadow: 0 8px 0 #D3E6C1, 0 20px 40px rgba(40,80,20,.15); }
.g-head { position: absolute; z-index: 5; top: 20px; right: 20px; display: flex; align-items: center; gap: 16px; padding: 10px 22px; border-radius: 24px; background: rgba(255,255,255,.93); box-shadow: 0 4px 0 rgba(40,80,20,.15); transform: scale(var(--kh, 1)); transform-origin: top right; }
.g-head b { font-size: 30px; font-weight: 800; }
.g-head small { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--ink-soft); }
.g-head .meter { width: 120px; height: 10px; }
.g-hint { position: absolute; z-index: 5; top: 20px; left: 20px; height: 50px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,.93); display: flex; align-items: center; font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 rgba(40,80,20,.15); }
.small .g-hint { display: none; }
.bed { position: absolute; z-index: 3; left: var(--x); top: var(--y); width: 0; height: 0; text-decoration: none; color: var(--ink); }
.bed .plant { position: absolute; left: 0; bottom: -18px; width: calc(var(--w) * var(--kp, 1)); translate: -50% 0; transform-origin: 50% 100%; filter: drop-shadow(0 6px 6px rgba(40,60,10,.25)); transition: transform .2s; }
.bed:hover .plant, .bed:focus-visible .plant { transform: scale(1.06) rotate(-2deg); }
.bed .plant.sway { animation: sway 4s ease-in-out infinite; }
@keyframes sway { 50% { rotate: 2deg; } }
.bed .plant.grow { animation: grow 1.4s cubic-bezier(.3, 1.4, .6, 1) .4s both; }
@keyframes grow { from { scale: .2; opacity: 0; } }
.sign { position: absolute; left: 0; top: 34px; translate: -50% 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 16px 8px; border-radius: 18px; background: var(--paper); border-top: 6px solid var(--c); white-space: nowrap; box-shadow: 0 4px 0 rgba(40,60,10,.2); transform: scale(var(--ks, 1)); transform-origin: top center; }
.sign b { font-size: 22px; font-weight: 800; }
.sign small { font-size: 15px; font-weight: 800; color: var(--ink-soft); }
.sign small.ok { color: var(--leaf-deep); }
.bed.now .sign { box-shadow: 0 0 0 4px var(--sun), 0 4px 0 rgba(40,60,10,.2); }
/* Nour waits by the plant the child is growing now */
.nour { position: absolute; z-index: 4; width: 110px; pointer-events: none; translate: -50% -100%; animation: hover 3s ease-in-out infinite; }
@keyframes hover { 50% { translate: -50% calc(-100% - 10px); } }

.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(58,35,24,.9); color: var(--paper); border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 16px; z-index: 40; opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; }

/* dock: the same game bar as the map */
.dock { position: fixed; z-index: 10; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border: 4px solid var(--line); border-radius: 999px;
  background: linear-gradient(#FFD98C, #F7B347 55%, #EE9C2E); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(166,84,20,.35), 0 5px 0 var(--line), 0 12px 20px rgba(58,35,24,.25); }
.dock a { display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 18px; border: 3px solid transparent; border-radius: 999px; color: #4A2612; text-decoration: none; font-weight: 800; font-size: 17px; white-space: nowrap; }
.dock a:hover { background: rgba(255,255,255,.25); }
.dock a img { width: 36px; height: 36px; margin: -6px 0; flex-shrink: 0; }
.rank { background: #FFF6E6; color: #C9372C; border: 2px solid var(--line); border-radius: 999px; padding: 0 9px; height: 26px; display: flex; align-items: center; font-size: 15px; }
@media (max-width: 760px) { .dock a span { display: none; } .dock a { padding: 0 14px; } }
@media (prefers-reduced-motion: reduce) { .isle, .nour, .bed .plant.sway, .bed .plant.grow { animation: none; } .bed .plant { transition: none; } }
</style>
<link rel="stylesheet" href="dock.css">
</head>
<body>
<div id="wrap"><div id="page">
<header class="hero">
  <div class="bar">
    <a class="pill back" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>العودة إلى الخريطة</span></a>
    <div class="stats">
      <span class="pill" title="الوقت المتبقي اليوم" style="color:#2D6A12"><img src="img/hud/clock.png" alt="">35 د</span>
      <span class="pill" title="النقاط"><img src="img/hud/points.png" alt="">3,240</span>
      <span class="pill" title="أيام متتالية"><img src="img/hud/streak.png" alt="">5</span>
      <span class="pill" title="الشارات"><img src="img/hud/badge.png" alt="">6</span>
    </div>
  </div>
  <img class="isle" src="img/garden.png" alt="نور في حديقة القيم">
  <p class="say" id="say">أهلاً يا يوسف! أنا نور. كل قيمة نتعلمها تزرع شجرة في حديقتك</p>
  <div class="head">
    <h1>حديقة القيم</h1>
    <p>ازرع القيم الجميلة مع نور</p>
  </div>
</header>

<main>
  <section class="cont" aria-labelledby="cont-t" id="cont" hidden></section>
  <div class="view" role="group" aria-label="طريقة العرض"><button type="button" data-v="garden" aria-pressed="true">🌳 الحديقة</button><button type="button" data-v="list" aria-pressed="false">☰ قائمة</button></div>
  <section class="garden" id="garden" aria-label="حديقتك"></section>
  <section class="vlist" id="vlist" hidden></section>
</main>
</div></div>

<nav class="dock" aria-label="التنقل السريع">
  <a href="index.html" aria-label="الخريطة"><img src="img/nav/map.png" alt=""><span>الخريطة</span></a>
  <a href="index.html?open=sections" aria-label="كل الأقسام"><img src="img/nav/sections.png" alt=""><span>كل الأقسام</span></a>
  <a href="index.html?open=room" aria-label="غرفتي"><img src="img/nav/room.png" alt=""><span>غرفتي</span></a>
  <a href="index.html?open=leaders" aria-label="المتصدرون، ترتيبك 12"><img src="img/nav/leaders.png" alt=""><span>المتصدرون</span><span class="rank">12</span></a>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="values.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { VALUES, state, stage, current } = Values;
  const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
  const WIDTH = [84, 78, 130, 230];
  const seen = { get: (v) => { try { return localStorage.getItem(`ajyal.value.seen.${v}`); } catch { return '1'; } }, set: (v) => { try { localStorage.setItem(`ajyal.value.seen.${v}`, '1'); } catch {} } };
  const mine = (v) => { try { return !!localStorage.getItem(`ajyal.value.${v}`); } catch { return false; } };

  function render() {
    const all = VALUES.map((v) => ({ v, s: state(v), g: stage(v) }));
    const bloom = all.filter((x) => x.s.complete).length;
    // the journey under way: the last one the child worked on
    const cur = current(), now = cur && all.find((x) => x.v === cur);
    $('cont').hidden = !now;
    if (now) {
      const next = now.v.stations.find((x) => x.req && !now.s.done.includes(x.id));
      $('cont').innerHTML = `<div class="art" aria-hidden="true"><img src="img/garden/v-${now.v.id}.jpg" alt=""></div>
        <div class="txt"><h2 id="cont-t">أكمل رحلتك مع نور</h2><b>رحلة ${now.v.name}</b>
        <small>أكملت ${ar(now.s.n)} من ${ar(now.s.all)} · التالية: ${next.name} <span class="meter" style="--p:${(now.s.n / now.s.all) * 100}%"><i></i></span></small></div>
        <a class="go" href="value.html?v=${now.v.id}">أكمل الرحلة <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14L6 12z" fill="#FFFFFF"/></svg></a>`;
    }
    // a value the child just completed grows in front of them, once
    const fresh = all.find((x) => x.s.complete && mine(x.v.id) && !seen.get(x.v.id));
    $('garden').innerHTML = `<div class="g-head"><b>حديقتك</b><small>أزهرت ${ar(bloom)} من ${ar(VALUES.length)} قيم <span class="meter" style="--p:${(bloom / VALUES.length) * 100}%"><i></i></span></small></div>
      <div class="g-hint">🌱 اضغط على أي نبتة لتبدأ رحلتها</div>
      ${all.map(({ v, s, g }) => {
        const label = s.complete ? '<small class="ok">✓ أزهرت</small>' : s.n ? `<small>${ar(s.n)} من ${ar(s.all)}</small>` : '<small>لم تبدأ بعد</small>';
        return `<a class="bed ${now && now.v === v ? 'now' : ''}" href="value.html?v=${v.id}" style="--x:${v.plot[0]}%;--y:${v.plot[1]}%;--c:${v.color};--w:${WIDTH[g]}px" aria-label="${v.name}، ${s.complete ? 'أزهرت' : s.n ? `${s.n} من ${s.all}` : 'لم تبدأ بعد'}">
          <img class="plant ${g === 3 ? 'sway' : ''} ${fresh && fresh.v === v ? 'grow' : ''}" src="img/garden/plant-${g}.png" alt="">
          <span class="sign"><b>${v.name}</b>${label}</span></a>`;
      }).join('')}
      ${now ? `<img class="nour" src="img/garden/nour-point.png" alt="" style="left:calc(${now.v.plot[0]}% + ${now.v.plot[0] > 50 ? 95 : -95}px);top:calc(${now.v.plot[1]}% + 10px);${now.v.plot[0] > 50 ? '' : 'scale:-1 1;'}">` : ''}`;
    $('vlist').innerHTML = all.map(({ v, s }) => `<a class="vcard" href="value.html?v=${v.id}" style="--c:${v.color}"><img src="img/garden/v-${v.id}.jpg" alt=""><b>${v.name}</b><small>${s.complete ? '✓ أزهرت' : s.n ? `أكملت ${ar(s.n)} من ${ar(s.all)}` : 'لم تبدأ بعد'}</small></a>`).join('');
    if (fresh) { seen.set(fresh.v.id); setTimeout(() => toast(`أزهرت شجرة ${fresh.v.name} في حديقتك!`, 4500), 900); $('garden').scrollIntoView({ block: 'center' }); }
    $('say').textContent = bloom ? `أهلاً يا يوسف! في حديقتك ${ar(bloom)} ${bloom === 1 ? 'شجرة مزهرة' : 'أشجار مزهرة'}، هيا نزرع المزيد` : 'أهلاً يا يوسف! أنا نور. كل قيمة نتعلمها تزرع شجرة في حديقتك';
    fit();
  }

  document.querySelector('.view').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('.view button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    $('garden').hidden = b.dataset.v !== 'garden'; $('vlist').hidden = b.dataset.v !== 'list'; fit();
  });
  const toast = (s, ms = 2400) => { const el = $('toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), ms); };

  // the board is drawn at 1440 wide; scale it to the window like the forest
  const page = $('page'), wrap = $('wrap');
  function fit() {
    const k = Math.min(innerWidth / 1440, 1.5);
    const x = Math.max(0, (innerWidth - 1440 * k) / 2);
    page.style.transform = 'translateX(' + x + 'px) scale(' + k + ')';
    // on small screens the names under the plants grow back so they stay readable
    page.style.setProperty('--ks', Math.max(1, 0.5 / k).toFixed(2));
    page.style.setProperty('--kh', Math.max(1, 0.4 / k).toFixed(2));
    page.style.setProperty('--kp', Math.min(2, Math.max(1, 0.45 / k)).toFixed(2));
    page.classList.toggle('small', 0.5 / k > 1.3);
    wrap.style.height = page.offsetHeight * k + 'px';
  }
  addEventListener('resize', fit);
  // coming back from a journey with the browser's back button shows the garden as it is now
  addEventListener('pageshow', (e) => { if (e.persisted) render(); });
  render();
})();
</script>
</body>
</html>
