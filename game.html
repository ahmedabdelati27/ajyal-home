<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظّف البحر · كثبان الألعاب</title>
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="game.css">
<style>
.scene { --scene: url(img/games/sea-scene.jpg); }

/* stage 1: trash bobs on the water, sea life swims by */
.trash { animation: bob 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes bob { 50% { translate: 0 -1.2cqh; rotate: 6deg; } }
.trash.got { animation: got .45s ease-in forwards; pointer-events: none; }
@keyframes got { to { transform: translate(-50%, -50%) scale(.2); opacity: 0; } }
.life { z-index: 1; width: 11cqw; animation: swim var(--t, 14s) linear infinite; animation-delay: var(--d, 0s); }
@keyframes swim { from { left: 108%; } to { left: -8%; } }
.life.oops img { animation: wiggle .5s; }
@keyframes wiggle { 25% { rotate: -12deg; } 75% { rotate: 12deg; } }

/* stage 2: each item goes into its bin */
.bins { position: absolute; z-index: 3; top: 16%; left: 0; right: 0; display: flex; justify-content: center; gap: 5cqw; }
.bin { position: relative; width: 20cqw; padding: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: .8cqh; cursor: pointer; }
.bin .lid { width: 100%; height: 3.2cqh; border-radius: 1.4cqw 1.4cqw .6cqw .6cqw; background: var(--c); box-shadow: inset 0 -.5cqh 0 rgba(0,0,0,.15); }
.bin .box { position: relative; width: 86%; height: 24cqh; border-radius: .6cqw .6cqw 2.2cqw 2.2cqw; background: var(--c); box-shadow: inset 0 -1.2cqh 0 rgba(0,0,0,.12), 0 .8cqh 0 rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6cqh; color: #FFFFFF; font-size: 2.4cqw; font-weight: 800; }
.bin .box img { width: 7cqw; height: 7cqw; object-fit: contain; filter: drop-shadow(0 .3cqw 0 rgba(0,0,0,.2)); }
.bin.hot .box, .bin.hot .lid { filter: brightness(1.12); transform: translateY(-.6cqh); }
.bin.ok .box { animation: gulp .4s; }
.bin.hint .box { animation: glowbin .7s ease-in-out 3; }
@keyframes glowbin { 50% { box-shadow: 0 0 0 .8cqw #FFE38A, 0 0 3cqw #FFD94A; transform: translateY(-.8cqh); } }
@keyframes gulp { 40% { transform: scale(1.06, .94); } }

@media (max-width: 760px) {
  .life { width: 18cqw; }
  .bins { top: 12%; gap: 3cqw; } .bin { width: 28cqw; } .bin .box { height: 20cqh; font-size: 4.2cqw; } .bin .box img { width: 11cqw; height: 11cqw; } .bin .lid { height: 2.6cqh; }
}
@media (prefers-reduced-motion: reduce) { .trash { animation-duration: .01s; } .life { animation: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <a class="pill back" href="games.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>كثبان الألعاب</span></a>
    <div class="ttl"><img src="img/games/g-01.jpg" alt=""><h1>نظّف البحر</h1></div>
    <span class="pill time" title="الوقت المتبقي اليوم"><img src="img/forest/I-10.png" alt=""><span id="left">35 د</span></span>
  </header>

  <main class="stage">
    <section class="scene" id="scene" aria-label="البحر">
      <div class="hud" aria-live="polite"><span id="stage-label"></span><span id="count"></span></div>
      <div id="play"></div>
      <div class="fox" aria-live="polite"><img src="img/games/fox.png" alt=""><p id="tip"></p></div>
      <div class="over" id="over" hidden></div>
    </section>
  </main>
</div>

<div class="resume" id="resume">
  <div>
    <p>توقفت عند <b id="at">البداية</b></p>
    <div class="btns">
      <button class="btn go" id="go-on" type="button">أكمل من حيث توقفت</button>
      <button class="btn soft" id="restart" type="button">من البداية</button>
    </div>
  </div>
</div>

<div class="done stop" id="stop" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="stop-t">
    <img class="owl" src="img/games/fox.png" alt="">
    <h2 id="stop-t">انتهى وقت اليوم</h2>
    <p>حفظنا مكانك عند <b id="kept">البداية</b>، وتكمل من هنا في المرة القادمة</p>
    <div class="btns">
      <a class="btn go" href="#" id="ask">اطلب وقتاً إضافياً من ولي أمرك أو معلّمك</a>
      <a class="btn soft" href="index.html">العودة إلى الخريطة</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="sfx.js"></script>
<script>Sfx.taps('.btn, .pill');</script>
<script src="viewer.js"></script>
<script src="game.js"></script>
<script>
(() => {
  const { $ } = Viewer;
  const { ar } = Game;
  const { play, over, scene, tip, nudge, pop, cheer, result, miss } = Game.kit();
  const q = new URLSearchParams(location.search);
  // a game the admin sets up from supported types: tap to collect, then drag to sort.
  // items, positions and the completion condition are the game's data
  const KIND = { bottle: { img: 'item-01', bin: 'plastic', name: 'زجاجة بلاستيك' }, can: { img: 'item-02', bin: 'metal', name: 'علبة معدنية' }, paper: { img: 'item-03', bin: 'paper', name: 'ورقة' }, bag: { img: 'item-04', bin: 'plastic', name: 'كيس بلاستيك' } };
  const TRASH = [['bottle', 22, 34], ['can', 41, 58], ['paper', 63, 30], ['bag', 80, 52], ['bottle', 52, 76], ['can', 15, 68], ['paper', 72, 74], ['bottle', 34, 18]];
  const LIFE = [{ img: 'item-05', name: 'سمكة', y: 46, t: 15, d: 0 }, { img: 'item-06', name: 'سلحفاة', y: 64, t: 22, d: -8 }, { img: 'item-07', name: 'قنديل البحر', y: 26, t: 26, d: -14 }];
  const BINS = [{ id: 'plastic', name: 'بلاستيك', c: '#3D96D6', icon: 'item-01' }, { id: 'metal', name: 'معادن', c: '#E8A417', icon: 'item-02' }, { id: 'paper', name: 'ورق', c: '#4CA64C', icon: 'item-03' }];
  const STEPS = ['البداية', 'المرحلة ١: اجمع المخلفات', 'المرحلة ٢: رتّب المخلفات', 'النتيجة'];
  const XP = 25; // from gamification when completing the game is eligible
  let got = 0, sorted = 0;

  function show(i) {
    scene.classList.toggle('lift', i === 2);
    over.hidden = !(i === 0 || i === 3);
    $('stage-label').textContent = i === 1 ? 'المرحلة ١ من ٢' : i === 2 ? 'المرحلة ٢ من ٢' : 'نظّف البحر';
    play.innerHTML = '';
    [start, collect, sort, finish][i]();
  }

  function start() {
    $('count').textContent = 'لعبة من عالم البيئة';
    tip('هيا ننظّف البحر معاً!');
    over.innerHTML = `<div class="box2"><h2>نظّف البحر</h2>
      <p>المرحلة ١: اضغط على المخلفات لتجمعها، واترك الكائنات البحرية تسبح بأمان.<br>المرحلة ٢: ضع كل مخلّف في الحاوية المناسبة.</p>
      <div class="how"><span><img src="img/games/item-01.png" alt="">اجمعها</span><span><img src="img/games/item-05.png" alt="">اتركها</span></div>
      <button class="btn go" id="begin" type="button">ابدأ اللعب</button></div>`;
  }

  // ---- stage 1: tap the trash, leave the sea life alone
  function collect() {
    got = 0;
    play.innerHTML = LIFE.map((l) => `<button class="thing life" type="button" data-life="${l.name}" style="top:${l.y}%;--t:${l.t}s;--d:${l.d}s" aria-label="${l.name}"><img src="img/games/${l.img}.png" alt=""></button>`).join('')
      + TRASH.map(([k, x, y], n) => `<button class="thing trash" type="button" data-k="${k}" style="left:${x}%;top:${y}%;--d:-${n * 0.4}s" aria-label="${KIND[k].name}"><img src="img/games/${KIND[k].img}.png" alt=""></button>`).join('');
    count1(); tip('اضغط على المخلفات لتجمعها!');
  }
  const count1 = () => { $('count').innerHTML = `<img src="img/games/item-01.png" alt="">جمعت ${ar(got)} من ${ar(TRASH.length)}`; };
  play.addEventListener('click', (e) => {
    const t = e.target.closest('.trash'); const l = e.target.closest('.life');
    if (t && !t.classList.contains('got')) {
      t.classList.add('got'); got++; count1(); pop(t, '✓');
      tip(got < TRASH.length ? ['رائع!', 'أحسنت!', 'هيا، ما زال هناك المزيد!'][got % 3] : 'أحسنت! البحر صار أنظف!');
      if (got === TRASH.length) cheer(() => game.next());
    }
    if (l) { nudge(l, 'oops'); tip(`هذه ${l.dataset.life}! نتركها تسبح بأمان`); }
  });

  // ---- stage 2: drag (or tap, then tap) each item into its bin; a wrong bin just sends it back
  function sort() {
    sorted = 0; drop.reset();
    play.innerHTML = `<div class="bins">${BINS.map((b) => `<button class="bin" type="button" data-bin="${b.id}" style="--c:${b.c}" aria-label="حاوية ${b.name}"><span class="lid"></span><span class="box"><img src="img/games/${b.icon}.png" alt="">${b.name}</span></button>`).join('')}</div>
      <div class="tray">${TRASH.map(([k]) => `<button class="thing" type="button" data-k="${k}" aria-label="${KIND[k].name}"><img src="img/games/${KIND[k].img}.png" alt=""></button>`).join('')}</div>`;
    count2(); tip('اسحب كل مخلّف إلى الحاوية المناسبة');
  }
  const count2 = () => { $('count').innerHTML = `<img src="img/games/item-02.png" alt="">رتّبت ${ar(sorted)} من ${ar(TRASH.length)}`; };
  const drop = Game.place({ root: play, items: '.tray .thing', targets: '.bin',
    onPick: () => tip('الآن اضغط على الحاوية المناسبة'),
    onDrop(item, bin) {
      const right = KIND[item.dataset.k].bin;
      if (right !== bin.dataset.bin) return miss(item, play.querySelector(`.bin[data-bin="${right}"]`), 'ليست هنا! جرّب حاوية أخرى', 'هذه هي الحاوية المناسبة، جرّب مرة أخرى');
      item.remove(); sorted++; count2();
      nudge(bin, 'ok'); pop(bin, '✓');
      tip(sorted < TRASH.length ? 'صحيح! أحسنت' : 'رائع! رتّبت كل المخلفات');
      if (sorted === TRASH.length) cheer(() => game.next());
    } });

  // ---- result: a simple celebration, no score, lives or coins
  function finish() {
    $('count').textContent = 'البحر نظيف!';
    tip('شكراً لك! الكائنات البحرية سعيدة');
    play.innerHTML = LIFE.map((l) => `<span class="thing life" style="top:${l.y}%;--t:${l.t}s;--d:${l.d}s"><img src="img/games/${l.img}.png" alt=""></span>`).join('');
    result({ id: 'sea', title: 'أحسنت يا يوسف!', text: 'جمعت المخلفات ورتّبتها، وصار البحر نظيفاً وجميلاً', xp: XP, next: 'نظّف الحديقة' });
    game.clear();
  }
  over.addEventListener('click', (e) => {
    const id = e.target.closest('button')?.id;
    if (id === 'begin') game.next();
    if (id === 'again') game.go(1);
    if (id === 'next-game') game.toast('في النموذج: «نظّف الحديقة» بنفس طريقة اللعب');
  });

  // the dunes card opens stage 2 for the demo; finishing a stage moves on, nothing is ever "game over"
  const game = Viewer.pages({ steps: 4, key: 'ajyal.game.sea', start: q.get('resume') === '1' ? 2 : 0, label: (i) => STEPS[i], onShow: show, canNext: (i) => (i === 1 ? got === TRASH.length : i === 2 ? sorted === TRASH.length : true) });
})();
</script>
</body>
</html>
